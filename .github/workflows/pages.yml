# Publie ce dépôt sur GitHub Pages à chaque push.
#
# Pourquoi un workflow plutôt que le réglage « Deploy from a branch » : celui-ci
# demande un clic dans les Settings du dépôt, et le serveur qui construit l'app
# n'a qu'une clé SSH — pas de jeton d'API. `configure-pages` avec
# `enablement: true` active Pages depuis le dépôt lui-même, au premier passage.
#
# Si le jeton du workflow n'a pas le droit `pages: write` (Settings → Actions →
# General → Workflow permissions → « Read and write »), l'étape échoue proprement
# et il reste le réglage manuel : Settings → Pages → Deploy from a branch →
# main / (root). Rien d'autre ne casse.
name: Publier ONZE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# une seule publication à la fois ; la plus récente gagne
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploiement
        uses: actions/deploy-pages@v4
