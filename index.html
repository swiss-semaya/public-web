<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ONZE">
<meta name="theme-color" content="#EFF2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151B" media="(prefers-color-scheme: dark)">
<meta name="description" content="ONZE — entraînement quotidien : français, allemand, anglais, maths.">
</head>
<body>
<title>ONZE — cap sur la 11e</title>

<style>
/* ============================================================
   ONZE — tableau d'entraînement scolaire (10VG → 11VG)
   Tokens d'abord : thème clair par défaut, sombre redéfini
   ============================================================ */
:root{
  color-scheme: light dark;

  --bg:#EFF2F6;
  --panel:#FFFFFF;
  --panel-2:#E7ECF2;
  --line:#D5DDE6;
  --line-soft:#E4EAF1;
  --ink:#141D26;
  --ink-2:#495A6B;
  --ink-3:#7A8B9C;

  --accent:#D65B15;
  --accent-2:#B44A0F;
  --accent-ink:#FFFFFF;
  --accent-soft:#FAE5D7;

  --ok:#1B7F58;
  --ok-soft:#DBF0E5;
  --ko:#B8352A;
  --ko-soft:#F8E3E0;

  --fr:#AE3B66;   --fr-soft:#F7E2EB;
  --de:#96690F;   --de-soft:#F6E9CE;
  --en:#2A6389;   --en-soft:#DFEAF3;
  --ma:#1A7D61;   --ma-soft:#D9EFE7;
  --mix:#5F49AB;  --mix-soft:#E6E1F6;

  --shadow: 0 1px 2px rgba(20,29,38,.06), 0 8px 24px rgba(20,29,38,.06);
  --shadow-lift: 0 2px 4px rgba(20,29,38,.08), 0 14px 34px rgba(20,29,38,.12);

  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:26px;

  --display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Helvetica,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F151B;
    --panel:#18212A;
    --panel-2:#212C36;
    --line:#2A3742;
    --line-soft:#222D37;
    --ink:#E7EEF4;
    --ink-2:#A8B8C6;
    --ink-3:#7A8B9A;

    --accent:#FF8A3D;
    --accent-2:#FFA469;
    --accent-ink:#20140B;
    --accent-soft:#3A2415;

    --ok:#4FC98F;
    --ok-soft:#173327;
    --ko:#F0705F;
    --ko-soft:#3A1F1C;

    --fr:#EE7EA3;  --fr-soft:#3A1F2B;
    --de:#E0B14C;  --de-soft:#33280F;
    --en:#6FB1DC;  --en-soft:#152A38;
    --ma:#4FCBA4;  --ma-soft:#123026;
    --mix:#A796EC; --mix-soft:#252047;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.34);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.45), 0 18px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --panel:#18212A; --panel-2:#212C36; --line:#2A3742; --line-soft:#222D37;
  --ink:#E7EEF4; --ink-2:#A8B8C6; --ink-3:#7A8B9A;
  --accent:#FF8A3D; --accent-2:#FFA469; --accent-ink:#20140B; --accent-soft:#3A2415;
  --ok:#4FC98F; --ok-soft:#173327; --ko:#F0705F; --ko-soft:#3A1F1C;
  --fr:#EE7EA3; --fr-soft:#3A1F2B; --de:#E0B14C; --de-soft:#33280F;
  --en:#6FB1DC; --en-soft:#152A38; --ma:#4FCBA4; --ma-soft:#123026;
  --mix:#A796EC; --mix-soft:#252047;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.34);
  --shadow-lift: 0 2px 6px rgba(0,0,0,.45), 0 18px 40px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#EFF2F6; --panel:#FFFFFF; --panel-2:#E7ECF2; --line:#D5DDE6; --line-soft:#E4EAF1;
  --ink:#141D26; --ink-2:#495A6B; --ink-3:#7A8B9C;
  --accent:#D65B15; --accent-2:#B44A0F; --accent-ink:#FFFFFF; --accent-soft:#FAE5D7;
  --ok:#1B7F58; --ok-soft:#DBF0E5; --ko:#B8352A; --ko-soft:#F8E3E0;
  --fr:#AE3B66; --fr-soft:#F7E2EB; --de:#96690F; --de-soft:#F6E9CE;
  --en:#2A6389; --en-soft:#DFEAF3; --ma:#1A7D61; --ma-soft:#D9EFE7;
  --mix:#5F49AB; --mix-soft:#E6E1F6;
  --shadow: 0 1px 2px rgba(20,29,38,.06), 0 8px 24px rgba(20,29,38,.06);
  --shadow-lift: 0 2px 4px rgba(20,29,38,.08), 0 14px 34px rgba(20,29,38,.12);
}

*{box-sizing:border-box;}
body{margin:0;}
#onze{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  min-height:100vh; -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px; margin:0 auto; padding:0 16px 56px;}

/* ---------- Bandeau-score ---------- */
.board{
  background:var(--panel); border-bottom:1px solid var(--line);
  padding:18px 0 0;
}
.board-in{max-width:560px; margin:0 auto; padding:0 16px 16px;}
.brand{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
.brand h1{
  font-family:var(--display); font-size:30px; letter-spacing:.10em; text-transform:uppercase;
  margin:0; font-weight:700; line-height:1;
}
.brand h1 span{color:var(--accent);}
.brand .tag{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.12em;
  font-size:11px; color:var(--ink-3);
}
.brand .tag sup{text-transform:lowercase; font-size:.7em;}
.theme-btn{
  background:transparent; border:1px solid var(--line); color:var(--ink-2);
  border-radius:999px; width:32px; height:32px; font-size:14px; cursor:pointer; line-height:1;
}
.theme-btn:hover{border-color:var(--ink-3);}

.scores{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px;}
@media (max-width:460px){ .scores{grid-template-columns:repeat(2,1fr);} }
.score{
  background:var(--panel-2); border-radius:var(--r-m); padding:10px 12px;
  display:flex; flex-direction:column; gap:2px;
}
.score .k{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.1em;
  font-size:10px; color:var(--ink-3);
}
.score .v{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:22px; font-weight:600; line-height:1.1;
}
.score.hot .v{color:var(--accent);}

.weekbar{margin-top:14px;}
.weekbar .lab{
  display:flex; justify-content:space-between; align-items:baseline;
  font-family:var(--display); text-transform:uppercase; letter-spacing:.1em;
  font-size:10px; color:var(--ink-3); margin-bottom:6px;
}
.weekbar .lab span{white-space:nowrap;}
.meter{height:6px; background:var(--panel-2); border-radius:999px; overflow:hidden;}
.meter i{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .5s cubic-bezier(.2,.8,.2,1);}

/* ---------- Sections ---------- */
.sec{margin-top:26px;}
.sec-h{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px;
}
.sec-h h2{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.12em;
  font-size:12px; color:var(--ink-2); margin:0; font-weight:700;
}
.sec-h .note{font-size:11px; color:var(--ink-3); font-family:var(--mono);}

/* ---------- Blocs du jour ---------- */
.blocks{display:flex; flex-direction:column; gap:10px;}
.block{
  width:100%; text-align:left; cursor:pointer;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-l);
  padding:14px 16px 14px 14px; box-shadow:var(--shadow);
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px;
  color:inherit; font:inherit;
  transition:transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s ease, border-color .16s ease;
}
.block:hover:not(:disabled){transform:translateY(-2px); box-shadow:var(--shadow-lift); border-color:var(--ink-3);}
.block:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
.block:disabled{cursor:default; opacity:.72;}
/* le grand défi : il se voit, sinon il n'est pas une récompense */
.block.or{border-color:var(--accent); background:linear-gradient(180deg,var(--accent-soft),var(--panel) 70%);}
.block.or .num{color:var(--accent);}
.block .num{
  font-family:var(--display); font-size:26px; line-height:1; color:var(--ink-3);
  font-variant-numeric:tabular-nums; width:26px; text-align:center;
}
.block .ttl{display:block; font-family:var(--display); text-transform:uppercase; letter-spacing:.06em; font-size:17px; font-weight:700; line-height:1.15;}
.block .sub{display:block; font-size:12.5px; color:var(--ink-2); margin-top:4px; line-height:1.4;}
.block .go{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:11px;
  background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:7px 12px; white-space:nowrap;
}
.block.done .go{background:var(--ok-soft); color:var(--ok);}
.block .mid{min-width:0; overflow:hidden;}
.block .chips{display:flex; gap:4px; flex-wrap:wrap; margin-top:7px; max-width:100%;}

.chip{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.07em;
  font-size:10px; font-weight:700; padding:3px 7px; border-radius:5px; white-space:nowrap;
  display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; vertical-align:middle;
}
.chip.francais{background:var(--fr-soft); color:var(--fr);}
.chip.allemand{background:var(--de-soft); color:var(--de);}
.chip.anglais{background:var(--en-soft); color:var(--en);}
.chip.maths{background:var(--ma-soft); color:var(--ma);}
.chip.mix{background:var(--mix-soft); color:var(--mix);}

/* ---------- Maîtrise ---------- */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-l);
  padding:14px 16px; box-shadow:var(--shadow);
}
.mrow{display:grid; grid-template-columns:74px 1fr 78px; align-items:center; gap:10px; padding:9px 0;}
.mrow + .mrow{border-top:1px solid var(--line-soft);}
.mrow .nm{font-family:var(--display); text-transform:uppercase; letter-spacing:.07em; font-size:13px; font-weight:700;}
.mrow .bar{height:8px; background:var(--panel-2); border-radius:999px; overflow:hidden;}
.mrow .bar i{display:block; height:100%; border-radius:999px; transition:width .6s cubic-bezier(.2,.8,.2,1);}
.mrow .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-2); text-align:right;}
.mrow .val b{color:var(--ink); font-weight:600;}

.boxes{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:12px;}
.boxcell{background:var(--panel-2); border-radius:var(--r-s); padding:8px 4px; text-align:center;}
.boxcell .n{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:16px; font-weight:600;}
.boxcell .l{font-family:var(--display); text-transform:uppercase; letter-spacing:.06em; font-size:9px; color:var(--ink-3); margin-top:2px;}
.boxcell.b5 .n{color:var(--ok);}

.weak{display:flex; flex-direction:column; gap:8px;}
.weak-row{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px;}
.weak-row .t{display:flex; align-items:center; gap:8px; min-width:0;}
.weak-row .t span.nmm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.weak-row .pc{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-3); white-space:nowrap; flex:0 0 auto;}
.weak-row .chip{flex:0 0 auto; max-width:none;}
.empty{font-size:13px; color:var(--ink-3); line-height:1.5;}

/* ---------- Calendrier ---------- */
.cal-head{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:6px;}
.cal-head div{
  text-align:center; font-family:var(--display); text-transform:uppercase;
  letter-spacing:.08em; font-size:9.5px; color:var(--ink-3);
}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.cd{
  aspect-ratio:1; border-radius:var(--r-s); background:var(--panel-2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11px; color:var(--ink-3);
  position:relative;
}
.cd.void{background:transparent;}
.cd.future{opacity:.5;}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent); color:var(--ink);}
.cd.full{background:var(--accent); color:var(--accent-ink);}
.cd.full .pips i{background:var(--accent-ink); opacity:.9;}
.cd .pips{display:flex; gap:2.5px; height:4px;}
.cd .pips i{width:4px; height:4px; border-radius:50%; background:var(--ink-3);}
.cd .school{position:absolute; inset:0; border-radius:var(--r-s); box-shadow:inset 0 0 0 1.5px var(--ink-3);}

.badges{display:flex; flex-wrap:wrap; gap:7px;}
.badge{
  display:flex; align-items:center; gap:6px; font-size:12px;
  background:var(--panel-2); border-radius:999px; padding:6px 11px; color:var(--ink-2);
}
.badge.on{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.badge.on .em{filter:none;}
.badge .em{filter:grayscale(1) opacity(.5);}

.alerte{
  margin-top:26px; background:var(--ko-soft); color:var(--ko);
  border-radius:var(--r-m); padding:12px 15px; font-size:13px; line-height:1.5;
}
.alerte b{display:block; margin-bottom:2px;}
.foot{margin-top:30px; display:flex; justify-content:center; align-items:center; gap:8px 18px; flex-wrap:wrap;}
.link{
  background:none; border:none; color:var(--ink-3); font-size:11.5px; cursor:pointer;
  text-decoration:underline; text-underline-offset:3px; font-family:var(--body);
}
.link:hover{color:var(--ink-2);}

/* ---------- Session ---------- */
.s-top{
  position:sticky; top:0; z-index:5; background:var(--bg);
  padding:12px 0 10px; border-bottom:1px solid var(--line-soft);
}
.s-top-in{display:flex; align-items:center; gap:12px;}
.quit{
  background:transparent; border:1px solid var(--line); color:var(--ink-2); cursor:pointer;
  width:30px; height:30px; border-radius:999px; font-size:15px; line-height:1; flex:0 0 auto;
}
.quit:hover{border-color:var(--ko); color:var(--ko);}
.prog{flex:1; height:6px; background:var(--panel-2); border-radius:999px; overflow:hidden;}
.prog i{display:block; height:100%; background:var(--accent); transition:width .35s cubic-bezier(.2,.8,.2,1);}
.combo{
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-3);
  min-width:52px; text-align:right;
}
.combo.hot{color:var(--accent); font-weight:600;}

.lesson{margin-top:18px;}
.lesson .kicker{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.14em;
  font-size:10px; color:var(--ink-3); margin-bottom:8px;
}
.lesson h3{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.04em;
  font-size:24px; margin:0 0 4px; font-weight:700; text-wrap:balance; line-height:1.1;
}
.lesson .why{font-size:13px; color:var(--ink-2); margin-bottom:14px;}
.pts{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px;}
.pts li{display:grid; grid-template-columns:auto 1fr; gap:10px; font-size:14.5px; line-height:1.5;}
.pts li .d{
  width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:8px;
}
.exbox{
  margin-top:14px; background:var(--panel-2); border-radius:var(--r-m); padding:12px 14px;
  font-size:13.5px; line-height:1.55; color:var(--ink-2);
}
.exbox b{color:var(--ink);}
.lesson em, .exbox em{color:var(--accent); font-style:normal; font-weight:600;}
.exbox .lab{
  display:block; font-family:var(--display); text-transform:uppercase; letter-spacing:.12em;
  font-size:9.5px; color:var(--ink-3); margin-bottom:5px;
}
.cta{
  width:100%; margin-top:18px; background:var(--accent); color:var(--accent-ink);
  border:none; border-radius:var(--r-m); padding:15px 18px; cursor:pointer;
  font-family:var(--display); text-transform:uppercase; letter-spacing:.1em; font-size:15px; font-weight:700;
  transition:transform .1s ease, background .2s ease;
}
.cta:hover{background:var(--accent-2);}
.cta:active{transform:scale(.985);}
.cta:disabled{opacity:.38; cursor:default;}
.cta:disabled:hover{background:var(--accent);}
.cta.ghost{background:transparent; color:var(--ink-2); border:1px solid var(--line);}
.cta.ghost:hover{background:var(--panel-2); color:var(--ink);}
/* « Vérifier » tant que le champ est vide : éteint, mais toujours cliquable —
   un bouton mort ne dit pas POURQUOI il est mort (voir bindQuiz). */
/* le porte-monnaie */
.pm-big{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
.pm-big .k{font-family:var(--display); text-transform:uppercase; letter-spacing:.1em; font-size:11px; color:var(--ink-3);}
.pm-big .v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:30px; font-weight:700; color:var(--accent);}
.pm-big .v small{font-size:14px; color:var(--ink-3); font-weight:500;}
.pm-lig{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; font-size:13.5px; color:var(--ink-2);}
.pm-lig b{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink);}
.pm-tarif{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-3); line-height:1.55;}
.pm-jours{margin-top:8px; padding-top:6px; border-top:1px solid var(--line);}
/* le bilan à copier, quand la page n'a pas le droit d'écrire un fichier */
.sheet{position:fixed; inset:0; background:rgba(10,14,18,.55); z-index:60;
  display:flex; align-items:flex-end; justify-content:center; padding:16px;}
.sheet-in{background:var(--panel); border-radius:var(--r-l); padding:18px;
  width:100%; max-width:560px; max-height:86vh; overflow:auto; box-shadow:var(--shadow-lift);}
.sheet-in h3{margin:0 0 8px; font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:15px;}
.sheet-in p{margin:0 0 12px; font-size:13.5px; color:var(--ink-2); line-height:1.5;}
.sheet-in textarea{width:100%; height:34vh; font-family:var(--mono); font-size:11px;
  border:1px solid var(--line); border-radius:var(--r-m); padding:10px;
  background:var(--panel-2); color:var(--ink-2); resize:vertical;}
.cta.off{opacity:.38;}
.cta.off:hover{background:var(--accent);}
.vide{font-size:12.5px; color:var(--ko); margin-top:10px; line-height:1.45;}
.cta-row{display:flex; gap:10px; margin-top:14px;}
.cta-row .cta{margin-top:0;}

.q{margin-top:18px;}
.q .meta{display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.q .meta .th{font-size:11.5px; color:var(--ink-3); font-family:var(--mono);}
.q .txt{
  font-size:20px; line-height:1.45; font-weight:500; text-wrap:pretty; margin-bottom:18px;
}
.q .txt em{color:var(--accent); font-style:normal; font-weight:600;}
.q .hint{font-size:12.5px; color:var(--ink-3); margin:-10px 0 16px;}

.opts{display:flex; flex-direction:column; gap:8px;}
.opt{
  text-align:left; background:var(--panel); border:1px solid var(--line); color:var(--ink);
  border-radius:var(--r-m); padding:13px 15px; font-size:15.5px; cursor:pointer; font-family:var(--body);
  display:flex; align-items:center; gap:10px;
  transition:border-color .15s ease, background .15s ease, transform .1s ease;
}
.opt:hover:not(:disabled){border-color:var(--ink-3); background:var(--panel-2);}
.opt:active:not(:disabled){transform:scale(.99);}
.opt:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.opt .key{
  font-family:var(--mono); font-size:11px; color:var(--ink-3); border:1px solid var(--line);
  border-radius:5px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.opt:disabled{cursor:default;}
.opt.good{background:var(--ok-soft); border-color:var(--ok); color:var(--ok);}
.opt.good .key{border-color:var(--ok); color:var(--ok);}
.opt.bad{background:var(--ko-soft); border-color:var(--ko); color:var(--ko);}
.opt.bad .key{border-color:var(--ko); color:var(--ko);}

.inp{
  width:100%; padding:14px 15px; font-size:17px; border-radius:var(--r-m);
  border:1px solid var(--line); background:var(--panel); color:var(--ink); font-family:var(--body);
}
.inp:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
.inp.good{border-color:var(--ok); background:var(--ok-soft);}
.inp.bad{border-color:var(--ko); background:var(--ko-soft);}

.words{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px;}
.word{
  background:var(--panel); border:1px solid var(--line); color:var(--ink); cursor:pointer;
  border-radius:var(--r-s); padding:9px 12px; font-size:15px; font-family:var(--body);
}
.word:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
.word:disabled{opacity:.3; cursor:default;}
.slot{
  min-height:52px; border:1.5px dashed var(--line); border-radius:var(--r-m);
  padding:8px; display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:10px;
  background:var(--panel-2);
}
.slot.good{border-color:var(--ok); border-style:solid; background:var(--ok-soft);}
.slot.bad{border-color:var(--ko); border-style:solid; background:var(--ko-soft);}
.slot .ph{font-size:12.5px; color:var(--ink-3); padding:0 4px;}

/* relier deux colonnes : on tape à gauche, puis à droite. Le lien se lit au
   numéro porté par les deux tuiles — pas de trait à tracer, ça tient sur un
   téléphone et ça reste lisible quand les paires se croisent. */
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px;}
.pcol{display:flex; flex-direction:column; gap:7px;}
.pw{
  position:relative; text-align:left; background:var(--panel); border:1px solid var(--line);
  color:var(--ink); cursor:pointer; border-radius:var(--r-s); padding:10px 12px;
  font-size:14.5px; font-family:var(--body); line-height:1.3; min-height:42px;
  display:flex; align-items:center; gap:7px;
}
.pw:hover:not(:disabled){border-color:var(--accent);}
.pw.sel{border-color:var(--accent); background:var(--accent-soft); color:var(--accent);}
.pw.lie{border-style:solid; border-color:var(--ink-3);}
.pw.good{background:var(--ok-soft); border-color:var(--ok); color:var(--ok);}
.pw.bad{background:var(--ko-soft); border-color:var(--ko); color:var(--ko);}
.pw:disabled{cursor:default;}
.pn{
  flex:0 0 auto; width:19px; height:19px; border-radius:50%; font-size:11px;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--ink-3); color:var(--panel); font-family:var(--mono);
}
.pw.good .pn{background:var(--ok); color:var(--panel);}
.pw.bad .pn{background:var(--ko); color:var(--panel);}

.fb{
  margin-top:14px; border-radius:var(--r-m); padding:13px 15px; font-size:14px; line-height:1.5;
  animation:rise .28s cubic-bezier(.2,.8,.2,1);
}
.fb .hd{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.1em; font-size:11px;
  display:flex; align-items:center; gap:7px; margin-bottom:5px; font-weight:700;
}
.fb.ok{background:var(--ok-soft); color:var(--ok);}
.fb.ko{background:var(--ko-soft); color:var(--ko);}
.fb .sol{color:var(--ink); font-weight:600;}
.fb .exp{color:var(--ink-2); margin-top:4px;}
@keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  max-width:min(460px, calc(100vw - 32px));
  background:var(--ink); color:var(--bg); border-radius:var(--r-m);
  padding:12px 16px; font-size:13.5px; line-height:1.45; text-align:center;
  box-shadow:var(--shadow-lift); z-index:30; pointer-events:none;
  animation:rise .25s cubic-bezier(.2,.8,.2,1);
}

.xpfly{
  position:fixed; left:50%; bottom:22%; transform:translateX(-50%);
  font-family:var(--display); font-size:22px; letter-spacing:.06em; color:var(--accent);
  pointer-events:none; animation:fly 1s ease-out forwards; z-index:20; font-weight:700;
}
@keyframes fly{0%{opacity:0; transform:translate(-50%,10px) scale(.9);} 25%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-60px) scale(1.05);}}

/* ---------- Bilan ---------- */
.done-wrap{padding:34px 0 10px; text-align:center;}
.done-wrap .ring{position:relative; width:132px; height:132px; margin:0 auto 18px;}
.done-wrap .ring svg{transform:rotate(-90deg);}
.done-wrap .ring .mid{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.done-wrap .ring .pc{font-family:var(--mono); font-size:30px; font-weight:600; font-variant-numeric:tabular-nums;}
.done-wrap .ring .of{font-family:var(--display); text-transform:uppercase; letter-spacing:.1em; font-size:10px; color:var(--ink-3);}
.done-wrap h2{font-family:var(--display); text-transform:uppercase; letter-spacing:.06em; font-size:26px; margin:0 0 6px; text-wrap:balance;}
.done-wrap .line{font-size:14px; color:var(--ink-2); margin-bottom:4px;}
.gain{display:flex; justify-content:center; gap:10px; margin:16px 0 4px; flex-wrap:wrap;}
.gain .g{background:var(--panel-2); border-radius:var(--r-m); padding:9px 13px; text-align:left;}
.gain .g .k{font-family:var(--display); text-transform:uppercase; letter-spacing:.09em; font-size:9.5px; color:var(--ink-3);}
.gain .g .v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:17px; font-weight:600;}
.moves{margin-top:18px; text-align:left;}
.move{display:flex; align-items:center; gap:9px; font-size:13px; padding:7px 0; border-bottom:1px solid var(--line-soft);}
.move:last-child{border-bottom:none;}
.move .ar{font-family:var(--mono); font-size:12px; color:var(--ink-3);}
.move .up{color:var(--ok); font-weight:600;}
.move .dn{color:var(--ko); font-weight:600;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}
@media (max-width:400px){
  .brand h1{font-size:26px;}
  .q .txt{font-size:18.5px;}
  .scores{gap:7px;}
  .score{padding:9px 10px;}
  .score .v{font-size:19px;}
}

/* --- générateurs français : réserve infinie --- */
(function(){
  const P = ["je","tu","il","nous","vous","ils"];
  const V = [
    {i:"être",    pr:["suis","es","est","sommes","êtes","sont"],            im:["étais","étais","était","étions","étiez","étaient"],                pp:"été",   aux:"a"},
    {i:"avoir",   pr:["ai","as","a","avons","avez","ont"],                  im:["avais","avais","avait","avions","aviez","avaient"],                pp:"eu",    aux:"a"},
    {i:"aller",   pr:["vais","vas","va","allons","allez","vont"],           im:["allais","allais","allait","allions","alliez","allaient"],          pp:"allé",  aux:"e"},
    {i:"faire",   pr:["fais","fais","fait","faisons","faites","font"],      im:["faisais","faisais","faisait","faisions","faisiez","faisaient"],    pp:"fait",  aux:"a"},
    {i:"prendre", pr:["prends","prends","prend","prenons","prenez","prennent"], im:["prenais","prenais","prenait","prenions","preniez","prenaient"], pp:"pris", aux:"a"},
    {i:"pouvoir", pr:["peux","peux","peut","pouvons","pouvez","peuvent"],   im:["pouvais","pouvais","pouvait","pouvions","pouviez","pouvaient"],    pp:"pu",    aux:"a"},
    {i:"venir",   pr:["viens","viens","vient","venons","venez","viennent"], im:["venais","venais","venait","venions","veniez","venaient"],          pp:"venu",  aux:"e"},
    {i:"voir",    pr:["vois","vois","voit","voyons","voyez","voient"],      im:["voyais","voyais","voyait","voyions","voyiez","voyaient"],          pp:"vu",    aux:"a"},
    {i:"finir",   pr:["finis","finis","finit","finissons","finissez","finissent"], im:["finissais","finissais","finissait","finissions","finissiez","finissaient"], pp:"fini", aux:"a"},
    {i:"écrire",  pr:["écris","écris","écrit","écrivons","écrivez","écrivent"], im:["écrivais","écrivais","écrivait","écrivions","écriviez","écrivaient"], pp:"écrit", aux:"a"}
  ];
  const AVOIR = ["ai","as","a","avons","avez","ont"];
  const ETRE  = ["suis","es","est","sommes","êtes","sont"];
  const rnd = n => Math.floor(Math.random()*n);
  const eli = (p, f) => (p === "je" && /^[aeiouéêh]/i.test(f)) ? "j'"+f : p+" "+f;

  GENS["fr-conj"] = function(){
    const v = V[rnd(V.length)], p = rnd(6);
    const which = rnd(3);
    if (which === 0)
      return { f:"gap", q:"Présent : *"+P[p]+"* ("+v.i+") ___", a:v.pr[p],
               e:"« "+eli(P[p], v.pr[p])+" » au présent." };
    if (which === 1)
      return { f:"gap", q:"Imparfait : *"+P[p]+"* ("+v.i+") ___", a:v.im[p],
               e:"« "+eli(P[p], v.im[p])+" » à l'imparfait." };
    const aux = v.aux === "e" ? ETRE[p] : AVOIR[p];
    const pp  = v.aux === "e" ? (p >= 3 ? v.pp+"s" : v.pp) : v.pp;
    return { f:"gap", q:"Passé composé : *"+P[p]+"* ("+v.i+") ___", a:aux+" "+pp,
             e:v.aux === "e" ? "Avec l'auxiliaire être, le participe s'accorde avec le sujet." : "Auxiliaire avoir + participe passé « "+v.pp+" »." };
  };

  const NAT = [
    ["rapidement","adverbe"],["maison","nom"],["bleu","adjectif"],["celui","pronom"],
    ["sous","préposition"],["mais","conjonction"],["trois","déterminant"],["chanter","verbe"],
    ["heureusement","adverbe"],["courage","nom"],["mon","déterminant"],["qui","pronom"],
    ["pendant","préposition"],["donc","conjonction"],["fragile","adjectif"],["nous","pronom"]
  ];
  GENS["fr-classes"] = function(){
    const [w, nat] = NAT[rnd(NAT.length)];
    const all = ["nom","verbe","adjectif","adverbe","pronom","déterminant","préposition","conjonction"];
    const wrong = all.filter(x => x !== nat);
    const o = [nat, wrong[rnd(wrong.length)], wrong[rnd(wrong.length)]].filter((v,i,a) => a.indexOf(v) === i);
    while (o.length < 3){ const c = wrong[rnd(wrong.length)]; if (!o.includes(c)) o.push(c); }
    return { f:"qcm", q:"Classe grammaticale de « *"+w+"* » ?", o:o.sort(() => Math.random()-.5), a:nat,
             e:"« "+w+" » est un "+nat+"." };
  };
})();

{ id:"de-perfekt", t:"Le Perfekt", tier:"consolidation",
  lesson:{ why:"C'est le passé de l'oral : à l'oral, un Allemand raconte presque tout au Perfekt.",
    pts:["Formation : *haben* ou *sein* conjugué + *participe passé* placé à la fin de la phrase.",
      "Participe régulier : ge- + radical + -t (spielen → *gespielt*). Irrégulier : ge- + radical modifié + -en (schreiben → *geschrieben*).",
      "*sein* s'emploie avec les verbes de déplacement et de changement d'état : gehen, fahren, kommen, bleiben, aufstehen, werden.",
      "Pas de ge- pour les préfixes inséparables (be-, ver-, ent-, er-) ni pour les verbes en -ieren : *besucht*, *verstanden*, *telefoniert*.",
      "Verbe à particule séparable : la particule se colle devant le ge- — aufstehen → *aufgestanden*."],
    ex:"« Ich *habe* gestern Deutsch *gelernt* » — auxiliaire en 2e position, participe tout à la fin." },
  items:[
    {f:"gap", q:"Ich habe Fussball ___ (spielen).", a:"gespielt", e:"Verbe faible : ge- + spiel + -t."},
    {f:"gap", q:"Er ist nach Bern ___ (fahren).", a:"gefahren", e:"Déplacement → sein, participe fort en -en."},
    {f:"qcm", q:"Welches Hilfsverb? « Wir ___ ins Kino gegangen. »", o:["sind","haben","werden"], a:"sind", e:"gehen = déplacement → sein."},
    {f:"gap", q:"Sie hat einen Brief ___ (schreiben).", a:"geschrieben", e:"Participe fort : geschrieben."},
    {f:"ord", q:"Remets la phrase dans l'ordre :", w:["Ich","habe","gestern","Deutsch","gelernt"], a:"Ich habe gestern Deutsch gelernt", e:"Le participe ferme la phrase."},
    {f:"gap", q:"Wir haben viel ___ (essen).", a:"gegessen", e:"essen → gegessen."},
    {f:"qcm", q:"Welche Verben haben kein « ge- » im Partizip?", o:["verstehen, besuchen, telefonieren","spielen, lernen, machen","gehen, kommen, fahren"], a:"verstehen, besuchen, telefonieren", e:"Préfixes inséparables et verbes en -ieren."},
    {f:"gap", q:"Ich bin um sieben Uhr ___ (aufstehen).", a:"aufgestanden", e:"Particule séparable : auf + gestanden."}
  ]},

{ id:"de-praet", t:"Präteritum et verbes de modalité", tier:"consolidation",
  lesson:{ why:"À l'écrit et pour sein / haben / les modaux, c'est le Präteritum qu'on emploie, pas le Perfekt.",
    pts:["*sein* → ich war, du warst, er war, wir waren. *haben* → ich hatte, wir hatten.",
      "Modaux au Präteritum : können → *konnte*, müssen → *musste*, wollen → *wollte*, dürfen → *durfte*, sollen → *sollte* (l'Umlaut disparaît).",
      "Verbes forts : gehen → *ging*, kommen → *kam*, sehen → *sah*, geben → *gab*, fahren → *fuhr*.",
      "*möchten* = j'aimerais (poli) ; *mögen* = aimer bien.",
      "Un modal envoie toujours l'infinitif à la fin : « Ich *musste* gestern arbeiten »."],
    ex:"À l'oral : « Ich *habe* gespielt » (Perfekt), mais « Ich *war* müde » et « Ich *konnte* nicht » (Präteritum)." },
  items:[
    {f:"gap", q:"Präteritum: ich (sein) ___ krank.", a:"war", e:"ich war, du warst, er war."},
    {f:"gap", q:"Präteritum: wir (haben) ___ Glück.", a:"hatten", e:"ich hatte, wir hatten."},
    {f:"gap", q:"Präteritum: er (können) ___ nicht kommen.", a:"konnte", e:"L'Umlaut tombe au Präteritum : konnte."},
    {f:"qcm", q:"« Ich musste arbeiten » signifie :", o:["Je devais travailler","Je voulais travailler","Je pouvais travailler"], a:"Je devais travailler", e:"müssen = devoir, obligation."},
    {f:"gap", q:"Präteritum: sie (gehen) ___ nach Hause.", a:"ging", e:"gehen → ging, gegangen."},
    {f:"qcm", q:"« Ich ___ ein Eis. » (j'aimerais)", o:["möchte","möchtet","mag"], a:"möchte", e:"möchten : ich möchte, du möchtest."},
    {f:"gap", q:"Präteritum: es (geben) ___ viele Leute.", a:"gab", e:"es gibt → es gab."},
    {f:"qcm", q:"Wann benutzt man beim Sprechen meist das Perfekt?", o:["für die Vergangenheit","für die Zukunft","für Befehle"], a:"für die Vergangenheit", e:"À l'oral le Perfekt domine ; le Präteritum reste pour sein, haben, les modaux et l'écrit."}
  ]},

{ id:"de-praep", t:"Prépositions et cas", tier:"consolidation",

      "Toujours *accusatif* : für, ohne, gegen, um, durch, bis, entlang.",
      "*Wechselpräpositionen* (in, an, auf, unter, über, vor, hinter, neben, zwischen) : accusatif si mouvement (*wohin?*), datif si position (*wo?*).",
      "Contractions courantes : in dem → *im*, in das → *ins*, an dem → *am*, zu dem → *zum*, zu der → *zur*."],

    {f:"qcm", q:"Wo bist du? « Ich bin ___. »", o:["in der Schule","in die Schule","in dem Schule"], a:"in der Schule", e:"Position → datif ; féminin datif = der."},
    {f:"gap", q:"Ich mache das für ___ Freund. (mein)", a:"meinen", e:"für + accusatif, masculin → meinen."},
    {f:"gap", q:"Wir wohnen bei ___ Grosseltern. (die, pluriel)", a:"den", e:"bei + datif ; datif pluriel = den."},
    {f:"qcm", q:"Welche Präpositionen stehen immer mit Dativ?", o:["mit, nach, aus, bei, seit, von, zu","für, ohne, gegen, um","in, an, auf, unter"], a:"mit, nach, aus, bei, seit, von, zu", e:"La série à réciter."},
    {f:"gap", q:"Das Buch liegt auf ___ Tisch. (position, der Tisch)", a:"dem", e:"Wo ? → datif : auf dem Tisch."},
    {f:"gap", q:"Ich lege das Buch auf ___ Tisch. (mouvement)", a:"den", e:"Wohin ? → accusatif : auf den Tisch."},
    {f:"qcm", q:"« ohne » verlangt…", o:["Akkusativ","Dativ","Genitiv"], a:"Akkusativ", e:"ohne fait partie de la série für, ohne, gegen, um, durch."}

{ id:"de-neben", t:"Subordonnées : weil, dass, wenn, ob", tier:"anticipation",
  lesson:{ why:"Point-clé de la 11e : dès qu'une subordonnée commence, le verbe conjugué file à la fin.",
    pts:["Après *weil* (parce que), *dass* (que), *wenn* (si / quand), *ob* (si — question), *obwohl* (bien que) : verbe conjugué *à la fin*.",
      "« Ich bleibe zu Hause, *weil* ich krank *bin*. » — comparer à « Ich bin krank » dans une principale.",
      "*ob* s'emploie pour une question indirecte : « Ich weiss nicht, *ob* er kommt » (je ne sais pas s'il vient).",
      "Si la subordonnée est en tête, elle occupe la 1re position : le verbe de la principale vient juste après — « *Wenn es regnet, bleiben wir* zu Hause ».",
      "Avec un modal : le modal conjugué passe tout à la fin — « … weil ich arbeiten *muss* »."],
    ex:"« Er sagt, dass er müde *ist* » et jamais « dass er ist müde »." },
  items:[
    {f:"ord", q:"Remets la phrase dans l'ordre (sans virgule) :", w:["Ich","bleibe","zu","Hause","weil","ich","krank","bin"], a:"Ich bleibe zu Hause weil ich krank bin", e:"Après weil, le verbe conjugué va à la fin. À l'écrit, virgule avant weil."},
    {f:"qcm", q:"Wo steht das Verb nach « weil »?", o:["am Ende","an zweiter Stelle","direkt nach weil"], a:"am Ende", e:"C'est la marque de la subordonnée."},
    {f:"ord", q:"Remets la phrase dans l'ordre (sans virgule) :", w:["Ich","glaube","dass","er","heute","kommt"], a:"Ich glaube dass er heute kommt", e:"dass + verbe en fin de proposition."},
    {f:"gap", q:"Ergänze: « Ich weiss nicht, ___ er kommt. » (s'il)", a:"ob", e:"Question indirecte → ob, jamais wenn."},
    {f:"qcm", q:"« Wenn » signifie…", o:["si / quand (condition ou répétition)","parce que","que"], a:"si / quand (condition ou répétition)", e:"Pour une question indirecte, on emploie ob."},
    {f:"ord", q:"Remets la phrase dans l'ordre (sans virgule) :", w:["Wenn","es","regnet","bleiben","wir","zu","Hause"], a:"Wenn es regnet bleiben wir zu Hause", e:"La subordonnée en tête compte comme 1re position : le verbe de la principale suit."},
    {f:"qcm", q:"Welcher Satz ist richtig?", o:["Er sagt, dass er müde ist.","Er sagt, dass er ist müde.","Er sagt, dass ist er müde."], a:"Er sagt, dass er müde ist.", e:"Le verbe conjugué ferme la subordonnée."},
    {f:"gap", q:"« Ich lerne Deutsch, ___ ich in die Schweiz fahre. » (parce que)", a:"weil", e:"weil + verbe à la fin."}
  ]},

{ id:"de-adj", t:"Déclinaison de l'adjectif", tier:"anticipation",
  lesson:{ why:"Le dernier gros morceau de grammaire allemande de la scolarité obligatoire. On commence par le nominatif et l'accusatif.",
    pts:["Un adjectif *attribut* (après sein, werden, bleiben) ne prend jamais de terminaison : « Das Haus ist *neu* ».",
      "Devant un nom, il en prend toujours une. Après l'article défini au nominatif singulier : -*e* (der alt*e* Mann, die jung*e* Frau, das neu*e* Haus).",
      "Après l'article indéfini, l'adjectif porte la marque du genre : ein alt*er* Mann, eine jung*e* Frau, ein neu*es* Haus.",
      "À l'accusatif, seul le masculin bouge : den alt*en* Mann, einen alt*en* Mann.",
      "Au pluriel après der/die/das ou un possessif : toujours -*en* (die klein*en* Kinder)."],
    ex:"der alt*e* Mann → Ich sehe den alt*en* Mann : c'est le masculin accusatif qui trahit ceux qui n'ont pas appris le tableau." },
  items:[
    {f:"qcm", q:"der ___ Mann (alt)", o:["alte","alter","alten"], a:"alte", e:"Nominatif singulier après article défini : -e."},
    {f:"qcm", q:"ein ___ Haus (neu)", o:["neues","neue","neuen"], a:"neues", e:"Après ein au neutre, l'adjectif porte la marque : -es."},
    {f:"qcm", q:"Ich sehe den ___ Hund. (klein)", o:["kleinen","kleine","kleines"], a:"kleinen", e:"Masculin accusatif : -en."},
    {f:"gap", q:"die ___ Blume (schön)", a:"schöne", e:"Féminin nominatif après article défini : -e."},
    {f:"qcm", q:"eine ___ Frau (jung)", o:["junge","junger","jungen"], a:"junge", e:"Féminin après eine : -e."},
    {f:"gap", q:"Ich habe einen ___ Bruder. (gross)", a:"grossen", e:"Masculin accusatif après einen : -en."},
    {f:"qcm", q:"die ___ Kinder (klein)", o:["kleinen","kleine","kleines"], a:"kleinen", e:"Pluriel après article défini : toujours -en."},
    {f:"qcm", q:"Wann bekommt das Adjektiv keine Endung?", o:["als Prädikat: « Das Haus ist neu »","immer","nach dem Artikel"], a:"als Prädikat: « Das Haus ist neu »", e:"Après sein, werden, bleiben : forme nue."}
  ]},

  const U5A = ["frisch","süss","salzig","sauer","scharf","fett","fertig",
               "gesund","ungesund","täglich","probieren","backen","kochen","mischen","braten"];
  const estNom = s => /^(der|die|das) /.test(s);
  const nu = s => s.replace(/^(der|die|das) /, "");

  /* --- les trois exercices de reconnaissance --- */

  /* L'article seul, détaché de la traduction. C'est LE trou : un élève qui ignore
     le mot ne travaille jamais son genre, alors que c'est ce que le test exige.
     Les trois options gardent toujours le même ordre — der, die, das se lisent
     comme un clavier, et la bonne réponse change à chaque fois de toute façon. */
  const ART3 = ["der","die","das"];
  function u5article(w){
    const bon = w[3] === "pl" ? "die" : ART3[{ m:0, f:1, n:2 }[w[3]]];
    return { f:"qcm", q:"___ "+nu(w[2]), a:bon, o:ART3.slice(),
             e:w[2]+" — "+w[1]+(w[3] === "pl" ? " (pluriel : toujours die)" : "")+"." };
  }
  /* Relier deux colonnes : quatre paires, français à gauche, allemand à droite. */
  function u5relier(pool){
    const pris = sh(pool).slice(0, 4);
    if (pris.length < 3) return null;
    return { f:"pair", q:"Relie chaque mot à sa traduction :",
             p: pris.map(w => [w[1], w[2]]),
             e: pris.map(w => w[2]+" = "+w[1]).join(" · ")+"." };
  }
  /* Reconnaître la forme allemande — article compris — parmi quatre. */
  function u5choix(w){
    const faux = sh(U5W.filter(x => x[2] !== w[2])).slice(0,3).map(x => x[2]);
    return { f:"qcm", q:"Comment dit-on « "+w[1]+" » ?", a:w[2], o:sh([w[2]].concat(faux)),
             e:w[2]+"." };
  }
  function u5sens(w){
    const faux = sh(U5W.filter(x => x[1] !== w[1])).slice(0,2).map(x => x[1]);
    return { f:"qcm", q:"« "+w[2]+" » bedeutet…", a:w[1], o:sh([w[1]].concat(faux)),
             e:w[2]+" = "+w[1]+"." };
  }

  /* Tirage de vocabulaire pour la liste n. Les listes maigres (3, 5, 6) puisent
     surtout dans les listes précédentes — ce qui tombe juste, puisque les TA
     de l'école sont cumulatifs (1+2, 3+4, 5+6).

     `et` est l'étape : 1 = reconnaître (choisir, relier, poser l'article),
     2 = produire (écrire de mémoire). Le moteur la passe ; un appel sans argument
     se comporte comme avant. */
  function u5vok(n){
    const own  = U5W.filter(w => w[0] === n);
    const prev = U5W.filter(w => w[0] < n);
    /* Un paquet de cartes, pas un dé.

       En tirant au hasard, un bloc de 24 questions laissait des mots jamais
       posés pendant que d'autres tombaient quatre fois — sur une liste qu'un
       test interroge en entier, c'est le pire tirage possible. On distribue
       donc un paquet mélangé, et on ne le remélange qu'une fois épuisé : la
       liste est balayée avant qu'un mot ne repasse. */
    const paquets = new Map();
    function tire(pool){
      if (!pool.length) return null;
      let d = paquets.get(pool);
      if (!d || !d.length){ d = sh(pool.slice()); paquets.set(pool, d); }
      return d.pop();
    }
    return function(et){
      const wantOwn = own.length >= 4 ? rnd(4) !== 0 : rnd(3) === 0;
      const pool = (wantOwn && own.length) || !prev.length ? own : prev;
      const w = tire(pool) || pool[rnd(pool.length)];
      if (et === 1){
        const d = rnd(4);
        if (d === 0) return u5article(w);
        if (d === 1) return u5relier(pool.length >= 4 ? pool : U5W.filter(x => x[0] <= n)) || u5choix(w);
        if (d === 2) return u5sens(w);
        return u5choix(w);
      }
      if (rnd(3) === 0) return u5sens(w);
      return { f:"txt", q:"Traduis avec l'article : *"+w[1]+"*", a:w[2], e:w[2]+"." };

     On tire dans la même famille que la réponse — des noms articulés pour un nom,
     des adjectifs et verbes pour le reste — sinon le bon choix saute aux yeux. */
  function u5dist(rep){

    const src = nom ? U5W.map(w => w[2]).filter(s => s !== rep)

  /* Liste 3 : la négation du nom, où le genre se paie comptant */
  const KEIN = { m:"keinen", f:"keine", n:"kein", pl:"keine" };
  const ESSBAR = U5W.filter(w => w[0] <= 2);

    const rappel = et === 1 ? "  ("+w[2]+")" : "  (je n'aime pas "+w[1]+")";
    return { f:"qcm", q:"Ich mag ___ "+nu(w[2])+"."+rappel,
             o:sh(["keinen","kein","keine"]), a:KEIN[w[3]],
             e:w[2]+" → ich mag "+KEIN[w[3]]+" "+nu(w[2])+"." };
  };

  /* Liste 7 : les verbes, au présent ET au passé composé, à toutes les personnes */
  const PR5 = ["ich","du","er","wir","ihr","sie"];
  const HAB = ["habe","hast","hat","haben","habt","haben"];
  const V7 = [
    {i:"kochen",    p:["koche","kochst","kocht","kochen","kocht","kochen"],                       pp:"gekocht"},
    {i:"backen",    p:["backe","backst","backt","backen","backt","backen"],                       pp:"gebacken"},
    {i:"probieren", p:["probiere","probierst","probiert","probieren","probiert","probieren"],     pp:"probiert"}
  ];
  const vok7 = u5vok(7);
  function verbDrill(list, sepFrom, et){
    const v = list[rnd(list.length)], p = rnd(6);
    const sep = sepFrom !== undefined && list.indexOf(v) >= sepFrom;   // verbe à particule
    // Étape 1 : la bonne forme se reconnaît parmi trois. Les distracteurs sont les
    // formes du même verbe à d'autres personnes — c'est là que la confusion vit.
    if (et === 1){
      // plusieurs personnes partagent souvent la même forme (er backt / ihr backt) :
      // on dédoublonne, sinon deux options identiques se retrouvent dans le QCM
      if (!sep && rnd(2)){
        const faux = [];
        sh(v.p).forEach(f => { if (f !== v.p[p] && faux.indexOf(f) === -1 && faux.length < 2) faux.push(f); });
        if (faux.length === 2)
          return { f:"qcm", q:"Présent : *"+PR5[p]+"* ("+v.i+") …", a:v.p[p],
                   o:sh([v.p[p]].concat(faux)), e:PR5[p]+" "+v.p[p]+"." };
      }
      const fauxPP = [];
      sh(list).forEach(x => { if (x.pp !== v.pp && fauxPP.indexOf(x.pp) === -1 && fauxPP.length < 2) fauxPP.push(x.pp); });
      if (fauxPP.length === 2)
        return { f:"qcm", q:"Participe passé de « "+v.i+" » ?", a:v.pp,
                 o:sh([v.pp].concat(fauxPP)), e:PR5[p]+" "+HAB[p]+" "+v.pp+"." };
    }
    // au présent, on évite les verbes à particule : leur forme se coupe en deux
    if (rnd(2) && !sep){
      return { f:"gap", q:"Présent : *"+PR5[p]+"* ("+v.i+") ___", a:v.p[p], e:PR5[p]+" "+v.p[p]+"." };
    }
    return { f:"txt", q:"Mets au passé composé : *"+PR5[p]+"* ("+v.i+")",
             a:PR5[p]+" "+HAB[p]+" "+v.pp, e:PR5[p]+" "+HAB[p]+" "+v.pp+"." };
  }
  GENS["de-u5-7"] = function(et){
    return rnd(4) === 0 ? vok7(et) : verbDrill(V7, undefined, et);
  };

  /* Le reste de l'unité : vocabulaire des encadrés bleus + verbes de la recette */
  const V8 = [
    {i:"braten",    p:["brate","brätst","brät","braten","bratet","braten"],                       pp:"gebraten"},
    {i:"mischen",   p:["mische","mischst","mischt","mischen","mischt","mischen"],                 pp:"gemischt"},
    {i:"dazugeben", p:[], pp:"dazugegeben"},
    {i:"umdrehen",  p:[], pp:"umgedreht"}
  ];
  const vok8 = u5vok(8);
  GENS["de-u5-plus"] = function(et){
    return rnd(3) === 0 ? verbDrill(V8, 2, et) : vok8(et);
  };

  /* La liste témoin, pour le contrôle de couverture (voir CORPUS plus haut).
     `mots` = les noms, avec leur liste et leur genre ; `autres` = les
     adjectifs et verbes de l'unité, qui ne sont pas des noms et vivaient donc
     hors du tableau ; `verbes` = ceux que les drills conjuguent. */
  CORPUS["de-u5"] = { mots: U5W, autres: U5A, verbes: V7.concat(V8).map(v => v.i) };
})();

/* --- générateurs anglais --- */
(function(){
  const rnd = n => Math.floor(Math.random()*n);
  const IRR = [
    ["go","went","gone"],["take","took","taken"],["write","wrote","written"],["see","saw","seen"],
    ["buy","bought","bought"],["bring","brought","brought"],["come","came","come"],["do","did","done"],
    ["drink","drank","drunk"],["eat","ate","eaten"],["find","found","found"],["get","got","got"],
    ["give","gave","given"],["know","knew","known"],["leave","left","left"],["make","made","made"],
    ["meet","met","met"],["read","read","read"],["say","said","said"],["sing","sang","sung"],
    ["speak","spoke","spoken"],["swim","swam","swum"],["teach","taught","taught"],["think","thought","thought"],
    ["wear","wore","worn"],["win","won","won"],["break","broke","broken"],["choose","chose","chosen"],
    ["fly","flew","flown"],["forget","forgot","forgotten"]
  ];
  GENS["en-irr"] = function(){
    const v = IRR[rnd(IRR.length)];
    if (Math.random() < 0.5)
      return { f:"txt", q:"Prétérit (past simple) de « *"+v[0]+"* » ?", a:v[1], e:v[0]+" – "+v[1]+" – "+v[2]+"." };
    return { f:"txt", q:"Participe passé de « *"+v[0]+"* » ?", a:v[2], e:v[0]+" – "+v[1]+" – "+v[2]+"." };
  };

  const VOK = [
  ["la semaine","week"],["le voyage","trip"],["le travail","work"],["la santé","health"],
  ["l'école","school"],["l'année","year"],["le monde","world"],["la ville","city"],
  ["le pays","country"],["l'argent","money"],["le temps (durée)","time"],["la nourriture","food"],
  ["le choix","choice"],["la réponse","answer"],["la question","question"],["l'ami","friend"],
  ["apprendre","learn"],["essayer","try"],["choisir","choose"],["expliquer","explain"],
  ["se souvenir","remember"],["oublier","forget"],["améliorer","improve"],["comprendre","understand"]
  ];
  GENS["en-vok"] = function(){
    const [fr, en] = VOK[rnd(VOK.length)];
    return { f:"txt", q:"Traduis en anglais : *"+fr+"*", a:en, alt:["the "+en, "to "+en],
             e:fr+" → "+en+"." };
  };

  /* ---------- Unit 1 « Travellers' tales » : la réserve, section par section ---------- */
  const sh = a => { const r = a.slice(); for (let i=r.length-1;i>0;i--){ const j = rnd(i+1); [r[i],r[j]] = [r[j],r[i]]; } return r; };
  /* `et` = l'étape : 1 on reconnaît (choisir, relier), 2 on écrit. */
  function enVok(list){
    const sens = ([fr, en]) => {
      const faux = sh(list.filter(x => x[0] !== fr)).slice(0,2).map(x => x[0]);
      return faux.length === 2
        ? { f:"qcm", q:"« "+en+" » signifie…", o:sh([fr].concat(faux)), a:fr, e:en+" = "+fr+"." }
        : null;
    };
    const choix = ([fr, en]) => {
      const faux = sh(list.filter(x => x[1] !== en)).slice(0,3).map(x => x[1]);
      return faux.length === 3
        ? { f:"qcm", q:"Comment dit-on « "+fr+" » ?", o:sh([en].concat(faux)), a:en, e:fr+" → "+en+"." }
        : null;
    };
    const relier = () => {
      const pris = sh(list).slice(0, 4);
      return pris.length >= 3
        ? { f:"pair", q:"Relie chaque mot à sa traduction :", p: pris.map(x => [x[0], x[1]]),
            e: pris.map(x => x[1]+" = "+x[0]).join(" · ")+"." }
        : null;
    };
    return function(et){
      const w = list[rnd(list.length)];
      if (et === 1){
        const d = rnd(4);
        const g = d === 0 ? relier() : d === 1 ? sens(w) : choix(w);
        if (g) return g;
      }
      if (rnd(3) === 0){ const g = sens(w); if (g) return g; }
      return { f:"txt", q:"Traduis en anglais : *"+w[0]+"*", a:w[1], alt:["the "+w[1], "to "+w[1]],
               e:w[0]+" → "+w[1]+"." };
    };
  }

  /* Enregistre d'un coup le générateur et ses distracteurs : ces derniers
     servent à transformer les exercices à taper de la banque en QCM tant que la
     notion est neuve. */
  function enSection(k, list){
    GENS[k] = enVok(list);
    DIST[k] = rep => sh(list.filter(x => x[1] !== rep)).slice(0, 3).map(x => x[1]);
  }

/* --- générateurs maths : réserve infinie --- */
(function(){
  const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
  const rnd = n => Math.floor(Math.random()*n);
  const par = n => n < 0 ? "("+n+")" : String(n);
  function gcd(a,b){ a = Math.abs(a); b = Math.abs(b); while(b){ const t = b; b = a % b; a = t; } return a || 1; }
  function frac(n,d){ const g = gcd(n,d); n = n/g; d = d/g; if (d < 0){ n = -n; d = -d; } return d === 1 ? String(n) : n+"/"+d; }

  GENS["ma-rel"] = function(){
    const t = rnd(4);
    if (t === 0){ const a = ri(-9,9), b = ri(-9,-2), c = ri(2,9);
      return { f:"txt", m:1, q:"Calcule : "+a+" + "+par(b)+" × "+c, a:String(a+b*c),
        e:"Multiplication d'abord : "+b+" × "+c+" = "+(b*c)+", puis "+a+" + ("+(b*c)+") = "+(a+b*c)+"." }; }
    if (t === 1){ const a = ri(-9,9), b = ri(-9,-1);
      return { f:"txt", m:1, q:"Calcule : "+a+" − "+par(b), a:String(a-b),
        e:"Soustraire un négatif, c'est ajouter : "+a+" + "+(-b)+" = "+(a-b)+"." }; }
    if (t === 2){ const a = ri(-9,-2), b = ri(-9,-2);
      return { f:"txt", m:1, q:"Calcule : "+par(a)+" × "+par(b), a:String(a*b),
        e:"Deux négatifs → produit positif : "+(a*b)+"." }; }
    const a = ri(2,9), b = ri(-9,-1), c = ri(2,9);
    return { f:"txt", m:1, q:"Calcule : "+a+" × ("+b+" + "+c+")", a:String(a*(b+c)),
      e:"Parenthèse d'abord : "+b+" + "+c+" = "+(b+c)+", puis "+a+" × "+(b+c)+" = "+(a*(b+c))+"." };
  };

  GENS["ma-frac"] = function(){
    const b = ri(2,9), d = ri(2,9), a = ri(1,b-1), c = ri(1,d-1);
    const t = rnd(3);
    if (t === 0) return { f:"txt", m:1, q:"Calcule et simplifie : "+a+"/"+b+" + "+c+"/"+d,
      a:frac(a*d + c*b, b*d), alt:[(a*d+c*b)+"/"+(b*d)],
      e:"Dénominateur commun "+(b*d)+" : "+(a*d)+"/"+(b*d)+" + "+(c*b)+"/"+(b*d)+" = "+frac(a*d+c*b, b*d)+"." };
    if (t === 1) return { f:"txt", m:1, q:"Calcule et simplifie : "+a+"/"+b+" × "+c+"/"+d,
      a:frac(a*c, b*d), alt:[(a*c)+"/"+(b*d)],
      e:"Numérateurs entre eux, dénominateurs entre eux : "+(a*c)+"/"+(b*d)+" = "+frac(a*c,b*d)+"." };
    const k = ri(2,6);
    return { f:"txt", m:1, q:"Simplifie : "+(a*k)+"/"+(b*k), a:frac(a,b),
      e:"On divise les deux termes par "+gcd(a*k,b*k)+" → "+frac(a,b)+"." };
  };

  GENS["ma-pct"] = function(){
    const t = rnd(3);
    const pcts = [5,10,15,20,25,40,50,75];
    if (t === 0){ const p = pcts[rnd(pcts.length)], base = 20*ri(2,20);
      return { f:"txt", m:1, q:"Calcule "+p+" % de "+base, a:String(base*p/100),

    if (t === 1){ const p = [10,20,25,50][rnd(4)], base = 20*ri(2,15);

      return { f:"txt", m:1, q:"Un article coûte "+base+" CHF. "+(down ? "Remise" : "Hausse")+" de "+p+" %. Nouveau prix (CHF) ?",
        a:String(res), e:base+" × "+(down ? (1-p/100) : (1+p/100)).toString().replace(".",",")+" = "+res+" CHF." }; }
    const u = ri(2,9), n = ri(2,6), m = ri(2,9);
    return { f:"txt", m:1, q:n+" articles identiques coûtent "+(n*u)+" CHF. Prix de "+m+" articles (CHF) ?",
      a:String(m*u), e:"Prix unitaire "+u+" CHF, donc "+m+" × "+u+" = "+(m*u)+" CHF." };
  };

  GENS["ma-pow"] = function(){

        e:"Le signe − change les deux signes : −"+a+"x + "+(a*b)+"." }; }
    if (t === 2){ const a = ri(2,9), b = ri(1,9), c = ri(1,a-1 > 0 ? a-1 : 1), d = ri(1,9);
      const x = a - c, n = b + d;
      return { f:"txt", m:1, q:"Réduis : "+a+"x + "+b+" − "+c+"x + "+d, a:(x === 1 ? "x" : x+"x")+"+"+n,
        e:a+"x − "+c+"x = "+(x === 1 ? "x" : x+"x")+" et "+b+" + "+d+" = "+n+"." }; }
    const k = [2,3,4,5,6][rnd(5)], p = ri(2,7), q = ri(2,9);
    return { f:"txt", m:1, q:"Factorise : "+(k*p)+"x + "+(k*q), a:k+"("+p+"x+"+q+")",
      e:"Facteur commun "+k+" → "+k+"("+p+"x + "+q+")." };
  };

  GENS["ma-eq"] = function(){
    const t = rnd(3);
    if (t === 0){ const a = ri(2,9), x = ri(-6,9), b = ri(-9,9);
      const c = a*x + b;
      return { f:"txt", m:1, q:"Résous : "+a+"x "+(b < 0 ? "− "+(-b) : "+ "+b)+" = "+c+". x = ?", a:String(x),
        e:a+"x = "+(c-b)+", donc x = "+(c-b)+" ÷ "+a+" = "+x+"." }; }
    if (t === 1){ const a = ri(2,6), b = ri(-8,8), x = ri(-5,8);
      const c = a*(x + b);
      return { f:"txt", m:1, q:"Résous : "+a+"(x "+(b < 0 ? "− "+(-b) : "+ "+b)+") = "+c+". x = ?", a:String(x),
        e:"On divise par "+a+" : x "+(b < 0 ? "− "+(-b) : "+ "+b)+" = "+(c/a)+", donc x = "+x+"." }; }
    const a = ri(3,9), d = ri(1,a-1), x = ri(-5,9), b = ri(-9,9);
    const c = (a-d)*x + b;   // a·x + b = d·x + c  ⇔  (a−d)x = c − b
    return { f:"txt", m:1, q:"Résous : "+a+"x "+(b < 0 ? "− "+(-b) : "+ "+b)+" = "+d+"x + "+c+". x = ?", a:String(x),
      e:"On regroupe : "+(a-d)+"x = "+(c-b)+", donc x = "+x+"." };
  };

  GENS["ma-pyth"] = function(){
    const TR = [[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[7,24,25],[12,16,20],[20,21,29],[9,40,41],[12,35,37]];
    const t = TR[rnd(TR.length)];
    const k = Math.random() < 0.25 ? 2 : 1;
    const a = t[0]*k, b = t[1]*k, c = t[2]*k;
    if (Math.random() < 0.6)
      return { f:"txt", m:1, q:"Triangle rectangle, côtés de l'angle droit "+a+" et "+b+". Hypoténuse ?", a:String(c),

    if (t === 2){ const vals = []; for (let i = 0; i < 4; i++) vals.push(ri(1,40));

  /* ---- les quatre notions ajoutées le 25 août 2026 ----

  const CARRES = [];

  GENS["ma-rac"] = function(){

  GENS["ma-fonc"] = function(){

    if (t === 2){
      return { f:"qcm", q:"La droite de "+ecr+"…", o:["monte","descend","est horizontale"],

  };

  GENS["ma-pbm"] = function(){
    const t = rnd(5);
    if (t === 0){ const p = ri(6,30) * 20, r = [10,20,25,50][rnd(4)], f = ri(1,3) * 5;
      // prix multiple de 20 : les quatre remises tombent toujours juste
      const solde = p * (100 - r) / 100;
      const coef = String((100 - r) / 100).replace(".", ",");
      return { f:"txt", m:1, q:"Un article à "+p+" CHF est soldé de "+r+" %, puis on ajoute "+f+" CHF de frais. Prix payé, en CHF ?",
        a:String(solde + f), e:p+" × "+coef+" = "+solde+", puis + "+f+" = "+(solde+f)+"." }; }
    if (t === 1){ const v = ri(6,12) * 10, h = [1, 1.5, 2, 2.5, 3][rnd(5)];
      const txt = h === Math.floor(h) ? h+" h" : Math.floor(h)+" h 30";
      const hfr = String(h).replace(".", ",");
      return { f:"txt", m:1, q:"Une voiture roule à "+v+" km/h pendant "+txt+". Distance parcourue, en km ?",
        a:String(v*h), e:txt+" = "+hfr+" h, donc "+v+" × "+hfr+" = "+(v*h)+" km." }; }
    if (t === 2){ const n = ri(2,5), p = ri(8,18), g = [2,3,4,6][rnd(4)];
      const tot = n*p;
      if (tot % g !== 0) return GENS["ma-pbm"]();
      return { f:"txt", m:1, q:n+" pizzas à "+p+" CHF sont partagées entre "+g+" personnes. Part de chacun, en CHF ?",
        a:String(tot/g), e:n+" × "+p+" = "+tot+" CHF, puis "+tot+" ÷ "+g+" = "+(tot/g)+"." }; }
    if (t === 3){ const h1 = ri(6,10), m1 = [0,15,30,45][rnd(4)], dur = ri(1,3) * 60 + [5,20,35,50][rnd(4)];
      const fin = h1 * 60 + m1 + dur;
      const hh = Math.floor(fin / 60), mm = fin % 60;
      const deux = n => String(n).padStart(2, "0");
      return { f:"txt", m:1, q:"Un train part à "+h1+" h "+deux(m1)+" et arrive à "+hh+" h "+deux(mm)+". Durée du trajet, en minutes ?",
        a:String(dur), e:"De "+h1+" h "+deux(m1)+" à "+hh+" h "+deux(mm)+" : "+Math.floor(dur/60)+" h "+deux(dur%60)+", soit "+dur+" minutes." }; }
    const den = [4,6,8][rnd(3)], num = ri(1, den-1), tot = den * ri(2,5);
    return { f:"txt", m:1, q:"Dans une classe de "+tot+" élèves, "+num+"/"+den+" sont des filles. Combien y a-t-il de garçons ?",
      a:String(tot - tot*num/den), e:num+"/"+den+" de "+tot+" = "+(tot*num/den)+" filles, donc "+tot+" − "+(tot*num/den)+" = "+(tot - tot*num/den)+" garçons." };
  };
})();

<script>

(function(){

const CTS_JUSTE = 8, CTS_ESSAI = 5, CTS_BLOC = 50;

const BLOC_BONUS = 28, BONUS_TOUS_LES = 3;

/* Longueur des blocs (21 août 2026). Huit questions ne suffisaient pas : le

const BLOC_LONG = 20, BLOC_DEFI = 12, PALIER = 8;

const REPRISE_1 = 3, REPRISE_2 = 8, REPRISE_MAX = 2, REPRISE_FILE = 3;
const REPRISE_ECART = 4;                   // questions minimum entre deux reprises
const REPRISE_PART = 4;                    // au plus un quart du bloc en reprises

/* ---------- dates (locales, jamais UTC) ---------- */
function iso(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function today(){ return iso(new Date()); }
function parse(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parse(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a, b){ return Math.round((parse(b) - parse(a)) / 86400000); }
function frDate(s){
  const M = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const d = parse(s); return d.getDate()+" "+M[d.getMonth()];

/* ---------- utilitaires ---------- */
function shuffle(a){ const r = a.slice(); for (let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]] = [r[j],r[i]]; } return r; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function norm(s){
  return String(s == null ? "" : s).trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’´`]/g,"'").replace(/[−–—]/g,"-")
    .replace(/[.!?;:]+$/,"").replace(/\s+/g," ");
}
/* réponses de maths : espaces sans importance, virgule = point décimal */
function normMath(s){
  return norm(s).replace(/\s+/g,"").replace(/(\d),(\d)/g,"$1.$2").replace(/^\+/,"");
}
/* La comparaison qui fait foi : l'accent compte (21 août 2026).

   Avant, `norm()` supprimait les diacritiques et seuls les items marqués `acc:1`
   étaient stricts — la tolérance était là pour le clavier du téléphone. Mais un
   accent oublié EST une faute : « die Fruchte » est faux au TA, « la these »
   est faux en français. Une app qui l'accepte apprend à l'oublier.

   La casse, elle, reste tolérée : c'est un autre débat, et le clavier du
   téléphone met des majuscules tout seul. */
function normAcc(s){
  return String(s == null ? "" : s).trim().toLowerCase()
    .replace(/[’´`]/g,"'").replace(/[−–—]/g,"-")
    .replace(/[.!?;:]+$/,"").replace(/\s+/g," ");
}
function eq(a, b, it){
  it = it || {};
  if (it.m) return normMath(a) === normMath(b);
  return normAcc(a) === normAcc(b);
}
/* Faux uniquement à cause d'un accent ? On le dit, au lieu de laisser croire
   que le mot lui-même était faux — c'est là que la correction apprend
   quelque chose. La réponse reste comptée fausse. */
function accentPres(rep, it){
  if (!rep || (it && it.m)) return false;
  const bonnes = [it.a].concat(it.alt || []);
  return !bonnes.some(a => normAcc(a) === normAcc(rep))
      &&  bonnes.some(a => norm(a)    === norm(rep));

/* Même idée pour l'article allemand (25 août 2026). Le 24, sur trois fautes de
   vocabulaire, trois étaient des articles : « das Schinken », « der » tout seul,
   « das Wurts » — le mot était su, le genre non. Or l'enseignante compte
   l'article pour la moitié du point. Un « Pas encore » sec laisse croire que le
   mot était faux ; on nomme donc la vraie cause. La réponse reste comptée
   fausse, comme au test. */
const ART_RE = /^(der|die|das)\s+/;
function articlePres(rep, it){
  if (!rep || (it && it.m)) return null;
  const bonnes = [it.a].concat(it.alt || []).map(String);
  if (bonnes.some(a => eq(a, rep, it))) return null;
  const att = bonnes.filter(a => ART_RE.test(normAcc(a)))[0];
  if (!att) return null;
  const nu = s => normAcc(s).replace(ART_RE, "").trim();
  if (!nu(rep) || nu(att) !== nu(rep)) return null;
  return ART_RE.test(normAcc(rep))
    ? "Le nom est juste, l'article non : on écrit « " + att + " »."
    : "Le mot est juste, mais l'article manque : « " + att + " » — et au test il vaut la moitié du point.";
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* met en évidence *le mot* entre astérisques, et rend 2^5 en exposant */
function fmt(s){
  return esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\^\(([^)]+)\)/g, "<sup>$1</sup>")
    .replace(/\^(-?\d+)/g, "<sup>$1</sup>");
}

/* ---------- catalogue des notions ---------- */
const THEMES = [];        // toutes les notions, à plat
const THEME_BY_ID = {};
ORDER.forEach(sk => {
  const sub = BANK[sk];
  if (!sub) return;
  sub.themes.forEach((t, i) => {
    t.subject = sk; t.order = i;
    THEMES.push(t); THEME_BY_ID[t.id] = t;
  });
});
/* « programme » : ce que l'école interroge en ce moment, daté (voir `tests`) */
const TIER = {
  revision:      "acquis de 10e",
  consolidation: "10e confirmé",
  anticipation:  "avance sur la 11e",
  programme:     "au programme"
};
const SUB = {
  francais:{label:"Français", short:"FR"},
  allemand:{label:"Allemand", short:"DE"},
  anglais: {label:"Anglais",  short:"EN"},
