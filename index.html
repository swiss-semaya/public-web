/* ---------- état ---------- */
function fresh(){
  return {
    v:2, start: today(), xp:0, streak:0, best:0, lastDay:null,
    themes:{},              // id -> {box, due, seen, right, used:[idx], miss:{idx:{f,s}}, hist:[{d,ok,tot}]}
    days:{},                // "YYYY-MM-DD" -> {blocks:[], xp, right, total}
    badges:[],
    errors:[]               // journal des fautes : {d, id, f, q, a, r, k, g} — borné à 400
  };
}
let S = fresh();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (raw){ const o = JSON.parse(raw); if (o && o.v >= 1 && o.v <= 3) S = o; }
  }catch(e){ /* premier lancement, ou stockage indisponible */ }
  S.v = 3;
  if (!S.errors) S.errors = [];
  THEMES.forEach(t => {
    if (!S.themes[t.id]) S.themes[t.id] = { box:0, due:today(), seen:0, right:0, used:[] };
    const st = S.themes[t.id];
    if (!st.miss) st.miss = {};
    if (!st.hist) st.hist = [];
  });
  // v3 : le porte-monnaie. Chaque journée porte son montant une fois pour
  // toutes, pour qu'il ne bouge plus si le tarif change — et les journées
  // antérieures au 25 août sont remises à zéro, y compris celles qu'une
  // version précédente avait chiffrées rétroactivement (voir ARGENT_DEPUIS).
  Object.keys(S.days || {}).forEach(d => {
    if (!S.days[d]) return;
    if (d < ARGENT_DEPUIS) S.days[d].cts = 0;
    else if (S.days[d].cts == null) S.days[d].cts = 0;
  });
  if (!S.wallet) S.wallet = { verse:0 };
  if (S.wallet.verse == null) S.wallet.verse = 0;
  S.wallet.cts = ctsDepuisJours(S.days);
  save();
}
/* Le stockage peut être refusé : navigation privée, quota plein, ou une page
   ouverte en `file://` selon le navigateur. `save()` avale l'erreur pour que la
   séance en cours continue — mais avaler SANS RIEN DIRE, c'est laisser faire
   24 questions qui seront perdues à la fermeture. On teste donc une fois, et on
   l'affiche. */
let memoireOk = true;
try {
  localStorage.setItem("onze-test", "1");
  localStorage.removeItem("onze-test");
} catch(e){ memoireOk = false; }

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ memoireOk = false; /* la session marche quand même, mais elle ne sera pas retenue */ }
}

/* ---------- répétition espacée ---------- */
function dueThemes(){
  const t0 = today();
  return THEMES.filter(t => {
    const st = S.themes[t.id];
    return st.box >= 1 && st.box <= 5 && st.due <= t0;
  }).sort((a,b) => {
    const A = S.themes[a.id], B = S.themes[b.id];
    return A.box - B.box || (A.due < B.due ? -1 : 1);
  });
}
function seenThemes(){ return THEMES.filter(t => S.themes[t.id].box >= 1); }
function newThemes(sk){ return THEMES.filter(t => S.themes[t.id].box === 0 && isOpen(t) && (!sk || t.subject === sk)); }

/* ---------- calendrier scolaire ---------- */
/* Une notion peut être calée sur le programme de l'école : `from` est le jour où
   elle s'ouvre, `tests` les dates auxquelles elle est interrogée en classe. Tant
   qu'une notion n'est pas ouverte, elle n'existe pas pour l'app ; à l'approche
   d'un test elle passe devant la rotation des matières. Une notion sans ces deux
   champs se comporte exactement comme avant. */
const URGENT_DAYS = 8;                     // fenêtre de révision avant un test
function isOpen(t){ return !t.from || t.from <= today(); }
function nextTest(t){                      // prochaine date de test encore devant
  if (!t.tests || !t.tests.length) return null;
  const t0 = today();
  return t.tests.filter(d => d >= t0).sort()[0] || null;
}
function daysToTest(t){                    // jours avant ce test, ou null
  const d = nextTest(t);
  return d === null ? null : diffDays(today(), d);
}
function urgentThemes(){                   // test dans la fenêtre, le plus proche d'abord
  return THEMES.filter(t => {
    if (!isOpen(t)) return false;
    const d = daysToTest(t);
    return d !== null && d <= URGENT_DAYS;
  }).sort((a,b) => daysToTest(a) - daysToTest(b));
}
function testLabel(t){                     // « test dans 3 jours », pour l'affichage
  const d = daysToTest(t);
  if (d === null) return "";
  if (d <= 0) return "test aujourd'hui";
  if (d === 1) return "test demain";
  return "test dans " + d + " jours (" + frDate(nextTest(t)) + ")";
}
function mastery(t){
  const st = S.themes[t.id];
  if (!st.seen) return null;
  const acc = st.right / st.seen;
  return Math.max(0, Math.min(100, Math.round(60*acc + 40*(Math.max(0,st.box-1)/4))));
}
function subjectMastery(sk){
  const vals = BANK[sk].themes.map(mastery).filter(v => v !== null);
  if (!vals.length) return null;
  const total = BANK[sk].themes.length;
  const sum = vals.reduce((a,b) => a+b, 0);
  return Math.round(sum / total);          // les notions jamais vues comptent 0 : la barre = avancement réel
}
function moveBox(themeId, acc){
  const st = S.themes[themeId];
  const from = st.box;
  let to = from;
  if (from === 0) to = 1;
  else if (acc >= 0.8) to = Math.min(5, from+1);
  else if (acc < 0.5)  to = 1;
  st.box = to;
  st.due = addDays(today(), BOXES[to] || 1);
  return { from, to };
}

/* ---------- fautes & progrès ---------- */
// exercices de la banque ratés, pas encore « rachetés » (2 réussites d'affilée)
function missIdx(st){
  return Object.keys(st.miss || {}).map(Number)
    .filter(i => (st.miss[i].s || 0) < 2)
    .sort((a,b) => (st.miss[b].f || 0) - (st.miss[a].f || 0));
}
// taux de réussite sur les n derniers blocs de la notion
function histAcc(st, from, to){
  const h = (st.hist || []).slice(from, to);
  const tot = h.reduce((a,x) => a + x.tot, 0);
  return tot ? h.reduce((a,x) => a + x.ok, 0) / tot : null;
}
// direction du progrès : compare les 3 derniers blocs aux 3 précédents
function trend(t){
  const st = S.themes[t.id];
  if ((st.hist || []).length < 4) return null;
  const rec = histAcc(st, -3), old = histAcc(st, -6, -3);
  if (rec === null || old === null) return null;
  if (rec - old > 0.12) return "up";
  if (old - rec > 0.12) return "down";
  return "flat";
}

/* ---------- l'étape : reconnaître avant de produire ----------
   Écrire « der Schinken » de mémoire et le reconnaître parmi quatre ne sont pas
   le même exercice — le premier est beaucoup plus dur, et un mot rencontré la
   veille n'est pas encore produisible. Tant qu'une notion est neuve ou fragile,
   on reste donc en reconnaissance : choisir, relier, poser l'article. La frappe
   arrive quand la notion tient (boîte ≥ 2 et réussite ≥ 60 %).

   Le passage se fait sur l'état réel de la notion, jamais sur une date : un
   élève qui bloque reste en reconnaissance aussi longtemps qu'il en a besoin. */
function etape(theme){
  const st = S.themes[theme.id];
  if (!st) return 1;
  const acc = st.seen ? st.right / st.seen : 0;
  return (st.box <= 1 || acc < 0.6) ? 1 : 2;
}

/* Transforme un exercice à taper en QCM, quand la notion sait fournir des
   distracteurs. Renvoie l'item inchangé si ce n'est pas possible. */
function facile(it, theme){
  if (it.f !== "txt" || it.etape1) return it;
  const src = DIST[theme.gen];
  if (!src) return it;
  let faux;
  try{ faux = src(it.a) || []; }catch(e){ return it; }
  // options distinctes de la réponse ET entre elles, une fois normalisées
  const vus = [norm(it.a)];
  const gardees = [];
  faux.forEach(f => {
    const k = norm(f);
    if (vus.indexOf(k) === -1){ vus.push(k); gardees.push(f); }
  });
  if (gardees.length < 2) return it;
  return Object.assign({}, it, {
    f:"qcm", o: shuffle([it.a].concat(gardees.slice(0, 3))), etape1:true
  });
}

/* ---------- tirage d'exercices ---------- */
function itemsFor(theme, n, forceEt){
  const st = S.themes[theme.id];
  const et = forceEt || etape(theme);
  const out = [];
  const bank = theme.items || [];
  const aGen = theme.gen && GENS[theme.gen];
  // À l'étape 1, on réserve jusqu'à trois places aux exercices de reconnaissance
  // des générateurs — relier, poser l'article, choisir une forme verbale. Sans
  // ça la banque remplit tout le bloc et ils n'apparaissent jamais, alors que
  // c'est au tout premier contact avec une notion qu'ils servent le plus.
  // À l'étape 1 la banque ne prend qu'une part du bloc : le reste va aux
  // exercices de reconnaissance des générateurs. En proportion, et non « n - 3 » :
  // sur un bloc de 24 cette soustraction ne réservait plus rien du tout.
  // Et dans le grand défi (`forceEt`), c'est l'inverse : la banque ne prend
  // qu'un tiers des places. Les banques contiennent beaucoup de QCM écrits à la
  // main — parfaits pour comprendre, trop faciles pour un défi payé le double.
  // Les générateurs, à l'étape 2, demandent d'ÉCRIRE la réponse : c'est là
  // qu'est la difficulté annoncée.
  const nBank = (aGen && (et === 1 || forceEt === 2))
    ? Math.max(1, Math.min(bank.length, Math.ceil(n * (et === 1 ? 0.4 : 0.3))))
    : n;

  // 1. la revanche : jusqu'à 2 exercices ratés récemment, à retenter en priorité
  const retry = missIdx(st).slice(0, Math.min(2, Math.max(0, nBank - 1)));
  retry.forEach(i => {
    if (bank[i]) out.push(Object.assign({}, bank[i], { theme: theme.id, subject: theme.subject, bankIdx: i, retry:true }));
  });
  let pool = bank.map((_, i) => i).filter(i => !(st.used || []).includes(i) && !retry.includes(i));
  if (out.length + pool.length < nBank) { st.used = []; pool = bank.map((_, i) => i).filter(i => !retry.includes(i)); }
  shuffle(pool).slice(0, nBank - out.length).forEach(i => {
    out.push(Object.assign({}, bank[i], { theme: theme.id, subject: theme.subject, bankIdx: i }));
  });
  // démarrer par une question gagnable : la revanche vient en 2e et 3e position
  if (retry.length && out.length > retry.length){
    const first = out.splice(retry.length, 1)[0];
    out.unshift(first);
  }
  // générateurs : réserve infinie quand la banque est épuisée. L'étape leur est
  // passée — à l'étape 1 ils proposent de la reconnaissance plutôt que de la frappe.
  if (out.length < n && aGen){
    // 1er passage : on cherche des énoncés inédits dans ce bloc.
    let guard = 0;
    while (out.length < n && guard++ < n * 12){
      const g = GENS[theme.gen](et);
      if (g && !out.some(o => o.q === g.q)){
        out.push(Object.assign(g, { theme: theme.id, subject: theme.subject, gen:true }));
      }
    }
    // 2e passage : la liste est trop courte pour remplir 24 énoncés distincts
    // (Vocabulaire 3 = deux mots). On accepte alors de repasser sur les mêmes —
    // revoir « das Salz » trois fois dans un bloc est un entraînement, pas un
    // bug. Sans ce filet le bloc rendait 11 questions au lieu de 24.
    guard = 0;
    while (out.length < n && guard++ < n * 4){
      const g = GENS[theme.gen](et);
      if (g) out.push(Object.assign(g, { theme: theme.id, subject: theme.subject, gen:true }));
    }
  }
  // Dernier filet : pas de générateur et une banque trop courte — on recycle la
  // banque elle-même plutôt que de rendre un bloc tronqué.
  if (out.length < n && bank.length){
    let garde = 0;
    while (out.length < n && garde++ < n){
      shuffle(bank.map((_, i) => i)).forEach(i => {
        if (out.length < n) out.push(Object.assign({}, bank[i],
          { theme: theme.id, subject: theme.subject, bankIdx: i }));
      });
    }
  }
  // à l'étape 1, ce qui se tape se choisit
  return out.slice(0, n).map(it => et === 1 ? facile(it, theme) : it);
}
function markUsed(item){
  if (item.gen || item.bankIdx == null) return;
  const st = S.themes[item.theme];
  st.used = st.used || [];
  if (!st.used.includes(item.bankIdx)) st.used.push(item.bankIdx);
  if (st.used.length > Math.max(4, (THEME_BY_ID[item.theme].items || []).length - 3)) st.used = st.used.slice(-4);
}

/* ---------- le plan du jour ---------- */
function todaysPlan(){
  const t0 = today();
  const dayIx = Math.max(0, diffDays(S.start, t0));
  const done = (S.days[t0] && S.days[t0].blocks) || [];

  // 1. Révision : ce que les boîtes réclament aujourd'hui — les notions
  // récemment ratées passent devant, et une liste dont le test approche revient
  // qu'elle soit due ou non : l'école ne consulte pas les boîtes.
  const urgent = urgentThemes();
  const forced = urgent.filter(t => S.themes[t.id].box >= 1);
  const due = forced.concat(
      dueThemes()
        .filter(t => forced.indexOf(t) === -1)
        .sort((a,b) => {
          const ra = histAcc(S.themes[a.id], -3), rb = histAcc(S.themes[b.id], -3);
          return (ra === null ? 1 : ra) - (rb === null ? 1 : rb);
        }))
    .slice(0, 4);
  const rev = { kind:"revision", n:1, title:"Révision", themes: due.map(t => t.id),
    sub: forced.length
      ? "Tu as un test qui arrive — " + forced[0].t + " : " + testLabel(forced[0]) + "."
      : due.length
        ? "Les notions que tes boîtes réclament aujourd'hui."
        : "Rien à revoir aujourd'hui — je te fais réviser tes notions les plus fragiles." };
  if (!due.length){
    const weak = seenThemes().sort((a,b) => (mastery(a)||0) - (mastery(b)||0)).slice(0,2);
    if (weak.length){
      rev.themes = weak.map(t => t.id);
    } else {
      const basics = THEMES.filter(t => t.tier === "revision" && S.themes[t.id].box === 0).slice(0,2);
      rev.themes = basics.map(t => t.id);
      rev.title = "Échauffement";
      rev.sub = "On part des acquis de 10e — c'est ce qui remplit tes boîtes de révision.";
    }
  }

  // 2. Leçon du jour : une liste jamais vue dont le test approche passe devant
  // la rotation ; sinon, nouvelle notion, matières en rotation
  let lead = urgent.filter(t => S.themes[t.id].box === 0)[0] || null;
  for (let k = 0; k < ROTATION.length && !lead; k++){
    const sk = ROTATION[(dayIx + k) % ROTATION.length];
    const cands = newThemes(sk);
    if (cands.length) lead = cands.sort((a,b) => a.order - b.order)[0];
  }
  const lesson = lead
    ? { kind:"lesson", n:2, title:"Leçon du jour", themes:[lead.id], sub: lead.t }
    : { kind:"lesson", n:2, title:"Reprise", themes:[ (seenThemes().sort((a,b) => (mastery(a)||0)-(mastery(b)||0))[0] || THEMES[0]).id ],
        sub:"Tout le programme est passé au moins une fois — on reprend le point le plus fragile, leçon comprise." };

  // 3. Défi mixte : les 4 matières mélangées, au chrono
  const pool = seenThemes().length >= 4 ? seenThemes() : THEMES;
  const bySub = {};
  shuffle(pool).forEach(t => { if (!bySub[t.subject]) bySub[t.subject] = t; });
  const defi = { kind:"defi", n:3, title:"Défi mixte", themes: Object.values(bySub).map(t => t.id),
    sub:BLOC_DEFI+" questions, les quatre matières mélangées. Les combos rapportent double." };

  const plan = [rev, lesson, defi];

  // 4. Le grand défi : une fois toutes les trois journées complètes, plus long,
  //    plus dur, et beaucoup mieux payé. Il n'apparaît que s'il est mérité.
  if (bonusOuvert()){
    plan.push({ kind:"bonus", n:4, title:"Le grand défi", themes: themesDurs(),
      sub: BLOC_BONUS + " questions, tout à écrire, les notions les plus exigeantes. "
         + CTS_BONUS_JUSTE + " ct la bonne réponse et " + chf(CTS_BONUS_BLOC) + " CHF si tu vas au bout." });
  }

  return plan.map(b => Object.assign(b, { done: done.includes(b.kind) }));
}

/* ---------- le grand défi : quand, et sur quoi ----------

   « Toutes les trois sessions » = toutes les trois JOURNÉES COMPLÈTES (trois
   blocs). Un palier de trois journées n'ouvre qu'un seul défi : on compte les
   paliers gagnés et les paliers déjà pris, ce qui rend la règle insensible à
   l'ordre des choses et impossible à farmer — une journée ne compte qu'une fois.  */
/* Une journée est complète quand les TROIS blocs ordinaires sont faits. Le grand
   défi ne compte pas : sinon un défi joué à la place du défi mixte « finirait »
   la journée, et ouvrirait le palier suivant en travaillant moins. */
const KINDS_JOUR = ["revision", "lesson", "defi"];
function blocsOrdinaires(j){
  return (((j || {}).blocks) || []).filter(k => KINDS_JOUR.indexOf(k) >= 0).length;
}
function joursComplets(){
  return Object.keys(S.days || {}).filter(d => blocsOrdinaires(S.days[d]) >= 3).length;
}
function paliersBonus(){ return Math.floor(joursComplets() / BONUS_TOUS_LES); }
function bonusOuvert(){
  if (!seenThemes().length) return false;
  return paliersBonus() > ((S.bonus || {}).pris || 0);
}
/* Les notions « les plus exigeantes » : d'abord le niveau (anticipation, puis
   consolidation), ensuite celles qui tiennent le mieux — un défi doit être
   difficile, pas décourageant. On ne prend que du déjà vu. */
function themesDurs(){
  const poids = { anticipation:0, consolidation:1, programme:2, revision:3 };
  return seenThemes()
    .sort((a, b) => (poids[a.tier] ?? 9) - (poids[b.tier] ?? 9) || (mastery(b) || 0) - (mastery(a) || 0))
    .slice(0, 5).map(t => t.id);
}
function blockItems(block){
  const ids = block.themes.filter(id => THEME_BY_ID[id]);
  if (!ids.length) return [];
  const per = block.kind === "defi" ? BLOC_DEFI : block.kind === "bonus" ? BLOC_BONUS : BLOC_LONG;
  // le grand défi force l'étape 2 : on écrit la réponse, on ne la choisit pas —
  // c'est là qu'est la difficulté, et c'est ce qu'il est payé plus cher.
  const et = block.kind === "bonus" ? 2 : null;
  if (block.kind === "lesson") return itemsFor(THEME_BY_ID[ids[0]], per);
  const each = Math.max(1, Math.ceil(per / ids.length));
  let out = [];
  ids.forEach(id => { out = out.concat(itemsFor(THEME_BY_ID[id], each, et)); });
  return shuffle(out).slice(0, per);
}

/* ---------- badges ---------- */
const BADGES = [
  { id:"d3",   em:"🔥", t:"3 jours",        ok:s => s.best >= 3 },
  { id:"d7",   em:"🔥", t:"1 semaine",      ok:s => s.best >= 7 },
  { id:"d14",  em:"🔥", t:"2 semaines",     ok:s => s.best >= 14 },
  { id:"d30",  em:"🏔", t:"30 jours",       ok:s => s.best >= 30 },
  { id:"xp1",  em:"⭐", t:"1000 XP",        ok:s => s.xp >= 1000 },
  { id:"xp5",  em:"🌟", t:"5000 XP",        ok:s => s.xp >= 5000 },
  { id:"acq",  em:"📦", t:"1re notion acquise", ok:s => THEMES.some(t => s.themes[t.id].box === 5) },
  { id:"acq10",em:"🎓", t:"10 notions acquises", ok:s => THEMES.filter(t => s.themes[t.id].box === 5).length >= 10 },
  { id:"full", em:"✅", t:"Journée complète", ok:s => Object.values(s.days).some(d => (d.blocks||[]).length >= 3) },
  { id:"net",  em:"🎯", t:"Sans faute",      ok:s => Object.values(s.days).some(d => d.total >= 6 && d.right === d.total) }
];
function refreshBadges(){
  const got = [];
  BADGES.forEach(b => { if (b.ok(S)) got.push(b.id); });
  const isNew = got.filter(id => !S.badges.includes(id));
  S.badges = got;
  return isNew;
}

/* ---------- fin de bloc : compta ---------- */
function recordBlock(block, res){
  const t0 = today();
  const d = S.days[t0] || { blocks:[], xp:0, right:0, total:0, cts:0 };
  if (!d.blocks.includes(block.kind)) d.blocks.push(block.kind);
  d.xp += res.xp; d.right += res.right; d.total += res.total;
  // le bloc n'est payé QUE terminé — recordBlock n'est appelé que par finish()
  d.cts = (d.cts || 0) + (res.cts || 0) + (block.kind === "bonus" ? CTS_BONUS_BLOC : CTS_BLOC);
  S.days[t0] = d;
  // un palier de grand défi ne s'ouvre qu'une fois : on le consomme ICI, à la
  // fin du bloc, jamais à son ouverture — un défi commencé puis abandonné reste
  // disponible.
  if (block.kind === "bonus"){
    S.bonus = S.bonus || {};
    S.bonus.pris = paliersBonus();
  }
  S.wallet = S.wallet || { verse:0 };
  S.wallet.cts = ctsDepuisJours(S.days);

  // série : un bloc suffit à tenir la journée
  if (S.lastDay !== t0){
    S.streak = (S.lastDay && diffDays(S.lastDay, t0) === 1) ? S.streak + 1 : 1;
    S.lastDay = t0;
  }
  S.best = Math.max(S.best, S.streak);

  let bonus = XP_BLOCK;
  if (blocsOrdinaires(d) === 3) bonus += XP_DAY;
  S.xp += res.xp + bonus;

  // journal des fautes (borné) + rachat des exercices retentés
  S.errors = (S.errors || []).concat(res.errs || []).slice(-400);
  (res.itemLog || []).forEach(e => {
    if (e.k == null) return;
    // Une reprise ne rachète pas : elle a lieu deux minutes après la faute, ce
    // qui ne prouve rien sur demain. Le rachat reste ce qu'il était — réussir
    // l'exercice à froid, dans une session suivante.
    if (e.rep) return;
    const st = S.themes[e.id];
    st.miss = st.miss || {};
    const m = st.miss[e.k];
    if (!e.ok){ st.miss[e.k] = { f: (m ? m.f : 0) + 1, s: 0 }; }
    else if (m){
      m.s = (m.s || 0) + 1;
      if (m.s >= 2) delete st.miss[e.k];   // racheté : 2 réussites d'affilée
    }
  });

  const moves = [];
  Object.keys(res.byTheme).forEach(id => {
    const r = res.byTheme[id];
    const st = S.themes[id];
    // premiers passages seulement — voir le commentaire dans grade()
    const tot = r.pTotal != null ? r.pTotal : r.total;
    const bon = r.pTotal != null ? r.pRight : r.right;
    st.seen += tot; st.right += bon;
    st.hist = (st.hist || []).concat({ d: t0, ok: bon, tot: tot }).slice(-20);
    const mv = moveBox(id, tot ? bon / tot : 0);
    if (mv.from !== mv.to) moves.push({ id, from:mv.from, to:mv.to });
  });
  const newBadges = refreshBadges();
  save();
  // le bilan part tout seul si un dossier a été désigné — annoncé quand la
  // journée est complète, discret le reste du temps
  const dayComplete = blocsOrdinaires(d) === 3;
  ecrireBilan(dayComplete);
  ecrireProgression();
  return { bonus, moves, newBadges, dayComplete };
}

/* ---------- le porte-monnaie ----------
   Ce que le travail rapporte, en argent réel, visible pendant qu'il se gagne.
   Le tarif est affiché : c'est ce qui permet de compter dans sa tête au lieu de
   découvrir un chiffre à la fin. « Gagné » ne baisse jamais — on ne retire pas
   ce qui a été mérité ; seul « à toucher » redescend, quand le parent paie. */
function aVerser(){
  const w = S.wallet || {};
  return Math.max(0, (w.cts || 0) - (w.verse || 0));
}
/* Ce que vaut une journée, annoncé honnêtement : le maximum suppose zéro faute
   (et donc zéro reprise) ; la valeur « typique » retire les créneaux mangés par
   les reprises, qui ne sont pas payés. Promettre le maximum serait un mensonge
   d'un franc par jour. */
function jourMax(){ return (BLOC_LONG * 2 + BLOC_DEFI) * CTS_JUSTE + 3 * CTS_BLOC; }
function jourTypique(){
  const q = (BLOC_LONG * 2 + BLOC_DEFI) * 0.9;          // ~10 % des créneaux en reprises
  return Math.round(q * (CTS_JUSTE * 0.8 + CTS_ESSAI * 0.2)) + 3 * CTS_BLOC;
}
function porteMonnaieHTML(){
  const w = S.wallet || {};
  const t0 = today();

  <div class="pm-tarif">

    <b>${CTS_BLOC} ct</b> par bloc terminé. Une journée complète vaut environ
    <b>${chf(jourTypique())} CHF</b>, et <b>${chf(jourMax())} CHF</b> si tout est juste.
    Les questions qui reviennent dans le bloc ne sont pas payées une seconde fois.
  </div>
  ${jours.length ? `<div class="pm-jours">${jours.map(d => {
    const j = S.days[d] || {};
    return `<div class="pm-lig"><span>${d === t0 ? "Aujourd'hui" : frDate(d)}
      <small style="color:var(--ink-3)">· ${j.right || 0}/${j.total || 0}</small></span>
      <b>${chf(ctsJour(j, d))}</b></div>`;
  }).join("")}</div>` : ""}
  ${(S.retraits || []).length ? `<div class="pm-jours">${(S.retraits || []).slice(-4).reverse().map(r =>
    `<div class="pm-lig"><span>Retrait demandé le ${frDate(r.d)}</span><b>−${chf(r.cts)}</b></div>`
  ).join("")}</div>` : ""}
  <button class="cta ghost" id="paye">Je retire mon argent</button>`;
}

function calHTML(){
  const t0 = today();
  const first = addDays(S.start, -(( parse(S.start).getDay() + 6) % 7));   // lundi de la semaine de départ
  const weeks = Math.max(6, Math.ceil((diffDays(first, SCHOOL_START) + 1) / 7));
  const cells = [];
  for (let i = 0; i < weeks*7; i++){
    const day = addDays(first, i);
    const rec = S.days[day];
    const n = rec ? (rec.blocks || []).length : 0;
    const cls = ["cd"];
    if (day < S.start) cls.push("void");
    else if (day > t0) cls.push("future");
    if (day === t0) cls.push("today");
    if (n >= 3) cls.push("full");
    cells.push(`<div class="${cls.join(" ")}" title="${day}${n ? " · "+n+" bloc(s)":""}">
      ${day < S.start ? "" : `<span>${parse(day).getDate()}</span>
      <span class="pips">${[0,1,2].map(k => k < n ? "<i></i>" : "").join("")}</span>`}
      ${day === SCHOOL_START ? '<span class="school" title="Rentrée"></span>' : ""}
    </div>`);
  }
  return `<div class="cal-head">${["lu","ma","me","je","ve","sa","di"].map(d => `<div>${d}</div>`).join("")}</div>
    <div class="cal">${cells.join("")}</div>`;
}

function weekCount(){
  const t0 = today();
  const mon = addDays(t0, -((parse(t0).getDay() + 6) % 7));
  let n = 0;
  for (let i = 0; i < 7; i++){
    const d = addDays(mon, i);
    if (S.days[d] && (S.days[d].blocks || []).length) n++;
  }
  return n;
}

function bindHome(){
  root.querySelectorAll(".block:not(:disabled)").forEach(el => {
    el.addEventListener("click", () => startBlock(el.dataset.kind));
  });
  const th = root.querySelector("#th");
  if (th) th.addEventListener("click", () => { setTheme(currentTheme() === "dark" ? "light" : "dark"); render(); });
  const bil = root.querySelector("#bil");
  if (bil) bil.addEventListener("click", envoyerBilan);
  const imp = root.querySelector("#imp"), impf = root.querySelector("#impf");
  if (imp && impf){
    imp.addEventListener("click", () => impf.click());
    impf.addEventListener("change", () => {
      importerProgression(impf.files && impf.files[0]);
      impf.value = "";                       // reprendre deux fois de suite reste possible
    });
  }
  const paye = root.querySelector("#paye");
  if (paye) paye.addEventListener("click", () => {
    const du = aVerser();
    if (!du){ toast("Rien à retirer pour l'instant — au travail !"); return; }
    /* LE RETRAIT EST À LUI (26 août 2026).

       Avant, ce bouton disait « Papa m'a payé » : l'enfant confirmait une
       décision prise par quelqu'un d'autre. Il dit maintenant « je retire » —
       c'est lui qui choisit le moment. Choisir quand on touche son argent est
       l'une des rares dimensions par lesquelles une récompense matérielle
       soutient l'autonomie au lieu de la réduire ; le reste du montage
       (le tarif, le montant, le calendrier) ne lui appartient pas.

       La demande part dans le bilan ; l'argent, lui, est viré par le parent :
       aucune API ne permet de créditer un TWINT depuis un serveur. */
    demander("Retirer " + chf(du) + " CHF ?",
      "Ton argent part sur ton compte. Envoie ton bilan juste après pour que "
      + "Papa voie la demande — le virement, c'est lui qui le fait.",
      "Oui, je retire",
      () => {
        S.retraits = (S.retraits || []).concat({ d: today(), cts: du }).slice(-20);
        S.wallet.verse = S.wallet.cts;
        save(); render();
        toast(chf(du) + " CHF demandés 💰 — envoie ton bilan !");
      });
  });
  const depon = root.querySelector("#depon");
  if (depon) depon.addEventListener("click", activerDepot);
  const depoff = root.querySelector("#depoff");
  if (depoff) depoff.addEventListener("click", arreterDepot);
  const rst = root.querySelector("#rst");
  if (rst) rst.addEventListener("click", () => {
    demander("Tout effacer ?",
      "La série, les XP, les boîtes de révision et le porte-monnaie repartent de zéro. "
      + "C'est sans retour.", "Tout effacer",
      () => {
        S = fresh(); THEMES.forEach(t => S.themes[t.id] = { box:0, due:today(), seen:0, right:0, used:[] });
        save(); render();
      });
  });
}

/* ---------- le bilan : faire sortir la progression de l'appareil ----------
   La progression vit dans localStorage, donc dans CE navigateur et nulle part
   ailleurs. Le bilan est le seul pont, et il ne passe jamais par le réseau :
   c'est la feuille de partage du téléphone, ou le disque via le dépôt
   automatique (plus bas), qui fait le travail.

   Deux chemins, et le second n'existe que si l'élève a désigné un dossier :
     — « Envoyer mon bilan » : le geste, disponible partout ;
     — le dépôt automatique : l'app écrit seule, sur ordinateur uniquement.
   Dans les deux cas l'élève voit ce qui part — rien ne se fait à son insu. */
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  el.setAttribute("role", "status");
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function bilan(){
  const t0 = today();

  const boites = {};
  [1,2,3,4,5].forEach(b => { boites[BOX_LABEL[b]] = THEMES.filter(t => S.themes[t.id].box === b).length; });

  const matieres = {};
  ORDER.forEach(sk => {
    matieres[SUB[sk].label] = {
      maitrise: subjectMastery(sk),
      notions_vues: BANK[sk].themes.filter(t => S.themes[t.id].box >= 1).length,
      notions_total: BANK[sk].themes.length
    };
  });

  const fragiles = seenThemes()
    .map(t => ({ t, m: mastery(t) })).filter(x => x.m !== null)
    .sort((a,b) => a.m - b.m).slice(0,5)
    .map(x => ({
      matiere: SUB[x.t.subject].label, notion: x.t.t, niveau: x.t.tier,
      boite: S.themes[x.t.id].box, maitrise: x.m,
      reussite: S.themes[x.t.id].right + "/" + S.themes[x.t.id].seen
    }));

  const activite = Object.keys(S.days).sort().slice(-21).map(d => ({
    jour: d, blocs: (S.days[d].blocks || []).length,
    justes: S.days[d].right, questions: S.days[d].total, xp: S.days[d].xp,
    cts: ctsJour(S.days[d], d)
  }));

  // les fautes récentes, en clair : question, bonne réponse, réponse donnée
  const fautes = (S.errors || []).slice(-60).map(e => {
    const t = THEME_BY_ID[e.id];
    return { jour: e.d, matiere: t ? SUB[t.subject].label : "?", notion: t ? t.t : e.id,
             format: e.f, question: e.q, attendu: e.a, repondu: e.r };
  });

  // par notion : le progrès mesuré (3 derniers blocs vs 3 précédents)
  const progres = seenThemes().map(t => {
    const st = S.themes[t.id];
    const tr = trend(t);
    if (tr === null) return null;
    return {
      matiere: SUB[t.subject].label, notion: t.t, boite: st.box,
      avant: Math.round(100 * (histAcc(st, -6, -3) ?? 0)),
      recent: Math.round(100 * (histAcc(st, -3) ?? 0)),
      direction: tr === "up" ? "en progrès" : tr === "down" ? "en recul" : "stable",
      a_retravailler: missIdx(st).length
    };
  }).filter(Boolean);

  // le programme de l'école : où en est chaque liste par rapport à sa date de test
  const programme = THEMES.filter(t => t.tests && t.tests.length).map(t => {
    const st = S.themes[t.id];
    return {
      matiere: SUB[t.subject].label, notion: t.t,
      ouverte: isOpen(t), ouvre_le: t.from || null,
      prochain_test: nextTest(t), jours_restants: daysToTest(t),
      boite: st.box, maitrise: mastery(t),
      reussite: st.seen ? st.right + "/" + st.seen : null,
      a_retravailler: missIdx(st).length
    };
  }).sort((a,b) => (a.prochain_test || "9999").localeCompare(b.prochain_test || "9999"));

  return {
    app: "onze", format: 4, eleve: ELEVE, genere: t0,
    depuis: S.start,
    // le porte-monnaie : c'est le chiffre que le parent doit voir sans ouvrir l'app
    porte_monnaie: {
      gagne_cts: (S.wallet || {}).cts || 0,
      verse_cts: (S.wallet || {}).verse || 0,
      a_verser_cts: aVerser(),
      tarif: { juste: CTS_JUSTE, essai: CTS_ESSAI, bloc: CTS_BLOC }
    },
    // ce qu'il a demandé à retirer, et quand : c'est LUI qui choisit le moment
    retraits: (S.retraits || []).map(r => ({ date: r.d, cts: r.cts })),
    jours_avant_rentree: Math.max(0, diffDays(t0, SCHOOL_START)),
    serie: { actuelle: S.streak, record: S.best },
    xp: S.xp,
    notions: { total: THEMES.length, vues: seenThemes().length,
               acquises: THEMES.filter(t => S.themes[t.id].box === 5).length },
    boites: boites,
    matieres: matieres,
    fragiles: fragiles,
    fautes: fautes,
    progres: progres,
    programme: programme,
    activite: activite,
    trophees: S.badges,
    // sauvegarde intégrale : sans elle, vider le navigateur efface tout sans retour
    etat: S
  };
}

function envoyerBilan(){
  let data, txt;
  try{
    data = bilan();
    txt = JSON.stringify(data, null, 2);
  }catch(e){
    toast("Le bilan n'a pas pu être préparé. Montre l'app à un adulte.");
    return;
  }

  const nom = "ONZE_bilan_" + (ELEVE || "eleve") + "_" + data.genere + ".json";
  const blob = new Blob([txt], { type:"application/json" });

  // 1) feuille de partage native : kDrive y apparaît comme destination
  try{
    const fichier = new File([blob], nom, { type:"application/json" });
    if (navigator.canShare && navigator.canShare({ files:[fichier] })){
      navigator.share({ files:[fichier], title:"Bilan ONZE" })
        .then(() => toast("Bilan envoyé. Bravo — tu peux retourner réviser."))
        .catch(err => { if (!err || err.name !== "AbortError") telecharger(blob, nom); });
      return;
    }
  }catch(e){ /* File ou canShare indisponible : on télécharge */ }

  telecharger(blob, nom, txt);
}

function telecharger(blob, nom, txt){
  /* Dans un CADRE — c'est le cas de la page publiée en artefact — le
     téléchargement est refusé par le bac à sable, et il échoue en SILENCE :
     le clic ne fait rien, aucune erreur n'est levée, et le message
     « Bilan enregistré » mentirait. Or c'est précisément le moment où l'élève
     croit avoir envoyé son travail. On lui donne donc le texte à copier, ce
     qui marche partout. */
  if (window !== window.top){ panneauTexte(txt, nom); return; }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Bilan enregistré : « " + nom + " ». Dépose-le dans kDrive.");
  }catch(e){
    panneauTexte(txt, nom);
  }
}

/* Demander confirmation SANS `confirm()` (26 août 2026).

   « Papa m'a payé » ne marchait pas, et la cause n'était pas le bouton : dans un
   cadre bac à sable — c'est le cas de la page publiée en artefact — les boîtes
   de dialogue du navigateur sont interdites. `confirm()` rend `false` sans rien
   afficher, donc le clic ne faisait RIEN, en silence. Le même piège rendait le
   bouton « quitter » inopérant : impossible de sortir d'un bloc.

   On pose donc la question DANS la page, ce qui marche partout. */
function demander(titre, texte, libelleOui, onOui){
  const fond = document.createElement("div");
  fond.className = "sheet";
  fond.innerHTML = `
    <div class="sheet-in">
      <h3>${esc(titre)}</h3>
      <p>${texte}</p>
      <div class="cta-row">
        <button class="cta" id="dok">${esc(libelleOui)}</button>
        <button class="cta ghost" id="dno">Annuler</button>
      </div>
    </div>`;
  document.body.appendChild(fond);
  fond.querySelector("#dno").addEventListener("click", () => fond.remove());
  fond.querySelector("#dok").addEventListener("click", () => { fond.remove(); onOui(); });
}

/* Le bilan à copier, quand aucun fichier ne peut sortir. */
function panneauTexte(txt, nom){
  const fond = document.createElement("div");
  fond.className = "sheet";
  fond.innerHTML = `
    <div class="sheet-in">
      <h3>Copie ton bilan</h3>
      <p>Ici, la page n'a pas le droit d'enregistrer un fichier. Copie tout le
         texte et colle-le dans un message à Papa — c'est exactement le même
         bilan.</p>
      <textarea readonly id="bt"></textarea>
      <div class="cta-row">
        <button class="cta" id="btcopy">Tout copier</button>
        <button class="cta ghost" id="btclose">Fermer</button>
      </div>
      <div class="pm-tarif">Fichier : ${esc(nom)}</div>
    </div>`;
  document.body.appendChild(fond);
  const zone = fond.querySelector("#bt");
  zone.value = txt;
  fond.querySelector("#btcopy").addEventListener("click", () => {
    zone.focus(); zone.select();
    let fait = false;
    try { fait = document.execCommand("copy"); } catch(e){ fait = false; }
    if (fait) toast("Bilan copié. Colle-le dans un message à Papa.");
    else if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt)
        .then(() => toast("Bilan copié. Colle-le dans un message à Papa."))
        .catch(() => toast("Sélectionne le texte et copie-le à la main."));
    } else toast("Sélectionne le texte et copie-le à la main.");
  });
  fond.querySelector("#btclose").addEventListener("click", () => fond.remove());
}

/* ---------- le dépôt automatique (ordinateur seulement) ----------
   Se souvenir de cliquer, c'est précisément ce qu'on ne peut pas demander à
   quelqu'un qui révise. Sur un ordinateur, l'API File System Access laisse
   l'élève désigner UNE fois un dossier — celui du kDrive — après quoi l'app y
   écrit son bilan toute seule à la fin de chaque bloc.

   Ça reste hors-ligne : c'est le navigateur qui écrit sur le disque, il n'y a
   aucun appel réseau. Et ça reste visible : le dépôt est annoncé, l'état est
   affiché en bas de l'écran d'accueil, et l'élève peut l'arrêter d'un clic.
   Automatique, mais jamais à son insu.

   Sur téléphone (Safari iOS n'a pas cette API), rien ne change : le bouton
   « Envoyer mon bilan » reste le chemin. */
/* ============================================================
   LE CARNET DE PROGRESSION — un fichier, plusieurs supports
   ============================================================

   `localStorage` est cloisonné par origine ET par navigateur : le téléphone,
   l'ordinateur, la page publiée et le fichier ouvert en `file://` ont chacun
   leur carnet, et aucun ne sait ce que les autres ont fait. Trois blocs faits
   sur le mauvais support étaient perdus pour de bon.

   Le fichier `ONZE_progression_<élève>.json` devient la mémoire commune. À
   l'ouverture on le LIT et on le FUSIONNE avec ce qu'il y a en local ; après
   chaque bloc on le RÉÉCRIT. Deux supports peuvent donc diverger sans que rien
   ne se perde.

   Ce qu'on ne peut pas faire, et il faut le dire : Safari iOS n'a aucune API
   pour lire ou écrire un fichier sans geste de l'élève. « Automatique partout »
   n'existe pas hors ligne. D'où deux régimes :
     · ordinateur (Chrome/Edge, dossier désigné) → lecture et écriture SEULES,
       sans rien demander ;
     · partout ailleurs (téléphone, file://) → un bouton « Reprendre ma
       progression » qui ouvre le sélecteur de fichiers, et le partage habituel
       pour ressortir.

   LA FUSION NE PERD JAMAIS RIEN. Chaque règle est monotone : on garde la boîte
   la plus haute, le jour le plus fourni, l'union des blocs et des trophées. Un
   carnet fusionné est toujours au moins aussi avancé que chacun des deux. */

function fusionJours(a, b){
  const out = {};
  Object.keys(a || {}).concat(Object.keys(b || {})).forEach(d => {
    const x = (a || {})[d], y = (b || {})[d];
    // une journée présente d'un seul côté passe telle quelle — mais on lui pose
    // son montant au passage : sans ça, la première fusion la laissait sans
    // `cts`, la seconde le calculait, et la fusion cessait d'être idempotente.
    if (!x || !y){ const j = x || y; out[d] = Object.assign({}, j, { cts: ctsJour(j, d) }); return; }
    const blocs = [...new Set([].concat(x.blocks || [], y.blocks || []))];
    const communs = (x.blocks || []).filter(k => (y.blocks || []).includes(k));
    if (!communs.length){
      // journées complémentaires (le bus le matin, le bureau le soir) : ça s'additionne
      out[d] = { blocks:blocs, xp:(x.xp||0)+(y.xp||0),
                 right:(x.right||0)+(y.right||0), total:(x.total||0)+(y.total||0),
                 cts:ctsJour(x, d)+ctsJour(y, d) };
    } else {
      // un même bloc des deux côtés : on ne compte pas deux fois, le plus fourni gagne
      const gros = (y.total||0) > (x.total||0) ? y : x;
      out[d] = { blocks:blocs, xp:Math.max(x.xp||0, y.xp||0),
                 right:gros.right||0, total:gros.total||0,
                 cts:Math.max(ctsJour(x, d), ctsJour(y, d)) };
    }
  });
  return out;
}

function fusionHist(a, b){
  const par = {};
  [].concat(a || [], b || []).forEach(h => {
    if (!h || !h.d) return;
    const v = par[h.d];
    if (!v || (h.tot || 0) > (v.tot || 0)) par[h.d] = h;
  });
  return Object.keys(par).sort().map(d => par[d]).slice(-20);
}

function fusionMiss(a, b){
  const out = {};
  Object.keys(a || {}).concat(Object.keys(b || {})).forEach(k => {
    const x = (a || {})[k], y = (b || {})[k];
    if (!x || !y){ out[k] = x || y; return; }
    // le plus de fautes, le moins de rachats : on redemande plutôt que d'oublier
    out[k] = { f: Math.max(x.f||0, y.f||0), s: Math.min(x.s||0, y.s||0) };
  });
  return out;
}

function fusionNotion(x, y){
  if (!x || !y) return x || y;
  // seen et right viennent du MÊME carnet, sinon on peut obtenir right > seen
  const riche = (y.seen||0) > (x.seen||0) ? y : x;
  const haut  = (y.box||0)  > (x.box||0)  ? y : x;
  return {
    box:  Math.max(x.box||0, y.box||0),
    due:  haut.due,
    seen: riche.seen||0,
    right: riche.right||0,
    used: [...new Set([].concat(x.used||[], y.used||[]))].slice(-8),
    miss: fusionMiss(x.miss, y.miss),
    hist: fusionHist(x.hist, y.hist)
  };
}

/* Le porte-monnaie se RECALCULE depuis les journées — il ne s'incrémente jamais
   en aveugle. Même raison que pour les XP : deux supports qui divergent doivent
   pouvoir fusionner sans qu'un centime soit compté deux fois ni perdu.
   `verse`, lui, ne se recalcule pas : c'est un fait du monde réel. */
/* Le porte-monnaie n'existe que depuis le 25 août 2026. Les journées d'avant
   ne valent RIEN — décision du parent le 26 août : « on repart de zéro ».
   Elles avaient d'abord été chiffrées rétroactivement (~22 CHF) ; payer un
   travail fourni avant que le tarif existe brouillait le message même du
   tarif. Le travail de ces journées reste dans les XP, les boîtes et la
   maîtrise : c'est l'argent qui commence le 25, pas l'histoire. */
const ARGENT_DEPUIS = "2026-08-25";
function ctsJour(j, d){
  if (!j) return 0;
  if (d && d < ARGENT_DEPUIS) return 0;
  return j.cts || 0;
}
function ctsDepuisJours(days){
  let c = 0;
  Object.keys(days || {}).forEach(d => { c += ctsJour(days[d], d); });
  return c;
}

function xpDepuisJours(days){
  let x = 0;
  Object.keys(days || {}).forEach(d => {
    const j = days[d], n = (j.blocks || []).length;
    x += (j.xp || 0) + n * XP_BLOCK + (n >= 3 ? XP_DAY : 0);
  });
  return x;
}

function serieDepuisJours(days){
  const actifs = Object.keys(days || {}).filter(d => ((days[d].blocks) || []).length).sort();
  if (!actifs.length) return { streak:0, last:null };
  let n = 1;
  for (let i = actifs.length - 1; i > 0; i--){
    if (diffDays(actifs[i-1], actifs[i]) === 1) n++; else break;
  }
  return { streak:n, last: actifs[actifs.length - 1] };
}

/* Fusionne `autre` DANS l'état courant. Rend un résumé de ce qui a bougé —
   une fusion muette serait invérifiable, et on ne saurait jamais si le
   fichier a vraiment servi. */
function fusionner(local, autre){
  const jours = fusionJours(local.days, autre.days);
  const themes = {};
  let montees = 0;
  Object.keys(local.themes || {}).concat(Object.keys(autre.themes || {})).forEach(id => {
    if (themes[id]) return;
    const av = (local.themes || {})[id];
    const f = fusionNotion(av, (autre.themes || {})[id]);
    if (f) themes[id] = f;
    if (av && f && (f.box || 0) > (av.box || 0)) montees++;
  });
  const serie = serieDepuisJours(jours);
  const nouveauxJours = Object.keys(jours).filter(d => !(local.days || {})[d]).length;

  const fus = {
    v: 3,
    start: [local.start, autre.start].filter(Boolean).sort()[0] || local.start,
    xp: xpDepuisJours(jours),
    // le gagné se recalcule depuis les journées fusionnées ; le versé, lui, est
    // un fait — on garde le plus élevé des deux carnets, jamais la somme, sinon
    // un même paiement enregistré des deux côtés serait décompté deux fois.
    wallet: { cts: ctsDepuisJours(jours),
              verse: Math.max((local.wallet||{}).verse||0, (autre.wallet||{}).verse||0) },
    streak: serie.streak,
    best: Math.max(local.best || 0, autre.best || 0, serie.streak),
    lastDay: serie.last || local.lastDay || autre.lastDay,
    themes: themes,
    days: jours,
    badges: [...new Set([].concat(local.badges || [], autre.badges || []))],
    errors: fusionErreurs(local.errors, autre.errors)
  };
  return { etat: fus, jours: nouveauxJours, montees: montees,
           xp: (fus.xp || 0) - (local.xp || 0) };
}

function fusionErreurs(a, b){
  const vu = new Set(), out = [];
  [].concat(a || [], b || []).forEach(e => {
    if (!e) return;
    const cle = [e.d, e.id, e.q].join("|");
    if (vu.has(cle)) return;
    vu.add(cle); out.push(e);
  });
  return out.sort((x, y) => String(x.d).localeCompare(String(y.d))).slice(-400);
}

/* Accepte un carnet de progression, mais AUSSI n'importe quel bilan déjà
   partagé : tous deux portent l'état complet sous `etat`. Ça évite d'avoir à
   expliquer quel fichier reprendre. */
function etatDepuis(json){
  if (!json || typeof json !== "object") return null;
  const e = json.etat && typeof json.etat === "object" ? json.etat : json;
  return (e && e.themes && typeof e.themes === "object") ? e : null;
}

function appliquerFusion(autre){
  const r = fusionner(S, autre);
  S = r.etat;
  THEMES.forEach(t => {
    if (!S.themes[t.id]) S.themes[t.id] = { box:0, due:today(), seen:0, right:0, used:[], miss:{}, hist:[] };
  });
  refreshBadges();
  save();
  return r;
}

function resumeFusion(r){
  const bouts = [];
  if (r.jours)   bouts.push(r.jours + " jour" + (r.jours > 1 ? "s" : ""));
  if (r.montees) bouts.push(r.montees + " notion" + (r.montees > 1 ? "s" : "") + " plus avancée" + (r.montees > 1 ? "s" : ""));
  if (r.xp > 0)  bouts.push("+" + r.xp + " XP");
  return bouts.length ? "Progression reprise : " + bouts.join(", ") + "."
                      : "Progression déjà à jour — rien de neuf dans le fichier.";
}

const PROG_NOM = "ONZE_progression_" + (ELEVE || "eleve") + ".json";

const DEPOT_DB = "onze-depot", DEPOT_STORE = "h", DEPOT_KEY = "dossier";
let depot = { handle:null, etat:"absent", dernier:null };   // absent | ok | prompt | erreur

function depotDisponible(){
  return typeof window.showDirectoryPicker === "function";
}

/* le handle de dossier ne tient pas dans localStorage : il vit dans IndexedDB */
function idbOuvrir(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open(DEPOT_DB, 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore(DEPOT_STORE);
    rq.onsuccess = () => res(rq.result);
    rq.onerror   = () => rej(rq.error);
  });
}
function idbTx(mode, fn){
  return idbOuvrir().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DEPOT_STORE, mode);
    const rq = fn(tx.objectStore(DEPOT_STORE));
    rq.onsuccess = () => res(rq.result);
    rq.onerror   = () => rej(rq.error);
  }));
}
const idbGet = ()  => idbTx("readonly",  st => st.get(DEPOT_KEY));
const idbSet = (v) => idbTx("readwrite", st => st.put(v, DEPOT_KEY));
const idbDel = ()  => idbTx("readwrite", st => st.delete(DEPOT_KEY));

/* au démarrage : retrouver le dossier autorisé lors d'une session précédente.
   Chrome ne rend la permission persistante que si l'élève a choisi
   « Autoriser à chaque visite » ; sinon queryPermission répond « prompt » et il
   faudra un clic — d'où l'état affiché plutôt qu'un échec silencieux. */
function chargerDepot(){
  if (!depotDisponible()) return;
  idbGet().then(h => {
    if (!h) return;
    depot.handle = h;
    return h.queryPermission({ mode:"readwrite" }).then(p => {
      depot.etat = (p === "granted") ? "ok" : "prompt";
      if (depot.etat !== "ok") return;
      // lire d'abord : ce que cette machine ignore est peut-être dans le fichier
      return lireProgression().then(r => {
        if (r && (r.jours || r.montees)) toast(resumeFusion(r));
        return ecrireProgression().then(() => ecrireBilan(false));
      });
    });
  }).then(() => { if (view.screen === "home") render(); })
    .catch(() => { /* IndexedDB indisponible (file://, navigation privée) : tant pis */ });
}

function activerDepot(){
  if (!depotDisponible()) return;
  window.showDirectoryPicker({ id:"onze-bilan", mode:"readwrite" })
    .then(dir => dir.requestPermission({ mode:"readwrite" }).then(p => {
      if (p !== "granted"){ toast("Dossier non autorisé — le dépôt reste manuel."); return; }
      depot.handle = dir; depot.etat = "ok";
      idbSet(dir).catch(() => toast("Le dossier est actif, mais il faudra le redésigner à la prochaine ouverture."));
      return lireProgression()
        .then(r => { if (r && (r.jours || r.montees)) toast(resumeFusion(r)); })
        .then(() => ecrireProgression())
        .then(() => ecrireBilan(true));
    }))
    .then(() => render())
    .catch(err => { if (!err || err.name !== "AbortError") toast("Le dossier n'a pas pu être ouvert."); });
}

function arreterDepot(){
  depot = { handle:null, etat:"absent", dernier:null };
  idbDel().catch(() => {});
  toast("Dépôt automatique arrêté. Le bouton d'envoi reste disponible.");
  render();
}

/* Lit le carnet de progression du dossier et le fusionne. Absent = premier
   passage sur cette machine, ce n'est pas une erreur. */
function lireProgression(){
  if (!depot.handle) return Promise.resolve(null);
  return depot.handle.getFileHandle(PROG_NOM)
    .then(fh => fh.getFile())
    .then(f => f.text())
    .then(txt => {
      const autre = etatDepuis(JSON.parse(txt));
      if (!autre) return null;
      return appliquerFusion(autre);
    })
    .catch(() => null);           // fichier absent ou illisible : on continue
}

/* Réécrit le carnet — nom STABLE, toujours le même fichier, contrairement aux
   bilans datés qui servent au rapport des parents. */
function ecrireProgression(){
  if (!depot.handle) return Promise.resolve(false);
  const paquet = { app:"onze", type:"progression", format:1,
                   eleve: ELEVE || "", maj: today(), etat: S };
  return depot.handle.getFileHandle(PROG_NOM, { create:true })
    .then(fh => fh.createWritable())
    .then(w => w.write(JSON.stringify(paquet, null, 2)).then(() => w.close()))
    .then(() => true)
    .catch(() => false);
}

/* La reprise manuelle : le seul chemin qui marche PARTOUT — téléphone, Safari,
   fichier ouvert en file://. Un sélecteur de fichiers, et on fusionne. */
function importerProgression(file){
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    let autre = null;
    try { autre = etatDepuis(JSON.parse(String(fr.result))); }
    catch (e) { autre = null; }
    if (!autre){ toast("Ce fichier n'est pas un carnet ONZE."); return; }
    const r = appliquerFusion(autre);
    ecrireProgression();
    toast(resumeFusion(r));
    render();
  };
  fr.onerror = () => toast("Le fichier n'a pas pu être lu.");
  fr.readAsText(file);
}

/* écrit le bilan du jour dans le dossier désigné ; un fichier par jour, réécrit
   à chaque bloc pour rester à jour. Retourne une promesse — jamais rejetée. */
function ecrireBilan(annonce){
  if (!depot.handle) return Promise.resolve(false);
  return depot.handle.queryPermission({ mode:"readwrite" }).then(p => {
    if (p !== "granted"){ depot.etat = "prompt"; return false; }
    const data = bilan();
    const nom = "ONZE_bilan_" + (ELEVE || "eleve") + "_" + data.genere + ".json";
    return depot.handle.getFileHandle(nom, { create:true })
      .then(fh => fh.createWritable())
      .then(w => w.write(JSON.stringify(data, null, 2)).then(() => w.close()))
      .then(() => {
        depot.etat = "ok"; depot.dernier = data.genere;
        if (annonce) toast("Bilan déposé : « " + nom + " ».");
        return true;
      });
  }).catch(() => { depot.etat = "erreur"; return false; });
}

function depotHTML(){
  if (!depotDisponible()) return "";
  if (depot.etat === "ok")
    return `<span class="note">Bilan déposé tout seul${depot.dernier ? " · " + frDate(depot.dernier) : ""}</span>`
         + `<button class="link" id="depoff">arrêter le dépôt</button>`;
  if (depot.etat === "prompt")
    return `<button class="link" id="depon">Réautoriser le dépôt automatique</button>`;
  if (depot.etat === "erreur")
    return `<button class="link" id="depon">Le dépôt a échoué — redésigner le dossier</button>`;
  return `<button class="link" id="depon">Déposer mon bilan tout seul</button>`;
}

/* ---------- session ---------- */
let sess = null;

function startBlock(kind){
  const block = todaysPlan().find(b => b.kind === kind);
  if (!block) return;
  const items = blockItems(block);
  if (!items.length){ alert("Pas d'exercice disponible pour ce bloc."); return; }
  sess = {
    block, items, i:0, xp:0, right:0, total:0, combo:0, bestCombo:0,
    byTheme:{}, answered:false, correct:null, chosen:null, built:[],
    pl:null, pr:null, link:{}, sel:null,
    errs:[], itemLog:[],
    reprises:[], paliersVus:[], dernierRep:null, reprisesFaites:0,
    cts:0, vides:0, artic:null,
    phase:"quiz"
  };
  const first = THEME_BY_ID[block.themes[0]];
  if (block.kind === "lesson" || (block.kind === "revision" && first && S.themes[first.id].box <= 1)) sess.phase = "lesson";
  if (sess.phase === "lesson" && !lessonTheme()) sess.phase = "quiz";
  view = { screen:"session" };
  render();
}
function lessonTheme(){
  const id = sess.block.themes[0];
  const t = THEME_BY_ID[id];
  return (t && t.lesson) ? t : null;
}

function renderSession(){
  if (sess.phase === "lesson"){ root.innerHTML = lessonHTML(); bindLesson(); return; }
  if (sess.phase === "palier"){ root.innerHTML = palierHTML(); bindPalier(); return; }
  const it = sess.items[sess.i];
  // les mots à remettre dans l'ordre doivent être tirés AVANT le premier rendu
  if (it && it.f === "ord" && !sess.pool) sess.pool = shuffle(it.w);
  // idem pour les deux colonnes à relier : les mélanger séparément, sinon les
  // paires se retrouvent en face l'une de l'autre et l'exercice se résout à l'œil
  if (it && it.f === "pair" && !sess.pl){
    const idx = it.p.map((_, i) => i);
    sess.pl = shuffle(idx); sess.pr = shuffle(idx);
    sess.link = {}; sess.sel = null;
  }
  root.innerHTML = quizHTML(); bindQuiz();
}

function lessonHTML(){
  const t = lessonTheme();
  const st = S.themes[t.id];
  const isNew = st.box === 0;
  return `<div class="wrap">
    ${topHTML(0)}
    <div class="lesson">
      <div class="kicker">${isNew ? "Nouvelle notion" : "On révise d'abord"} · ${SUB[t.subject].label} · ${esc(TIER[t.tier] || t.tier)}${daysToTest(t) === null ? "" : ` · <b>⚡ ${esc(testLabel(t))}</b>`}</div>
      <h3 style="color:var(--${shortVar(t.subject)})">${esc(t.t)}</h3>
      ${t.lesson.why ? `<div class="why">${esc(t.lesson.why)}</div>` : ""}
      <ul class="pts">
        ${t.lesson.pts.map(p => `<li><span class="d"></span><span>${fmt(p)}</span></li>`).join("")}
      </ul>
      ${t.lesson.ex ? `<div class="exbox"><span class="lab">Exemple</span>${fmt(t.lesson.ex)}</div>` : ""}
    </div>
    <button class="cta" id="go">C'est compris → ${sess.items.length} questions</button>
  </div>`;
}
function bindLesson(){
  root.querySelector("#go").addEventListener("click", () => { sess.phase = "quiz"; render(); });
}

/* Le palier : une respiration toutes les huit questions.

   Un bloc de 24 questions d'affilée se regarde comme un mur. Découpé en trois
   paliers annoncés, c'est trois fois « plus que deux questions » — la même
   quantité de travail, mais une ligne d'arrivée toujours en vue. C'est le
   découpage (chunking) que toute la littérature TDAH place en premier, et il
   sert aussi à faire le point : ce qu'on vient de faire, ce qui reste. */
function palierHTML(){
  const n = sess.i;                                   // questions déjà posées
  const tot = sess.items.length;
  const num = Math.round(n / PALIER), sur = Math.ceil(tot / PALIER);
  const justes = sess.right, pct = sess.total ? Math.round(100*justes/sess.total) : 0;
  const mot = pct >= 80 ? "Ça tient." : pct >= 50 ? "On continue." : "On ralentit pas.";
  const reste = tot - n;
  return `<div class="wrap"><div class="done-wrap">
    <div class="kicker">Palier ${num} sur ${sur}</div>
    <h2 style="margin-top:6px">${esc(mot)}</h2>
    <div class="line">${justes}/${sess.total} depuis le début du bloc${
      sess.reprises.length ? ` · ${sess.reprises.length} mot${sess.reprises.length>1?"s":""} à revoir avant la fin` : ""}</div>
    <div class="gain" style="margin-top:18px">
      <div class="g"><div class="k">Fait</div><div class="v">${n}</div></div>
      <div class="g"><div class="k">Reste</div><div class="v" style="color:var(--accent)">${reste}</div></div>
      <div class="g"><div class="k">Combo</div><div class="v">×${sess.bestCombo}</div></div>
    </div>
    <button class="cta" id="go" style="margin-top:24px">Continuer → ${Math.min(PALIER, reste)} questions</button>
  </div></div>`;
}
function bindPalier(){
  root.querySelector("#go").addEventListener("click", () => {
    sess.phase = "quiz"; renderSession();
  });
}

function topHTML(frac){
  const c = sess.combo;
  return `<div class="s-top"><div class="s-top-in">
      <button class="quit" id="quit" aria-label="Quitter">✕</button>
      <span class="prog"><i style="width:${Math.round(frac*100)}%"></i></span>
      <span class="combo${c >= 3 ? " hot":""}">${c >= 2 ? "×"+c+" 🔥" : sess.total ? sess.right+"/"+sess.total : "&nbsp;"}</span>
    </div></div>`;
}

function quizHTML(){
  const it = sess.items[sess.i];
  const t  = THEME_BY_ID[it.theme];
  const sk = it.subject;
  const body =
    it.f === "qcm"  ? optsHTML(it) :
    it.f === "ord"  ? ordHTML(it)  :
    it.f === "pair" ? pairHTML(it) : inputHTML(it);

  return `<div class="wrap">
    ${topHTML(sess.i / sess.items.length)}
    <div class="q">
      <div class="meta">
        <span class="chip ${sk}">${SUB[sk].short}</span>
        <span class="th">${esc(t ? t.t : "")} · ${sess.i+1}/${sess.items.length}</span>
        ${it.retry ? `<span class="chip" style="background:var(--accent-soft);color:var(--accent)">revanche ⚡</span>` : ""}
        ${it.reprise ? `<span class="chip" style="background:var(--accent-soft);color:var(--accent)">on la refait ↻</span>` : ""}
      </div>
      <div class="txt">${fmt(it.q)}</div>
      ${it.hint && !sess.answered ? `<div class="hint">${esc(it.hint)}</div>` : ""}
      ${body}
      ${sess.answered ? fbHTML(it) : ""}
    </div>
    ${sess.answered ? `<button class="cta" id="next">${sess.i+1 >= sess.items.length ? "Voir le bilan" : "Suivant →"}</button>` : ""}
  </div>`;
}
function optsHTML(it){
  const keys = ["A","B","C","D","E"];
  return `<div class="opts">${it.o.map((o, i) => {
    let cls = "opt";
    if (sess.answered){
      if (eq(o, it.a, it)) cls += " good";
      else if (sess.chosen === i) cls += " bad";
    }
    return `<button class="${cls}" data-i="${i}" ${sess.answered ? "disabled":""}>
      <span class="key">${keys[i]}</span><span>${fmt(o)}</span></button>`;
  }).join("")}</div>`;
}
function inputHTML(it){
  const cls = sess.answered ? (sess.correct ? "inp good" : "inp bad") : "inp";
  const vide = !String(sess.typed || "").trim();
  return `<input class="${cls}" id="ans" value="${esc(sess.typed || "")}" ${sess.answered ? "disabled":""}
      placeholder="${it.f === "gap" ? "le mot qui manque" : "ta réponse"}" autocomplete="off"
      autocapitalize="off" spellcheck="false" inputmode="${it.num ? "text" : "text"}">
    ${sess.answered ? "" : `<button class="cta${vide ? " off" : ""}" id="chk">Vérifier</button>
    <div class="vide" id="vidmsg" hidden></div>`}`;
}
function ordHTML(it){
  const rest = sess.pool || [];
  const cls = sess.answered ? (sess.correct ? "slot good" : "slot bad") : "slot";
  return `<div class="${cls}" id="slot">
      ${sess.built.length ? sess.built.map((w, i) => `<button class="word" data-b="${i}" ${sess.answered ? "disabled":""}>${esc(w)}</button>`).join("")
        : `<span class="ph">Clique les mots dans le bon ordre</span>`}
    </div>
    <div class="words">${rest.map((w, i) => `<button class="word" data-w="${i}" ${sess.answered || w === null ? "disabled":""}>${esc(w === null ? "·" : w)}</button>`).join("")}</div>
    ${sess.answered ? "" : `<button class="cta" id="chk" ${sess.built.length ? "" : "disabled"}>Vérifier</button>`}`;
}
/* Relier : les paires sont appariées par leur indice — la case i de gauche va
   avec la case i de droite. On numérote les liens dans l'ordre où ils sont faits,
   ce qui donne à l'élève un repère visuel sans qu'on ait à tracer quoi que ce soit. */
function pairHTML(it){
  const num = {};                                   // indice de gauche → n° du lien
  let k = 0;
  (sess.pl || []).forEach(i => { if (sess.link[i] != null) num[i] = ++k; });
  const droite = {};                                // indice de droite → le même n°
  Object.keys(num).forEach(i => { droite[sess.link[i]] = num[i]; });

  const tuile = (cote, i, texte) => {
    const badge = cote === "l" ? num[i] : droite[i];
    let cls = "pw";
    if (badge) cls += " lie";
    if (cote === "l" && sess.sel === i) cls += " sel";
    // après correction, une tuile est juste si le lien i ↔ i a bien été fait
    if (sess.answered) cls += (sess.link[i] === i) ? " good" : " bad";
    return `<button class="${cls}" data-p="${cote}${i}" ${sess.answered ? "disabled" : ""}>`
      + (badge ? `<span class="pn">${badge}</span>` : "")
      + `<span>${esc(texte)}</span></button>`;
  };

  const tous = Object.keys(sess.link).length === it.p.length;
  return `<div class="pairs">
      <div class="pcol">${(sess.pl || []).map(i => tuile("l", i, it.p[i][0])).join("")}</div>
      <div class="pcol">${(sess.pr || []).map(i => tuile("r", i, it.p[i][1])).join("")}</div>
    </div>
    ${sess.answered ? "" : `<button class="cta" id="chk" ${tous ? "" : "disabled"}>Vérifier</button>`}`;
}

function fbHTML(it){
  const good = sess.correct;
  return `<div class="fb ${good ? "ok":"ko"}">
    <div class="hd">${good ? "Juste" + (sess.combo >= 3 ? " · combo ×"+sess.combo : "")
                           : sess.accent ? "Presque — l'accent"
                           : sess.artic ? "Presque — l'article" : "Pas encore"}</div>
    ${sess.accent ? `<div class="exp">Le mot était bon, l'accent non : c'est compté faux, comme au test.</div>` : ""}
    ${sess.artic ? `<div class="exp">${esc(sess.artic)}</div>` : ""}
    ${good ? "" : `<div class="sol">${it.f === "pair"
        ? it.p.map(pr => esc(pr[0]) + " = " + esc(pr[1])).join("<br>")
        : fmt(Array.isArray(it.a) ? it.a[0] : it.a)}</div>`}
    ${it.e ? `<div class="exp">${fmt(it.e)}</div>` : ""}
  </div>`;
}

function bindQuiz(){
  const it = sess.items[sess.i];
  root.querySelector("#quit").addEventListener("click", quitSession);

  if (!sess.answered){
    if (it.f === "qcm"){
      root.querySelectorAll(".opt").forEach(el => el.addEventListener("click", () => {
        const i = Number(el.dataset.i);
        sess.chosen = i;
        grade(eq(it.o[i], it.a, it));
      }));
    } else if (it.f === "ord"){
      root.querySelectorAll("[data-w]").forEach(el => el.addEventListener("click", () => {
        const i = Number(el.dataset.w);
        if (sess.pool[i] == null) return;
        sess.built.push(sess.pool[i]); sess.pool[i] = null; renderSession();
      }));
      root.querySelectorAll("[data-b]").forEach(el => el.addEventListener("click", () => {
        const i = Number(el.dataset.b);
        const w = sess.built.splice(i, 1)[0];
        const slot = sess.pool.indexOf(null);
        if (slot >= 0) sess.pool[slot] = w; else sess.pool.push(w);
        renderSession();
      }));
      const chk = root.querySelector("#chk");
      if (chk) chk.addEventListener("click", () => grade(norm(sess.built.join(" ")) === norm(it.a)));
    } else if (it.f === "pair"){
      root.querySelectorAll("[data-p]").forEach(el => el.addEventListener("click", () => {
        const d = el.dataset.p, cote = d[0], i = Number(d.slice(1));
        if (cote === "l"){
          // une tuile déjà liée se délie ; sinon elle se sélectionne
          if (sess.link[i] != null){ delete sess.link[i]; sess.sel = null; }
          else sess.sel = (sess.sel === i ? null : i);
        } else {
          const pris = Object.keys(sess.link).filter(g => sess.link[g] === i)[0];
          if (pris != null){ delete sess.link[pris]; sess.sel = null; }
          else if (sess.sel != null){ sess.link[sess.sel] = i; sess.sel = null; }
        }
        renderSession();
      }));
      const chk = root.querySelector("#chk");
      if (chk) chk.addEventListener("click", () => {
        grade(it.p.every((_, i) => sess.link[i] === i));
      });
    } else {
      /* UN CHAMP VIDE NE SE VALIDE PAS (25 août 2026).

         Le 23 août, 29 réponses vides ont été validées d'affilée : les QCM du
         même bloc étaient cliqués et justes, mais plus rien n'était tapé. Une
         case vide n'est pas une faute de français ou de maths — c'est une
         mesure qui n'a pas eu lieu, et elle a fait tomber « Nombres relatifs »
         à 40 % de maîtrise alors que le lendemain il faisait 8/8.

         Le bouton reste CLIQUABLE, seulement éteint : un bouton désactivé ne
         dit pas pourquoi il ne marche pas. Au 3e essai à vide on nomme la cause
         la plus probable — le clavier du téléphone qui ne s'ouvre pas. */
      const inp = root.querySelector("#ans");
      const chk = root.querySelector("#chk");
      const msg = root.querySelector("#vidmsg");
      const check = () => {
        const v = inp.value;
        if (!v.trim()){
          sess.vides = (sess.vides || 0) + 1;
          msg.hidden = false;
          msg.textContent = sess.vides < 3
            ? "Écris ta réponse — même fausse. Une case vide ne compte pas comme un essai."
            : "Le clavier ne s'ouvre pas ? Touche le cadre blanc au-dessus. "
              + "Sinon, quitte le bloc — mieux vaut le refaire que le remplir à blanc.";
          try{ inp.focus({ preventScroll:true }); }catch(e){}
          return;
        }
        sess.typed = v;
        const answers = [it.a].concat(it.alt || []);
        grade(answers.some(a => eq(a, v, it)));
      };
      inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
      inp.addEventListener("input", () => {
        sess.typed = inp.value;
        chk.classList.toggle("off", !inp.value.trim());
        if (inp.value.trim()) msg.hidden = true;
      });
      chk.addEventListener("click", check);
      setTimeout(() => { try{ inp.focus({ preventScroll:true }); }catch(e){} }, 60);
    }
  } else {
    root.querySelector("#next").addEventListener("click", nextItem);
  }
}

function grade(ok){
  const it = sess.items[sess.i];
  sess.answered = true; sess.correct = ok;
  // un accent oublié : faux, mais on nomme la raison
  const repondu = it.f === "qcm" ? (sess.chosen != null ? it.o[sess.chosen] : "")
                : (it.f === "ord" || it.f === "pair") ? ""
                : (sess.typed || "");
  sess.accent = !ok && accentPres(repondu, it);
  sess.artic  = (!ok && !sess.accent) ? articlePres(repondu, it) : null;
  sess.total++;
  const bt = sess.byTheme[it.theme]
    || (sess.byTheme[it.theme] = { right:0, total:0, pRight:0, pTotal:0 });
  bt.total++;
  // La MESURE ne compte que les premières tentatives (`p` = premier passage).
  // Une reprise réussie est un entraînement, pas une preuve : si elle comptait,
  // rater un mot puis le réussir deux fois de suite ferait MONTER le taux de
  // réussite de la notion, et une notion mal sue passerait tranquillement en
  // boîte supérieure. Les XP, eux, sont donnés dans les deux cas.
  if (!it.reprise){
    bt.pTotal++; if (ok) bt.pRight++;
    // le porte-monnaie suit la MESURE, pas l'effort : une reprise n'est pas
    // payée, sinon rater exprès deviendrait rentable. Les XP, eux, le sont.
    const grand = sess.block.kind === "bonus";
    sess.cts += ok ? (grand ? CTS_BONUS_JUSTE : CTS_JUSTE)
                   : (grand ? CTS_BONUS_ESSAI : CTS_ESSAI);
  }
  // journal : ce qui a été répondu, pour la revanche et le bilan
  sess.itemLog.push({ id: it.theme, k: it.gen ? null : it.bankIdx, ok, rep: it.reprise ? 1 : 0 });
  if (!ok){
    const donne = it.f === "qcm" ? (sess.chosen != null ? it.o[sess.chosen] : "")
                : it.f === "ord" ? sess.built.join(" ")
                : it.f === "pair" ? it.p
                    .map((pr, i) => sess.link[i] === i ? null
                          : pr[0] + " → " + (sess.link[i] != null ? it.p[sess.link[i]][1] : "?"))
                    .filter(Boolean).join(" ; ")
                : (sess.typed || "");
    sess.errs.push({
      d: today(), id: it.theme, f: it.f,
      q: String(it.q || "").slice(0, 90),
      a: String(Array.isArray(it.a) ? it.a[0] : it.a).slice(0, 60),
      r: String(donne).slice(0, 60),
      k: it.gen ? null : it.bankIdx, g: it.gen ? 1 : 0
    });
  }
  // la file de reprise : rater programme un retour, réussir rapproche du rachat
  if (!ok){
    planifierReprise(Object.assign({}, it, { hits:0 }), REPRISE_1);
  } else if (it.reprise){
    const hits = (it.hits || 0) + 1;
    if (hits < 2) planifierReprise(Object.assign({}, it, { hits }), REPRISE_2);
  }

  if (ok){
    sess.right++; bt.right++;
    sess.combo++; sess.bestCombo = Math.max(sess.bestCombo, sess.combo);
    let gain = XP_RIGHT + (sess.combo >= 3 ? XP_COMBO : 0);
    if (sess.block.kind === "defi") gain = Math.round(gain * 1.5);
    sess.xp += gain;
    flyXP(gain);
  } else {
    sess.combo = 0;
  }
  markUsed(it);
  renderSession();
}
function flyXP(n){
  const el = document.createElement("div");
  el.className = "xpfly"; el.textContent = "+" + n + " XP";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
/* Un mot raté doit revenir DANS le bloc, pas seulement demain.

   Il revient trois questions plus loin, puis huit plus loin s'il est retombé —
   c'est le rappel expansé : on rallonge l'intervalle à mesure que ça tient. Il
   faut deux réussites pour qu'il sorte de la file.

   La reprise PREND LA PLACE d'une question à venir, elle ne s'ajoute pas : le
   bloc fait 24 questions, toujours, et le compteur ne ment pas. Rien n'est
   perdu — les générateurs ont une réserve infinie, la question déplacée n'est
   pas une question qu'on ne verra jamais. */
function planifierReprise(it, delai){
  if (sess.reprises.length >= REPRISE_FILE) return;
  const vues = (it.reprise || 0);
  if (vues >= REPRISE_MAX) return;          // un seul mot ne prend pas tout le bloc
  const copie = Object.assign({}, it, {
    reprise: vues + 1,
    hits: it.hits || 0,
    retry: false
  });
  delete copie.done;
  sess.reprises.push({ item: copie, du: sess.i + delai });
}
function prendreReprise(pos){
  if (!sess.reprises.length) return null;
  // Une reprise toutes les REPRISE_ECART questions au plus, et jamais plus d'un
  // quart du bloc en tout. Sans ces plafonds, une séance qui commence mal
  // dégénère : la file reste pleine, chaque créneau est repris, et le bloc se
  // réduit à quatre mots ressassés — mesuré sur un parcours à 0 % de réussite.
  // Le mot raté doit revenir ; il ne doit ni tout manger, ni donner
  // l'impression qu'on tourne en rond (« moins de répétitions », 25 août 2026).
  if ((sess.reprisesFaites || 0) >= Math.floor(sess.items.length / REPRISE_PART)) return null;
  if (sess.dernierRep != null && pos - sess.dernierRep < REPRISE_ECART) return null;
  // en fin de bloc, on place ce qui reste même si l'échéance n'est pas atteinte :
  // une reprise jamais rejouée n'aurait servi à rien.
  const fin = pos >= sess.items.length - sess.reprises.length;
  let k = -1;
  sess.reprises.forEach((r, i) => {
    if ((fin || r.du <= pos) && (k < 0 || r.du < sess.reprises[k].du)) k = i;
  });
  if (k < 0) return null;
  sess.dernierRep = pos;
  sess.reprisesFaites = (sess.reprisesFaites || 0) + 1;
  return sess.reprises.splice(k, 1)[0].item;
}

function nextItem(){
  if (sess.i + 1 >= sess.items.length){ finish(); return; }
  // une reprise due prend la place de la question suivante
  const rep = prendreReprise(sess.i + 1);
  if (rep) sess.items[sess.i + 1] = rep;
  // palier : une respiration toutes les PALIER questions, pour que la ligne
  // d'arrivée reste visible même dans un bloc long
  const franchi = sess.i + 1;
  if (franchi % PALIER === 0 && franchi < sess.items.length
      && !sess.paliersVus.includes(franchi)){
    sess.paliersVus.push(franchi);
    sess.phase = "palier";
    sess.i++;
    sess.answered = false; sess.correct = null; sess.chosen = null; sess.accent = false; sess.artic = null;
    sess.typed = ""; sess.built = []; sess.pool = null;
    sess.pl = null; sess.pr = null; sess.link = {}; sess.sel = null;
    render();
    return;
  }
  sess.i++; sess.answered = false; sess.correct = null; sess.chosen = null;
  sess.accent = false; sess.artic = null;
  sess.typed = ""; sess.built = []; sess.pool = null;
  sess.pl = null; sess.pr = null; sess.link = {}; sess.sel = null;
  renderSession();
}
function quitSession(){
  if (!sess.total){ sess = null; view = { screen:"home" }; render(); return; }
  demander("Quitter le bloc ?",
    "Les " + sess.total + " questions déjà faites ne compteront pas, et le bloc ne "
    + "rapportera rien. Tu pourras le reprendre depuis le début.",
    "Quitter quand même",
    () => { sess = null; view = { screen:"home" }; render(); });
}
function finish(){
  const out = recordBlock(sess.block, { xp:sess.xp, right:sess.right, total:sess.total, byTheme:sess.byTheme,
    errs:sess.errs, itemLog:sess.itemLog, cts:sess.cts });
  view = { screen:"done", res:{
    kind: sess.block.kind, title: sess.block.title,
    right: sess.right, total: sess.total, xp: sess.xp, bonus: out.bonus,
    cts: (sess.cts || 0) + (sess.block.kind === "bonus" ? CTS_BONUS_BLOC : CTS_BLOC),
    ctsBloc: sess.block.kind === "bonus" ? CTS_BONUS_BLOC : CTS_BLOC,
    bestCombo: sess.bestCombo, moves: out.moves, newBadges: out.newBadges, dayComplete: out.dayComplete
  }};
  sess = null; render();
}

/* ---------- bilan ---------- */
function doneHTML(){
  const r = view.res;
  const pct = r.total ? Math.round(100 * r.right / r.total) : 0;
  const R = 58, C = 2 * Math.PI * R;
  const col = pct >= 80 ? "var(--ok)" : pct >= 50 ? "var(--accent)" : "var(--ko)";
  const word = pct >= 90 ? "Impeccable" : pct >= 75 ? "Solide" : pct >= 50 ? "Ça avance" : "On y retourne";
  const left = 3 - blocsOrdinaires(S.days[today()]);

  return `<div class="wrap"><div class="done-wrap">
    <div class="ring">
      <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
        <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--panel-2)" stroke-width="9"></circle>
        <circle cx="66" cy="66" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct/100)}"></circle>
      </svg>
      <div class="mid"><span class="pc" style="color:${col}">${pct}%</span><span class="of">${r.right}/${r.total}</span></div>
    </div>
    <h2>${esc(word)}</h2>
    <div class="line">${esc(r.title)} terminé${r.dayComplete ? " — et la journée est complète 🏁" : left > 0 ? " · encore "+left+" bloc"+(left>1?"s":"")+" aujourd'hui" : ""}</div>
    <div class="gain">
      <div class="g"><div class="k">XP gagnés</div><div class="v" style="color:var(--accent)">+${r.xp + r.bonus}</div></div>
      <div class="g"><div class="k">Gagné</div><div class="v" style="color:var(--ok)">${chf(r.cts || 0)}</div></div>
      <div class="g"><div class="k">Meilleur combo</div><div class="v">×${r.bestCombo}</div></div>
      <div class="g"><div class="k">Série</div><div class="v">${S.streak} j</div></div>
    </div>
    <div class="line" style="font-size:12.5px;color:var(--ink-3)">
      dont ${r.ctsBloc} ct parce que tu es allé au bout du bloc ·
      à toucher en tout : <b>${chf(aVerser())} CHF</b>
    </div>
    ${r.moves.length ? `<div class="moves">${r.moves.map(m => {
      const t = THEME_BY_ID[m.id];
      const up = m.to > m.from;
      return `<div class="move">
        <span class="chip ${t.subject}">${SUB[t.subject].short}</span>
        <span style="flex:1">${esc(t.t)}</span>
        <span class="ar">${m.from === 0 ? "neuf" : "boîte "+m.from} → <span class="${up ? "up":"dn"}">${m.to === 5 ? "acquis ✓" : "boîte "+m.to}</span></span>
      </div>`;
    }).join("")}</div>` : ""}
    ${r.newBadges.length ? `<div class="gain" style="margin-top:14px">${r.newBadges.map(id => {
      const b = BADGES.find(x => x.id === id);
      return `<div class="g" style="background:var(--accent-soft)"><div class="k">Nouveau trophée</div><div class="v" style="font-size:14px;color:var(--accent)">${b.em} ${esc(b.t)}</div></div>`;
    }).join("")}</div>` : ""}
    <button class="cta" id="back" style="margin-top:24px">Retour au tableau</button>
    ${left > 0 ? `<button class="cta ghost" id="more" style="margin-top:10px">Enchaîner le bloc suivant →</button>` : ""}
  </div></div>`;
}
function bindDone(){
  root.querySelector("#back").addEventListener("click", () => { view = { screen:"home" }; render(); });
  const more = root.querySelector("#more");
  if (more) more.addEventListener("click", () => {
    const nxt = todaysPlan().find(b => !b.done);
    if (nxt) startBlock(nxt.kind); else { view = { screen:"home" }; render(); }
  });
}

/* ---------- démarrage ---------- */
try{
  try{ const saved = localStorage.getItem("onze-theme"); if (saved) setTheme(saved); }catch(e){}
  load();
  refreshBadges(); save();
  render();
  chargerDepot();          // asynchrone : réaffiche l'accueil quand le dossier est retrouvé
} catch(err){
  // plutôt qu'une page blanche : dire ce qui s'est passé, et laisser une porte de sortie
  root.innerHTML = '<div class="wrap" style="padding-top:40px">'
    + '<h1 style="font-family:var(--display); text-transform:uppercase; letter-spacing:.06em; font-size:22px; margin:0 0 10px">ONZE n\'a pas pu démarrer</h1>'
    + '<p style="font-size:14px; color:var(--ink-2); line-height:1.5">Recharge la page. Si le message revient, transmets cette ligne :</p>'
    + '<pre class="exbox" style="white-space:pre-wrap; font-family:var(--mono); font-size:12px">'
    + String((err && err.message) || err) + '</pre>'
    + '<button class="cta" id="wipe">Repartir d\'un carnet vide</button></div>';
  const w = root.querySelector("#wipe");
  if (w) w.addEventListener("click", () => {
    try{ localStorage.removeItem(KEY); }catch(e){}
    location.reload();
  });
}
})();
</script>

</body>
</html>
