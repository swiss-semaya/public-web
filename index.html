<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ONZE">
<meta name="theme-color" content="#EFF2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151B" media="(prefers-color-scheme: dark)">
<meta name="description" content="ONZE — entraînement quotidien : français, allemand, anglais, maths.">
</head>
<body>
<title>ONZE — cap sur la 11e</title>

<style>
/* ============================================================
   ONZE — tableau d'entraînement scolaire (10VG → 11VG)
   Tokens d'abord : thème clair par défaut, sombre redéfini
   ============================================================ */
:root{
  color-scheme: light dark;

  --bg:#EFF2F6;
  --panel:#FFFFFF;
  --panel-2:#E7ECF2;
  --line:#D5DDE6;
  --line-soft:#E4EAF1;
  --ink:#141D26;
  --ink-2:#495A6B;
  --ink-3:#7A8B9C;

  --accent:#D65B15;
  --accent-2:#B44A0F;
  --accent-ink:#FFFFFF;
  --accent-soft:#FAE5D7;

  --ok:#1B7F58;
  --ok-soft:#DBF0E5;
  --ko:#B8352A;
  --ko-soft:#F8E3E0;

  --fr:#AE3B66;   --fr-soft:#F7E2EB;
  --de:#96690F;   --de-soft:#F6E9CE;
  --en:#2A6389;   --en-soft:#DFEAF3;
  --ma:#1A7D61;   --ma-soft:#D9EFE7;
  --mix:#5F49AB;  --mix-soft:#E6E1F6;

  --shadow: 0 1px 2px rgba(20,29,38,.06), 0 8px 24px rgba(20,29,38,.06);
  --shadow-lift: 0 2px 4px rgba(20,29,38,.08), 0 14px 34px rgba(20,29,38,.12);

  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:26px;

  --display:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Helvetica,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F151B;
    --panel:#18212A;
    --panel-2:#212C36;
    --line:#2A3742;
    --line-soft:#222D37;
    --ink:#E7EEF4;
    --ink-2:#A8B8C6;
    --ink-3:#7A8B9A;

    --accent:#FF8A3D;
    --accent-2:#FFA469;
    --accent-ink:#20140B;
    --accent-soft:#3A2415;

    --ok:#4FC98F;
    --ok-soft:#173327;
    --ko:#F0705F;
    --ko-soft:#3A1F1C;

    --fr:#EE7EA3;  --fr-soft:#3A1F2B;
    --de:#E0B14C;  --de-soft:#33280F;
    --en:#6FB1DC;  --en-soft:#152A38;
    --ma:#4FCBA4;  --ma-soft:#123026;
    --mix:#A796EC; --mix-soft:#252047;

    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.34);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.45), 0 18px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --panel:#18212A; --panel-2:#212C36; --line:#2A3742; --line-soft:#222D37;
  --ink:#E7EEF4; --ink-2:#A8B8C6; --ink-3:#7A8B9A;
  --accent:#FF8A3D; --accent-2:#FFA469; --accent-ink:#20140B; --accent-soft:#3A2415;
  --ok:#4FC98F; --ok-soft:#173327; --ko:#F0705F; --ko-soft:#3A1F1C;
  --fr:#EE7EA3; --fr-soft:#3A1F2B; --de:#E0B14C; --de-soft:#33280F;
  --en:#6FB1DC; --en-soft:#152A38; --ma:#4FCBA4; --ma-soft:#123026;
  --mix:#A796EC; --mix-soft:#252047;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.34);
  --shadow-lift: 0 2px 6px rgba(0,0,0,.45), 0 18px 40px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#EFF2F6; --panel:#FFFFFF; --panel-2:#E7ECF2; --line:#D5DDE6; --line-soft:#E4EAF1;
  --ink:#141D26; --ink-2:#495A6B; --ink-3:#7A8B9C;
  --accent:#D65B15; --accent-2:#B44A0F; --accent-ink:#FFFFFF; --accent-soft:#FAE5D7;
  --ok:#1B7F58; --ok-soft:#DBF0E5; --ko:#B8352A; --ko-soft:#F8E3E0;
  --fr:#AE3B66; --fr-soft:#F7E2EB; --de:#96690F; --de-soft:#F6E9CE;
  --en:#2A6389; --en-soft:#DFEAF3; --ma:#1A7D61; --ma-soft:#D9EFE7;
  --mix:#5F49AB; --mix-soft:#E6E1F6;
  --shadow: 0 1px 2px rgba(20,29,38,.06), 0 8px 24px rgba(20,29,38,.06);
  --shadow-lift: 0 2px 4px rgba(20,29,38,.08), 0 14px 34px rgba(20,29,38,.12);
}

*{box-sizing:border-box;}
body{margin:0;}
#onze{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  min-height:100vh; -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px; margin:0 auto; padding:0 16px 56px;}

/* ---------- Bandeau-score ---------- */
.board{
  background:var(--panel); border-bottom:1px solid var(--line);
  padding:18px 0 0;
}
.board-in{max-width:560px; margin:0 auto; padding:0 16px 16px;}
.brand{display:flex; align-items:baseline; justify-content:space-between; gap:12px;}
.brand h1{
  font-family:var(--display); font-size:30px; letter-spacing:.10em; text-transform:uppercase;
  margin:0; font-weight:700; line-height:1;
}
.brand h1 span{color:var(--accent);}
.brand .tag{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.12em;
  font-size:11px; color:var(--ink-3);
}
.brand .tag sup{text-transform:lowercase; font-size:.7em;}
.theme-btn{
  background:transparent; border:1px solid var(--line); color:var(--ink-2);
  border-radius:999px; width:32px; height:32px; font-size:14px; cursor:pointer; line-height:1;
}
.theme-btn:hover{border-color:var(--ink-3);}

.scores{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px;}
.score{
  background:var(--panel-2); border-radius:var(--r-m); padding:10px 12px;
  display:flex; flex-direction:column; gap:2px;
}
.score .k{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.1em;
  font-size:10px; color:var(--ink-3);
}
.score .v{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:22px; font-weight:600; line-height:1.1;
}
.score.hot .v{color:var(--accent);}

.weekbar{margin-top:14px;}
.weekbar .lab{
  display:flex; justify-content:space-between; align-items:baseline;
  font-family:var(--display); text-transform:uppercase; letter-spacing:.1em;
  font-size:10px; color:var(--ink-3); margin-bottom:6px;
}
.weekbar .lab span{white-space:nowrap;}
.meter{height:6px; background:var(--panel-2); border-radius:999px; overflow:hidden;}
.meter i{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .5s cubic-bezier(.2,.8,.2,1);}

/* ---------- Sections ---------- */
.sec{margin-top:26px;}
.sec-h{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px;
}
.sec-h h2{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.12em;
  font-size:12px; color:var(--ink-2); margin:0; font-weight:700;
}
.sec-h .note{font-size:11px; color:var(--ink-3); font-family:var(--mono);}

/* ---------- Blocs du jour ---------- */
.blocks{display:flex; flex-direction:column; gap:10px;}
.block{
  width:100%; text-align:left; cursor:pointer;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-l);
  padding:14px 16px 14px 14px; box-shadow:var(--shadow);
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px;
  color:inherit; font:inherit;
  transition:transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s ease, border-color .16s ease;
}
.block:hover:not(:disabled){transform:translateY(-2px); box-shadow:var(--shadow-lift); border-color:var(--ink-3);}
.block:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
.block:disabled{cursor:default; opacity:.72;}
.block .num{
  font-family:var(--display); font-size:26px; line-height:1; color:var(--ink-3);
  font-variant-numeric:tabular-nums; width:26px; text-align:center;
}
.block .ttl{display:block; font-family:var(--display); text-transform:uppercase; letter-spacing:.06em; font-size:17px; font-weight:700; line-height:1.15;}
.block .sub{display:block; font-size:12.5px; color:var(--ink-2); margin-top:4px; line-height:1.4;}
.block .go{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:11px;
  background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:7px 12px; white-space:nowrap;
}
.block.done .go{background:var(--ok-soft); color:var(--ok);}
.block .mid{min-width:0; overflow:hidden;}
.block .chips{display:flex; gap:4px; flex-wrap:wrap; margin-top:7px; max-width:100%;}

.chip{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.07em;
  font-size:10px; font-weight:700; padding:3px 7px; border-radius:5px; white-space:nowrap;
  display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; vertical-align:middle;
}
.chip.francais{background:var(--fr-soft); color:var(--fr);}
.chip.allemand{background:var(--de-soft); color:var(--de);}
.chip.anglais{background:var(--en-soft); color:var(--en);}
.chip.maths{background:var(--ma-soft); color:var(--ma);}
.chip.mix{background:var(--mix-soft); color:var(--mix);}

/* ---------- Maîtrise ---------- */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r-l);
  padding:14px 16px; box-shadow:var(--shadow);
}
.mrow{display:grid; grid-template-columns:74px 1fr 78px; align-items:center; gap:10px; padding:9px 0;}
.mrow + .mrow{border-top:1px solid var(--line-soft);}
.mrow .nm{font-family:var(--display); text-transform:uppercase; letter-spacing:.07em; font-size:13px; font-weight:700;}
.mrow .bar{height:8px; background:var(--panel-2); border-radius:999px; overflow:hidden;}
.mrow .bar i{display:block; height:100%; border-radius:999px; transition:width .6s cubic-bezier(.2,.8,.2,1);}
.mrow .val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-2); text-align:right;}
.mrow .val b{color:var(--ink); font-weight:600;}

.boxes{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:12px;}
.boxcell{background:var(--panel-2); border-radius:var(--r-s); padding:8px 4px; text-align:center;}
.boxcell .n{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:16px; font-weight:600;}
.boxcell .l{font-family:var(--display); text-transform:uppercase; letter-spacing:.06em; font-size:9px; color:var(--ink-3); margin-top:2px;}
.boxcell.b5 .n{color:var(--ok);}

.weak{display:flex; flex-direction:column; gap:8px;}
.weak-row{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px;}
.weak-row .t{display:flex; align-items:center; gap:8px; min-width:0;}
.weak-row .t span.nmm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.weak-row .pc{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-3); white-space:nowrap; flex:0 0 auto;}
.weak-row .chip{flex:0 0 auto; max-width:none;}
.empty{font-size:13px; color:var(--ink-3); line-height:1.5;}

/* ---------- Calendrier ---------- */
.cal-head{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:6px;}
.cal-head div{
  text-align:center; font-family:var(--display); text-transform:uppercase;
  letter-spacing:.08em; font-size:9.5px; color:var(--ink-3);
}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.cd{
  aspect-ratio:1; border-radius:var(--r-s); background:var(--panel-2);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11px; color:var(--ink-3);
  position:relative;
}
.cd.void{background:transparent;}
.cd.future{opacity:.5;}
.cd.today{box-shadow:inset 0 0 0 2px var(--accent); color:var(--ink);}
.cd.full{background:var(--accent); color:var(--accent-ink);}
.cd.full .pips i{background:var(--accent-ink); opacity:.9;}
.cd .pips{display:flex; gap:2.5px; height:4px;}
.cd .pips i{width:4px; height:4px; border-radius:50%; background:var(--ink-3);}
.cd .school{position:absolute; inset:0; border-radius:var(--r-s); box-shadow:inset 0 0 0 1.5px var(--ink-3);}

.badges{display:flex; flex-wrap:wrap; gap:7px;}
.badge{
  display:flex; align-items:center; gap:6px; font-size:12px;
  background:var(--panel-2); border-radius:999px; padding:6px 11px; color:var(--ink-2);
}
.badge.on{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.badge.on .em{filter:none;}
.badge .em{filter:grayscale(1) opacity(.5);}

.foot{margin-top:30px; display:flex; justify-content:center; gap:18px;}
.link{
  background:none; border:none; color:var(--ink-3); font-size:11.5px; cursor:pointer;
  text-decoration:underline; text-underline-offset:3px; font-family:var(--body);
}
.link:hover{color:var(--ink-2);}

/* ---------- Session ---------- */
.s-top{
  position:sticky; top:0; z-index:5; background:var(--bg);
  padding:12px 0 10px; border-bottom:1px solid var(--line-soft);
}
.s-top-in{display:flex; align-items:center; gap:12px;}
.quit{
  background:transparent; border:1px solid var(--line); color:var(--ink-2); cursor:pointer;
  width:30px; height:30px; border-radius:999px; font-size:15px; line-height:1; flex:0 0 auto;
}
.quit:hover{border-color:var(--ko); color:var(--ko);}
.prog{flex:1; height:6px; background:var(--panel-2); border-radius:999px; overflow:hidden;}
.prog i{display:block; height:100%; background:var(--accent); transition:width .35s cubic-bezier(.2,.8,.2,1);}
.combo{
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-3);
  min-width:52px; text-align:right;
}
.combo.hot{color:var(--accent); font-weight:600;}

.lesson{margin-top:18px;}
.lesson .kicker{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.14em;
  font-size:10px; color:var(--ink-3); margin-bottom:8px;
}
.lesson h3{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.04em;
  font-size:24px; margin:0 0 4px; font-weight:700; text-wrap:balance; line-height:1.1;
}
.lesson .why{font-size:13px; color:var(--ink-2); margin-bottom:14px;}
.pts{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px;}
.pts li{display:grid; grid-template-columns:auto 1fr; gap:10px; font-size:14.5px; line-height:1.5;}
.pts li .d{
  width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:8px;
}
.exbox{
  margin-top:14px; background:var(--panel-2); border-radius:var(--r-m); padding:12px 14px;
  font-size:13.5px; line-height:1.55; color:var(--ink-2);
}
.exbox b{color:var(--ink);}
.lesson em, .exbox em{color:var(--accent); font-style:normal; font-weight:600;}
.exbox .lab{
  display:block; font-family:var(--display); text-transform:uppercase; letter-spacing:.12em;
  font-size:9.5px; color:var(--ink-3); margin-bottom:5px;
}
.cta{
  width:100%; margin-top:18px; background:var(--accent); color:var(--accent-ink);
  border:none; border-radius:var(--r-m); padding:15px 18px; cursor:pointer;
  font-family:var(--display); text-transform:uppercase; letter-spacing:.1em; font-size:15px; font-weight:700;
  transition:transform .1s ease, background .2s ease;
}
.cta:hover{background:var(--accent-2);}
.cta:active{transform:scale(.985);}
.cta:disabled{opacity:.38; cursor:default;}
.cta:disabled:hover{background:var(--accent);}
.cta.ghost{background:transparent; color:var(--ink-2); border:1px solid var(--line);}
.cta.ghost:hover{background:var(--panel-2); color:var(--ink);}
.cta-row{display:flex; gap:10px; margin-top:14px;}
.cta-row .cta{margin-top:0;}

.q{margin-top:18px;}
.q .meta{display:flex; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.q .meta .th{font-size:11.5px; color:var(--ink-3); font-family:var(--mono);}
.q .txt{
  font-size:20px; line-height:1.45; font-weight:500; text-wrap:pretty; margin-bottom:18px;
}
.q .txt em{color:var(--accent); font-style:normal; font-weight:600;}
.q .hint{font-size:12.5px; color:var(--ink-3); margin:-10px 0 16px;}

.opts{display:flex; flex-direction:column; gap:8px;}
.opt{
  text-align:left; background:var(--panel); border:1px solid var(--line); color:var(--ink);
  border-radius:var(--r-m); padding:13px 15px; font-size:15.5px; cursor:pointer; font-family:var(--body);
  display:flex; align-items:center; gap:10px;
  transition:border-color .15s ease, background .15s ease, transform .1s ease;
}
.opt:hover:not(:disabled){border-color:var(--ink-3); background:var(--panel-2);}
.opt:active:not(:disabled){transform:scale(.99);}
.opt:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.opt .key{
  font-family:var(--mono); font-size:11px; color:var(--ink-3); border:1px solid var(--line);
  border-radius:5px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
}
.opt:disabled{cursor:default;}
.opt.good{background:var(--ok-soft); border-color:var(--ok); color:var(--ok);}
.opt.good .key{border-color:var(--ok); color:var(--ok);}
.opt.bad{background:var(--ko-soft); border-color:var(--ko); color:var(--ko);}
.opt.bad .key{border-color:var(--ko); color:var(--ko);}

.inp{
  width:100%; padding:14px 15px; font-size:17px; border-radius:var(--r-m);
  border:1px solid var(--line); background:var(--panel); color:var(--ink); font-family:var(--body);
}
.inp:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
.inp.good{border-color:var(--ok); background:var(--ok-soft);}
.inp.bad{border-color:var(--ko); background:var(--ko-soft);}

.words{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px;}
.word{
  background:var(--panel); border:1px solid var(--line); color:var(--ink); cursor:pointer;
  border-radius:var(--r-s); padding:9px 12px; font-size:15px; font-family:var(--body);
}
.word:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
.word:disabled{opacity:.3; cursor:default;}
.slot{
  min-height:52px; border:1.5px dashed var(--line); border-radius:var(--r-m);
  padding:8px; display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:10px;
  background:var(--panel-2);
}
.slot.good{border-color:var(--ok); border-style:solid; background:var(--ok-soft);}
.slot.bad{border-color:var(--ko); border-style:solid; background:var(--ko-soft);}
.slot .ph{font-size:12.5px; color:var(--ink-3); padding:0 4px;}

.fb{
  margin-top:14px; border-radius:var(--r-m); padding:13px 15px; font-size:14px; line-height:1.5;
  animation:rise .28s cubic-bezier(.2,.8,.2,1);
}
.fb .hd{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.1em; font-size:11px;
  display:flex; align-items:center; gap:7px; margin-bottom:5px; font-weight:700;
}
.fb.ok{background:var(--ok-soft); color:var(--ok);}
.fb.ko{background:var(--ko-soft); color:var(--ko);}
.fb .sol{color:var(--ink); font-weight:600;}
.fb .exp{color:var(--ink-2); margin-top:4px;}
@keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
  max-width:min(460px, calc(100vw - 32px));
  background:var(--ink); color:var(--bg); border-radius:var(--r-m);
  padding:12px 16px; font-size:13.5px; line-height:1.45; text-align:center;
  box-shadow:var(--shadow-lift); z-index:30; pointer-events:none;
  animation:rise .25s cubic-bezier(.2,.8,.2,1);
}

.xpfly{
  position:fixed; left:50%; bottom:22%; transform:translateX(-50%);
  font-family:var(--display); font-size:22px; letter-spacing:.06em; color:var(--accent);
  pointer-events:none; animation:fly 1s ease-out forwards; z-index:20; font-weight:700;
}
@keyframes fly{0%{opacity:0; transform:translate(-50%,10px) scale(.9);} 25%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-60px) scale(1.05);}}

/* --- générateurs français : réserve infinie --- */
(function(){
  const P = ["je","tu","il","nous","vous","ils"];
  const V = [
    {i:"être",    pr:["suis","es","est","sommes","êtes","sont"],            im:["étais","étais","était","étions","étiez","étaient"],                pp:"été",   aux:"a"},
    {i:"avoir",   pr:["ai","as","a","avons","avez","ont"],                  im:["avais","avais","avait","avions","aviez","avaient"],                pp:"eu",    aux:"a"},
    {i:"aller",   pr:["vais","vas","va","allons","allez","vont"],           im:["allais","allais","allait","allions","alliez","allaient"],          pp:"allé",  aux:"e"},
    {i:"faire",   pr:["fais","fais","fait","faisons","faites","font"],      im:["faisais","faisais","faisait","faisions","faisiez","faisaient"],    pp:"fait",  aux:"a"},
    {i:"prendre", pr:["prends","prends","prend","prenons","prenez","prennent"], im:["prenais","prenais","prenait","prenions","preniez","prenaient"], pp:"pris", aux:"a"},
    {i:"pouvoir", pr:["peux","peux","peut","pouvons","pouvez","peuvent"],   im:["pouvais","pouvais","pouvait","pouvions","pouviez","pouvaient"],    pp:"pu",    aux:"a"},
    {i:"venir",   pr:["viens","viens","vient","venons","venez","viennent"], im:["venais","venais","venait","venions","veniez","venaient"],          pp:"venu",  aux:"e"},
    {i:"voir",    pr:["vois","vois","voit","voyons","voyez","voient"],      im:["voyais","voyais","voyait","voyions","voyiez","voyaient"],          pp:"vu",    aux:"a"},
    {i:"finir",   pr:["finis","finis","finit","finissons","finissez","finissent"], im:["finissais","finissais","finissait","finissions","finissiez","finissaient"], pp:"fini", aux:"a"},
    {i:"écrire",  pr:["écris","écris","écrit","écrivons","écrivez","écrivent"], im:["écrivais","écrivais","écrivait","écrivions","écriviez","écrivaient"], pp:"écrit", aux:"a"}
  ];
  const AVOIR = ["ai","as","a","avons","avez","ont"];
  const ETRE  = ["suis","es","est","sommes","êtes","sont"];
  const rnd = n => Math.floor(Math.random()*n);
  const eli = (p, f) => (p === "je" && /^[aeiouéêh]/i.test(f)) ? "j'"+f : p+" "+f;

  GENS["fr-conj"] = function(){
    const v = V[rnd(V.length)], p = rnd(6);
    const which = rnd(3);
    if (which === 0)
      return { f:"gap", q:"Présent : *"+P[p]+"* ("+v.i+") ___", a:v.pr[p],
               e:"« "+eli(P[p], v.pr[p])+" » au présent." };
    if (which === 1)
      return { f:"gap", q:"Imparfait : *"+P[p]+"* ("+v.i+") ___", a:v.im[p],
               e:"« "+eli(P[p], v.im[p])+" » à l'imparfait." };
    const aux = v.aux === "e" ? ETRE[p] : AVOIR[p];
    const pp  = v.aux === "e" ? (p >= 3 ? v.pp+"s" : v.pp) : v.pp;
    return { f:"gap", q:"Passé composé : *"+P[p]+"* ("+v.i+") ___", a:aux+" "+pp,
             e:v.aux === "e" ? "Avec l'auxiliaire être, le participe s'accorde avec le sujet." : "Auxiliaire avoir + participe passé « "+v.pp+" »." };
  };

  const NAT = [
    ["rapidement","adverbe"],["maison","nom"],["bleu","adjectif"],["celui","pronom"],
    ["sous","préposition"],["mais","conjonction"],["trois","déterminant"],["chanter","verbe"],
    ["heureusement","adverbe"],["courage","nom"],["mon","déterminant"],["qui","pronom"],
    ["pendant","préposition"],["donc","conjonction"],["fragile","adjectif"],["nous","pronom"]
  ];
  GENS["fr-classes"] = function(){
    const [w, nat] = NAT[rnd(NAT.length)];
    const all = ["nom","verbe","adjectif","adverbe","pronom","déterminant","préposition","conjonction"];
    const wrong = all.filter(x => x !== nat);
    const o = [nat, wrong[rnd(wrong.length)], wrong[rnd(wrong.length)]].filter((v,i,a) => a.indexOf(v) === i);
    while (o.length < 3){ const c = wrong[rnd(wrong.length)]; if (!o.includes(c)) o.push(c); }
    return { f:"qcm", q:"Classe grammaticale de « *"+w+"* » ?", o:o.sort(() => Math.random()-.5), a:nat,
             e:"« "+w+" » est un "+nat+"." };
  };
})();

(function(){
  const rnd = n => Math.floor(Math.random()*n);
  const PR = ["ich","du","er","wir","ihr","sie"];
  const DV = [
    {i:"fahren",  f:["fahre","fährst","fährt","fahren","fahrt","fahren"]},
    {i:"sprechen",f:["spreche","sprichst","spricht","sprechen","sprecht","sprechen"]},
    {i:"lesen",   f:["lese","liest","liest","lesen","lest","lesen"]},
    {i:"nehmen",  f:["nehme","nimmst","nimmt","nehmen","nehmt","nehmen"]},
    {i:"sein",    f:["bin","bist","ist","sind","seid","sind"]},
    {i:"haben",   f:["habe","hast","hat","haben","habt","haben"]},
    {i:"machen",  f:["mache","machst","macht","machen","macht","machen"]},
    {i:"arbeiten",f:["arbeite","arbeitest","arbeitet","arbeiten","arbeitet","arbeiten"]},
    {i:"geben",   f:["gebe","gibst","gibt","geben","gebt","geben"]},
    {i:"laufen",  f:["laufe","läufst","läuft","laufen","lauft","laufen"]}
  ];
  GENS["de-praesens"] = function(){
    const v = DV[rnd(DV.length)], p = rnd(6);
    return { f:"gap", q:"Präsens: *"+PR[p]+"* ("+v.i+") ___", a:v.f[p],
             e:PR[p]+" "+v.f[p]+"." };
  };

  /* cas : accusatif / datif sur des noms au genre connu */
  const N = [
    {w:"Mann",   g:"m"}, {w:"Hund",  g:"m"}, {w:"Bruder", g:"m"}, {w:"Lehrer", g:"m"},
    {w:"Frau",   g:"f"}, {w:"Schwester", g:"f"}, {w:"Lehrerin", g:"f"}, {w:"Stadt", g:"f"},
    {w:"Kind",   g:"n"}, {w:"Buch",  g:"n"}, {w:"Auto",  g:"n"}, {w:"Haus", g:"n"}
  ];
  const ART = {
    nom:{m:"der", f:"die", n:"das"},
    akk:{m:"den", f:"die", n:"das"},
    dat:{m:"dem", f:"der", n:"dem"}
  };
  const AKK_V = ["Ich sehe", "Ich kenne", "Er kauft", "Wir besuchen"];
  const DAT_V = ["Ich helfe", "Ich danke", "Das gehört", "Es gefällt"];
  const DAT_P = ["mit", "nach dem Kurs bei", "aus", "zu"];
  GENS["de-kasus"] = function(){
    const n = N[rnd(N.length)];
    const dat = Math.random() < 0.5;
    const opts = [ART.nom[n.g], ART.akk[n.g], ART.dat[n.g]].filter((v,i,a) => a.indexOf(v) === i);
    if (dat){
      const useVerb = Math.random() < 0.6;
      const head = useVerb ? DAT_V[rnd(DAT_V.length)] : "Ich fahre "+DAT_P[0];
      return { f:"qcm", q:head+" ___ "+n.w+".", o:opts.sort(() => Math.random()-.5), a:ART.dat[n.g],
               e:(useVerb ? "Ce verbe commande le datif" : "mit + datif")+" → "+ART.dat[n.g]+" "+n.w+"." };
    }
    return { f:"qcm", q:AKK_V[rnd(AKK_V.length)]+" ___ "+n.w+".", o:opts.sort(() => Math.random()-.5), a:ART.akk[n.g],
             e:"Complément direct → accusatif : "+ART.akk[n.g]+" "+n.w+"." };
  };

  const VOK = [
    ["la maison","das Haus"],["l'école","die Schule"],["le livre","das Buch"],["la voiture","das Auto"],
    ["le frère","der Bruder"],["la sœur","die Schwester"],["le jour","der Tag"],["l'année","das Jahr"],
    ["la nuit","die Nacht"],["l'eau","das Wasser"],["le pain","das Brot"],["la montagne","der Berg"],
    ["le lac","der See"],["le temps (météo)","das Wetter"],["l'argent","das Geld"],["le travail","die Arbeit"],
    ["l'ami","der Freund"],["la clé","der Schlüssel"],["la porte","die Tür"],["la question","die Frage"]
  ];
  GENS["de-vok"] = function(){
    const [fr, de] = VOK[rnd(VOK.length)];
    return { f:"txt", q:"Traduis avec l'article : *"+fr+"*", a:de, alt:[de.split(" ")[1]],
             e:de+"." };
  };
})();

        e:"Rangée : "+vals.slice().sort((a,b) => a-b).join(", ")+" → la valeur du milieu est "+med+"." }; }
    if (t === 2){ const vals = []; for (let i = 0; i < 4; i++) vals.push(ri(1,40));
      const et = Math.max.apply(null, vals) - Math.min.apply(null, vals);
      return { f:"txt", m:1, q:"Étendue de "+vals.join(", ")+" ?", a:String(et),
        e:Math.max.apply(null,vals)+" − "+Math.min.apply(null,vals)+" = "+et+"." }; }
    const r = ri(2,7), b = ri(2,8);
    return { f:"txt", m:1, q:"Sac de "+r+" boules rouges et "+b+" bleues. Probabilité de tirer une rouge ? (fraction)",
      a:frac(r, r+b), alt:[r+"/"+(r+b)], e:r+" cas favorables sur "+(r+b)+" → "+frac(r,r+b)+"." };
  };
})();
</script>

<script>
/* ============================================================
   ONZE — moteur
   Modèle : coquille quotidienne (série / XP / 3 blocs de 5 min)
            + répétition espacée à 5 boîtes sur les notions
            + carte de maîtrise par matière
   ============================================================ */
(function(){
"use strict";

const KEY   = "onze-v1";
const ELEVE = "";                      // signe le bilan ; vidé dans le build public
const BOXES = [0, 1, 3, 7, 14, 30];        // jours d'attente par boîte (1..5)
const BOX_LABEL = ["neuf","chaque j.","3 jours","1 sem.","2 sem.","acquis"];
const ORDER = ["francais","allemand","anglais","maths"];
const SCHOOL_START = "2026-08-24";          // rentrée : la ligne d'arrivée
const XP_RIGHT = 10, XP_COMBO = 5, XP_BLOCK = 25, XP_DAY = 50;

/* ---------- dates (locales, jamais UTC) ---------- */
function iso(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function today(){ return iso(new Date()); }
function parse(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parse(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a, b){ return Math.round((parse(b) - parse(a)) / 86400000); }
function frDate(s){
  const M = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const d = parse(s); return d.getDate()+" "+M[d.getMonth()];
}

/* ---------- utilitaires ---------- */
function shuffle(a){ const r = a.slice(); for (let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]] = [r[j],r[i]]; } return r; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function norm(s){
  return String(s == null ? "" : s).trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’´`]/g,"'").replace(/[−–—]/g,"-")
    .replace(/[.!?;:]+$/,"").replace(/\s+/g," ");
}
/* réponses de maths : espaces sans importance, virgule = point décimal */
function normMath(s){
  return norm(s).replace(/\s+/g,"").replace(/(\d),(\d)/g,"$1.$2").replace(/^\+/,"");
}
/* certains items portent sur l'accent lui-même (a/à, ou/où, la/là) : on le garde */
function normAcc(s){
  return String(s == null ? "" : s).trim().toLowerCase()
    .replace(/[’´`]/g,"'").replace(/[−–—]/g,"-")
    .replace(/[.!?;:]+$/,"").replace(/\s+/g," ");
}
function eq(a, b, it){
  it = it || {};
  if (it.m) return normMath(a) === normMath(b);
  if (it.acc) return normAcc(a) === normAcc(b);
  return norm(a) === norm(b);
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* met en évidence *le mot* entre astérisques, et rend 2^5 en exposant */
function fmt(s){
  return esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\^\(([^)]+)\)/g, "<sup>$1</sup>")
    .replace(/\^(-?\d+)/g, "<sup>$1</sup>");
}

/* ---------- catalogue des notions ---------- */
const THEMES = [];        // toutes les notions, à plat
const THEME_BY_ID = {};
ORDER.forEach(sk => {
  const sub = BANK[sk];
  if (!sub) return;
  sub.themes.forEach((t, i) => {
    t.subject = sk; t.order = i;
    THEMES.push(t); THEME_BY_ID[t.id] = t;
  });
});
const SUB = {
  francais:{label:"Français", short:"FR"},
  allemand:{label:"Allemand", short:"DE"},
  anglais: {label:"Anglais",  short:"EN"},
  maths:   {label:"Maths",    short:"MA"}
};

/* ---------- état ---------- */
function fresh(){
  return {
    v:1, start: today(), xp:0, streak:0, best:0, lastDay:null,
    themes:{},              // id -> {box, due, seen, right, used:[idx]}
    days:{},                // "YYYY-MM-DD" -> {blocks:[], xp, right, total}
    badges:[]
  };
}
let S = fresh();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (raw){ const o = JSON.parse(raw); if (o && o.v === 1) S = o; }
  }catch(e){ /* premier lancement, ou stockage indisponible */ }
  THEMES.forEach(t => {
    if (!S.themes[t.id]) S.themes[t.id] = { box:0, due:today(), seen:0, right:0, used:[] };
  });
  save();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ /* mode privé : la session marche quand même */ }
}

/* ---------- répétition espacée ---------- */
function dueThemes(){
  const t0 = today();
  return THEMES.filter(t => {
    const st = S.themes[t.id];
    return st.box >= 1 && st.box <= 5 && st.due <= t0;
  }).sort((a,b) => {
    const A = S.themes[a.id], B = S.themes[b.id];
    return A.box - B.box || (A.due < B.due ? -1 : 1);
  });
}
function seenThemes(){ return THEMES.filter(t => S.themes[t.id].box >= 1); }
function newThemes(sk){ return THEMES.filter(t => S.themes[t.id].box === 0 && (!sk || t.subject === sk)); }
function mastery(t){
  const st = S.themes[t.id];
  if (!st.seen) return null;
  const acc = st.right / st.seen;
  return Math.max(0, Math.min(100, Math.round(60*acc + 40*(Math.max(0,st.box-1)/4))));
}
function subjectMastery(sk){
  const vals = BANK[sk].themes.map(mastery).filter(v => v !== null);
  if (!vals.length) return null;
  const total = BANK[sk].themes.length;
  const sum = vals.reduce((a,b) => a+b, 0);
  return Math.round(sum / total);          // les notions jamais vues comptent 0 : la barre = avancement réel
}
function moveBox(themeId, acc){
  const st = S.themes[themeId];
  const from = st.box;
  let to = from;
  if (from === 0) to = 1;
  else if (acc >= 0.8) to = Math.min(5, from+1);
  else if (acc < 0.5)  to = 1;
  st.box = to;
  st.due = addDays(today(), BOXES[to] || 1);
  return { from, to };
}

/* ---------- tirage d'exercices ---------- */
function itemsFor(theme, n){
  const st = S.themes[theme.id];
  const out = [];
  const bank = theme.items || [];
  let pool = bank.map((_, i) => i).filter(i => !(st.used || []).includes(i));
  if (pool.length < n) { st.used = []; pool = bank.map((_, i) => i); }
  shuffle(pool).slice(0, n).forEach(i => {
    out.push(Object.assign({}, bank[i], { theme: theme.id, subject: theme.subject, bankIdx: i }));
  });
  // générateurs : réserve infinie quand la banque est épuisée
  if (out.length < n && theme.gen && GENS[theme.gen]){
    let guard = 0;
    while (out.length < n && guard++ < 40){
      const g = GENS[theme.gen]();
      if (g && !out.some(o => o.q === g.q)){
        out.push(Object.assign(g, { theme: theme.id, subject: theme.subject, gen:true }));
      }
    }
  }
  return out.slice(0, n);
}
function markUsed(item){
  if (item.gen || item.bankIdx == null) return;
  const st = S.themes[item.theme];
  st.used = st.used || [];
  if (!st.used.includes(item.bankIdx)) st.used.push(item.bankIdx);
  if (st.used.length > Math.max(4, (THEME_BY_ID[item.theme].items || []).length - 3)) st.used = st.used.slice(-4);
}

/* ---------- le plan du jour ---------- */
function todaysPlan(){
  const t0 = today();
  const dayIx = Math.max(0, diffDays(S.start, t0));
  const done = (S.days[t0] && S.days[t0].blocks) || [];

  // 1. Révision : ce que les boîtes réclament aujourd'hui
  const due = dueThemes().slice(0, 4);
  const rev = { kind:"revision", n:1, title:"Révision", themes: due.map(t => t.id),
    sub: due.length
      ? "Les notions que tes boîtes réclament aujourd'hui."
      : "Rien à revoir aujourd'hui — je te fais réviser tes notions les plus fragiles." };
  if (!due.length){
    const weak = seenThemes().sort((a,b) => (mastery(a)||0) - (mastery(b)||0)).slice(0,2);
    if (weak.length){
      rev.themes = weak.map(t => t.id);
    } else {
      const basics = THEMES.filter(t => t.tier === "revision" && S.themes[t.id].box === 0).slice(0,2);
      rev.themes = basics.map(t => t.id);
      rev.title = "Échauffement";
      rev.sub = "On part des acquis de 10e — c'est ce qui remplit tes boîtes de révision.";
    }
  }

  // 2. Leçon du jour : nouvelle notion, matières en rotation
  let lead = null;
  for (let k = 0; k < ORDER.length && !lead; k++){
    const sk = ORDER[(dayIx + k) % ORDER.length];
    const cands = newThemes(sk);
    if (cands.length) lead = cands.sort((a,b) => a.order - b.order)[0];
  }
  const lesson = lead
    ? { kind:"lesson", n:2, title:"Leçon du jour", themes:[lead.id], sub: lead.t }
    : { kind:"lesson", n:2, title:"Reprise", themes:[ (seenThemes().sort((a,b) => (mastery(a)||0)-(mastery(b)||0))[0] || THEMES[0]).id ],
        sub:"Tout le programme est passé au moins une fois — on reprend le point le plus fragile, leçon comprise." };

  // 3. Défi mixte : les 4 matières mélangées, au chrono
  const pool = seenThemes().length >= 4 ? seenThemes() : THEMES;
  const bySub = {};
  shuffle(pool).forEach(t => { if (!bySub[t.subject]) bySub[t.subject] = t; });
  const defi = { kind:"defi", n:3, title:"Défi mixte", themes: Object.values(bySub).map(t => t.id),
    sub:"Six questions, les quatre matières mélangées. Les combos rapportent double." };

  return [rev, lesson, defi].map(b => Object.assign(b, { done: done.includes(b.kind) }));
}
function blockItems(block){
  const ids = block.themes.filter(id => THEME_BY_ID[id]);
  if (!ids.length) return [];
  const per = block.kind === "lesson" ? 8 : block.kind === "defi" ? 6 : 8;
  if (block.kind === "lesson") return itemsFor(THEME_BY_ID[ids[0]], per);
  const each = Math.max(1, Math.ceil(per / ids.length));
  let out = [];
  ids.forEach(id => { out = out.concat(itemsFor(THEME_BY_ID[id], each)); });
  return shuffle(out).slice(0, per);
}

/* ---------- badges ---------- */
const BADGES = [
  { id:"d3",   em:"🔥", t:"3 jours",        ok:s => s.best >= 3 },
  { id:"d7",   em:"🔥", t:"1 semaine",      ok:s => s.best >= 7 },
  { id:"d14",  em:"🔥", t:"2 semaines",     ok:s => s.best >= 14 },
  { id:"d30",  em:"🏔", t:"30 jours",       ok:s => s.best >= 30 },
  { id:"xp1",  em:"⭐", t:"1000 XP",        ok:s => s.xp >= 1000 },
  { id:"xp5",  em:"🌟", t:"5000 XP",        ok:s => s.xp >= 5000 },
  { id:"acq",  em:"📦", t:"1re notion acquise", ok:s => THEMES.some(t => s.themes[t.id].box === 5) },
  { id:"acq10",em:"🎓", t:"10 notions acquises", ok:s => THEMES.filter(t => s.themes[t.id].box === 5).length >= 10 },
  { id:"full", em:"✅", t:"Journée complète", ok:s => Object.values(s.days).some(d => (d.blocks||[]).length >= 3) },
  { id:"net",  em:"🎯", t:"Sans faute",      ok:s => Object.values(s.days).some(d => d.total >= 6 && d.right === d.total) }
];
function refreshBadges(){
  const got = [];
  BADGES.forEach(b => { if (b.ok(S)) got.push(b.id); });
  const isNew = got.filter(id => !S.badges.includes(id));
  S.badges = got;
  return isNew;
}

/* ---------- fin de bloc : compta ---------- */
function recordBlock(block, res){
  const t0 = today();
  const d = S.days[t0] || { blocks:[], xp:0, right:0, total:0 };
  if (!d.blocks.includes(block.kind)) d.blocks.push(block.kind);
  d.xp += res.xp; d.right += res.right; d.total += res.total;
  S.days[t0] = d;

  // série : un bloc suffit à tenir la journée
  if (S.lastDay !== t0){
    S.streak = (S.lastDay && diffDays(S.lastDay, t0) === 1) ? S.streak + 1 : 1;
    S.lastDay = t0;
  }
  S.best = Math.max(S.best, S.streak);

  let bonus = XP_BLOCK;
  if (d.blocks.length === 3) bonus += XP_DAY;
  S.xp += res.xp + bonus;

  const moves = [];
  Object.keys(res.byTheme).forEach(id => {
    const r = res.byTheme[id];
    const st = S.themes[id];
    st.seen += r.total; st.right += r.right;
    const mv = moveBox(id, r.total ? r.right / r.total : 0);
    if (mv.from !== mv.to) moves.push({ id, from:mv.from, to:mv.to });
  });
  const newBadges = refreshBadges();
  save();
  return { bonus, moves, newBadges, dayComplete: d.blocks.length === 3 };
}

/* ============================================================
   Rendu
   ============================================================ */
const root = document.getElementById("onze");
let view = { screen:"home" };

function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem("onze-theme", t); }catch(e){}
}
function currentTheme(){
  const set = document.documentElement.getAttribute("data-theme");
  if (set) return set;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function render(){
  if (view.screen === "home")    root.innerHTML = homeHTML(), bindHome();
  else if (view.screen === "session") renderSession();
  else if (view.screen === "done")    root.innerHTML = doneHTML(), bindDone();
  window.scrollTo(0, 0);
}

/* ---------- accueil ---------- */
function homeHTML(){
  const t0 = today();
  const plan = todaysPlan();
  const d = S.days[t0] || { blocks:[], xp:0 };
  const toSchool = Math.max(0, diffDays(t0, SCHOOL_START));
  const weekDone = weekCount();

  const acq = THEMES.filter(t => S.themes[t.id].box === 5).length;

  return `
  <div class="board"><div class="board-in">

      </div>

    </div>
    <div class="scores">
      <div class="score hot"><span class="k">Série</span><span class="v">${S.streak}<span style="font-size:12px;color:var(--ink-3)"> j</span></span></div>
      <div class="score"><span class="k">XP</span><span class="v">${S.xp.toLocaleString("fr-CH")}</span></div>
      <div class="score"><span class="k">Acquis</span><span class="v">${acq}<span style="font-size:12px;color:var(--ink-3)">/${THEMES.length}</span></span></div>
    </div>
    <div class="weekbar">
      <div class="lab"><span>Semaine · ${weekDone}/5 jours</span><span>J−${toSchool} · rentrée</span></div>
      <div class="meter"><i style="width:${Math.min(100, weekDone/5*100)}%"></i></div>
    </div>
  </div></div>

  <div class="wrap">
    <div class="sec">
      <div class="sec-h">
        <h2>Aujourd'hui · ${frDate(t0)}</h2>

      <div class="blocks">
        ${plan.map(blockHTML).join("")}
      </div>

    <div class="sec">
      <div class="sec-h"><h2>Maîtrise</h2><span class="note">${THEMES.length} notions</span></div>
      <div class="card">
        ${ORDER.map(sk => {
          const m = subjectMastery(sk);
          const seen = BANK[sk].themes.filter(t => S.themes[t.id].box >= 1).length;
          return `<div class="mrow">
            <span class="nm" style="color:var(--${shortVar(sk)})">${SUB[sk].label}</span>
            <span class="bar"><i style="width:${m === null ? 0 : m}%; background:var(--${shortVar(sk)})"></i></span>
            <span class="val">${m === null ? "—" : "<b>"+m+"%</b>"} · ${seen}/${BANK[sk].themes.length}</span>
          </div>`;
        }).join("")}
        <div class="boxes">
          ${[1,2,3,4,5].map(b => {
            const n = THEMES.filter(t => S.themes[t.id].box === b).length;
            return `<div class="boxcell${b===5?" b5":""}"><div class="n">${n}</div><div class="l">${BOX_LABEL[b]}</div></div>`;
          }).join("")}
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>À retravailler</h2></div>

      <div class="card">${calHTML()}</div>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>Trophées</h2><span class="note">${S.badges.length}/${BADGES.length}</span></div>
      <div class="card badges">
        ${BADGES.map(b => `<span class="badge${S.badges.includes(b.id) ? " on":""}"><span class="em">${b.em}</span>${esc(b.t)}</span>`).join("")}
      </div>

    <div class="foot">
      <button class="link" id="bil">Envoyer mon bilan</button>
      <button class="link" id="rst">Tout remettre à zéro</button>
    </div>
  </div>`;
}
function shortVar(sk){ return { francais:"fr", allemand:"de", anglais:"en", maths:"ma" }[sk]; }

function blockHTML(b){
  const chips = b.kind === "defi"
    ? [`<span class="chip mix">4 matières</span>`]
    : b.themes.map(id => {
        const t = THEME_BY_ID[id]; if (!t) return "";
        return `<span class="chip ${t.subject}">${SUB[t.subject].short} · ${esc(t.t)}</span>`;
      });
  const nQ = b.kind === "defi" ? 6 : 8;
  return `<button class="block${b.done ? " done":""}" data-kind="${b.kind}" ${b.done ? "disabled":""}>

}

function weakHTML(){
  const seen = seenThemes().map(t => ({ t, m: mastery(t) })).filter(x => x.m !== null);
  if (!seen.length) return `<div class="empty">Rien encore : fais tes premiers blocs et je repère tout seul ce qui accroche. Les notions ratées reviennent dès le lendemain.</div>`;
  const weak = seen.sort((a,b) => a.m - b.m).slice(0,5);
  return `<div class="weak">${weak.map(x => `

function calHTML(){
  const t0 = today();
  const first = addDays(S.start, -(( parse(S.start).getDay() + 6) % 7));   // lundi de la semaine de départ
  const weeks = Math.max(6, Math.ceil((diffDays(first, SCHOOL_START) + 1) / 7));
  const cells = [];
  for (let i = 0; i < weeks*7; i++){
    const day = addDays(first, i);
    const rec = S.days[day];
    const n = rec ? (rec.blocks || []).length : 0;
    const cls = ["cd"];
    if (day < S.start) cls.push("void");
    else if (day > t0) cls.push("future");
    if (day === t0) cls.push("today");
    if (n >= 3) cls.push("full");
    cells.push(`<div class="${cls.join(" ")}" title="${day}${n ? " · "+n+" bloc(s)":""}">
      ${day < S.start ? "" : `<span>${parse(day).getDate()}</span>
      <span class="pips">${[0,1,2].map(k => k < n ? "<i></i>" : "").join("")}</span>`}
      ${day === SCHOOL_START ? '<span class="school" title="Rentrée"></span>' : ""}
    </div>`);
  }
  return `<div class="cal-head">${["lu","ma","me","je","ve","sa","di"].map(d => `<div>${d}</div>`).join("")}</div>
    <div class="cal">${cells.join("")}</div>`;
}

function weekCount(){
  const t0 = today();
  const mon = addDays(t0, -((parse(t0).getDay() + 6) % 7));
  let n = 0;
  for (let i = 0; i < 7; i++){
    const d = addDays(mon, i);
    if (S.days[d] && (S.days[d].blocks || []).length) n++;
  }
  return n;
}

function bindHome(){
  root.querySelectorAll(".block:not(:disabled)").forEach(el => {
    el.addEventListener("click", () => startBlock(el.dataset.kind));
  });
  const th = root.querySelector("#th");
  if (th) th.addEventListener("click", () => { setTheme(currentTheme() === "dark" ? "light" : "dark"); render(); });
  const bil = root.querySelector("#bil");
  if (bil) bil.addEventListener("click", envoyerBilan);
  const rst = root.querySelector("#rst");
  if (rst) rst.addEventListener("click", () => {
    if (confirm("Effacer la série, les XP et toutes les boîtes de révision ? On repart de zéro.")){
      S = fresh(); THEMES.forEach(t => S.themes[t.id] = { box:0, due:today(), seen:0, right:0, used:[] });
      save(); render();
    }
  });
}

/* ---------- le bilan : faire sortir la progression de l'appareil ----------
   La progression vit dans localStorage, donc dans CE navigateur et nulle part
   ailleurs. Le bilan est le seul pont : un fichier que l'élève envoie quand il
   le décide. Rien ne part tout seul, aucun appel réseau — c'est la feuille de
   partage du téléphone qui fait le travail. */
function toast(msg){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  el.setAttribute("role", "status");
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function bilan(){
  const t0 = today();

  const boites = {};
  [1,2,3,4,5].forEach(b => { boites[BOX_LABEL[b]] = THEMES.filter(t => S.themes[t.id].box === b).length; });

  const matieres = {};
  ORDER.forEach(sk => {
    matieres[SUB[sk].label] = {
      maitrise: subjectMastery(sk),
      notions_vues: BANK[sk].themes.filter(t => S.themes[t.id].box >= 1).length,
      notions_total: BANK[sk].themes.length
    };
  });

  const fragiles = seenThemes()
    .map(t => ({ t, m: mastery(t) })).filter(x => x.m !== null)
    .sort((a,b) => a.m - b.m).slice(0,5)
    .map(x => ({
      matiere: SUB[x.t.subject].label, notion: x.t.t, niveau: x.t.tier,
      boite: S.themes[x.t.id].box, maitrise: x.m,
      reussite: S.themes[x.t.id].right + "/" + S.themes[x.t.id].seen
    }));

  const activite = Object.keys(S.days).sort().slice(-21).map(d => ({
    jour: d, blocs: (S.days[d].blocks || []).length,
    justes: S.days[d].right, questions: S.days[d].total, xp: S.days[d].xp
  }));

  return {
    app: "onze", format: 1, eleve: ELEVE, genere: t0,
    depuis: S.start,
    jours_avant_rentree: Math.max(0, diffDays(t0, SCHOOL_START)),
    serie: { actuelle: S.streak, record: S.best },
    xp: S.xp,
    notions: { total: THEMES.length, vues: seenThemes().length,
               acquises: THEMES.filter(t => S.themes[t.id].box === 5).length },
    boites: boites,
    matieres: matieres,
    fragiles: fragiles,
    activite: activite,
    trophees: S.badges,
    // sauvegarde intégrale : sans elle, vider le navigateur efface tout sans retour
    etat: S
  };
}

function envoyerBilan(){
  let data, txt;
  try{
    data = bilan();
    txt = JSON.stringify(data, null, 2);
  }catch(e){
    toast("Le bilan n'a pas pu être préparé. Montre l'app à un adulte.");
    return;
  }

  const nom = "ONZE_bilan_" + (ELEVE || "eleve") + "_" + data.genere + ".json";
  const blob = new Blob([txt], { type:"application/json" });

  // 1) feuille de partage native : kDrive y apparaît comme destination
  try{
    const fichier = new File([blob], nom, { type:"application/json" });
    if (navigator.canShare && navigator.canShare({ files:[fichier] })){
      navigator.share({ files:[fichier], title:"Bilan ONZE" })
        .then(() => toast("Bilan envoyé. Bravo — tu peux retourner réviser."))
        .catch(err => { if (!err || err.name !== "AbortError") telecharger(blob, nom); });
      return;
    }
  }catch(e){ /* File ou canShare indisponible : on télécharge */ }

  telecharger(blob, nom);
}

function telecharger(blob, nom){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Bilan enregistré : « " + nom + " ». Dépose-le dans kDrive.");
  }catch(e){
    toast("Impossible d'enregistrer le bilan sur cet appareil.");
  }
}

/* ---------- session ---------- */
let sess = null;

function startBlock(kind){
  const block = todaysPlan().find(b => b.kind === kind);
  if (!block) return;
  const items = blockItems(block);
  if (!items.length){ alert("Pas d'exercice disponible pour ce bloc."); return; }
  sess = {
    block, items, i:0, xp:0, right:0, total:0, combo:0, bestCombo:0,
    byTheme:{}, answered:false, correct:null, chosen:null, built:[],
    phase:"quiz"
  };
  const first = THEME_BY_ID[block.themes[0]];
  if (block.kind === "lesson" || (block.kind === "revision" && first && S.themes[first.id].box <= 1)) sess.phase = "lesson";
  if (sess.phase === "lesson" && !lessonTheme()) sess.phase = "quiz";
  view = { screen:"session" };
  render();
}
function lessonTheme(){
  const id = sess.block.themes[0];
  const t = THEME_BY_ID[id];
  return (t && t.lesson) ? t : null;
}

function renderSession(){
  if (sess.phase === "lesson"){ root.innerHTML = lessonHTML(); bindLesson(); return; }
  const it = sess.items[sess.i];
  // les mots à remettre dans l'ordre doivent être tirés AVANT le premier rendu
  if (it && it.f === "ord" && !sess.pool) sess.pool = shuffle(it.w);
  root.innerHTML = quizHTML(); bindQuiz();
}

function lessonHTML(){
  const t = lessonTheme();
  const st = S.themes[t.id];
  const isNew = st.box === 0;
  return `<div class="wrap">
    ${topHTML(0)}
    <div class="lesson">
      <div class="kicker">${isNew ? "Nouvelle notion" : "On révise d'abord"} · ${SUB[t.subject].label} · ${esc(t.tier === "revision" ? "acquis de 10e" : t.tier === "consolidation" ? "10e confirmé" : "avance sur la 11e")}</div>
      <h3 style="color:var(--${shortVar(t.subject)})">${esc(t.t)}</h3>
      ${t.lesson.why ? `<div class="why">${esc(t.lesson.why)}</div>` : ""}
      <ul class="pts">
        ${t.lesson.pts.map(p => `<li><span class="d"></span><span>${fmt(p)}</span></li>`).join("")}
      </ul>
      ${t.lesson.ex ? `<div class="exbox"><span class="lab">Exemple</span>${fmt(t.lesson.ex)}</div>` : ""}
    </div>
    <button class="cta" id="go">C'est compris → ${sess.items.length} questions</button>
  </div>`;
}
function bindLesson(){
  root.querySelector("#go").addEventListener("click", () => { sess.phase = "quiz"; render(); });
}

function topHTML(frac){
  const c = sess.combo;
  return `<div class="s-top"><div class="s-top-in">
      <button class="quit" id="quit" aria-label="Quitter">✕</button>
      <span class="prog"><i style="width:${Math.round(frac*100)}%"></i></span>
      <span class="combo${c >= 3 ? " hot":""}">${c >= 2 ? "×"+c+" 🔥" : sess.total ? sess.right+"/"+sess.total : "&nbsp;"}</span>
    </div></div>`;
}

function quizHTML(){
  const it = sess.items[sess.i];
  const t  = THEME_BY_ID[it.theme];
  const sk = it.subject;
  const body =
    it.f === "qcm" ? optsHTML(it) :
    it.f === "ord" ? ordHTML(it)  : inputHTML(it);

  return `<div class="wrap">
    ${topHTML(sess.i / sess.items.length)}
    <div class="q">
      <div class="meta">
        <span class="chip ${sk}">${SUB[sk].short}</span>
        <span class="th">${esc(t ? t.t : "")} · ${sess.i+1}/${sess.items.length}</span>
      </div>
      <div class="txt">${fmt(it.q)}</div>
      ${it.hint && !sess.answered ? `<div class="hint">${esc(it.hint)}</div>` : ""}
      ${body}
      ${sess.answered ? fbHTML(it) : ""}
    </div>
    ${sess.answered ? `<button class="cta" id="next">${sess.i+1 >= sess.items.length ? "Voir le bilan" : "Suivant →"}</button>` : ""}
  </div>`;
}
function optsHTML(it){
  const keys = ["A","B","C","D","E"];
  return `<div class="opts">${it.o.map((o, i) => {
    let cls = "opt";
    if (sess.answered){
      if (eq(o, it.a, it)) cls += " good";
      else if (sess.chosen === i) cls += " bad";
    }
    return `<button class="${cls}" data-i="${i}" ${sess.answered ? "disabled":""}>
      <span class="key">${keys[i]}</span><span>${fmt(o)}</span></button>`;
  }).join("")}</div>`;
}
function inputHTML(it){
  const cls = sess.answered ? (sess.correct ? "inp good" : "inp bad") : "inp";
  return `<input class="${cls}" id="ans" value="${esc(sess.typed || "")}" ${sess.answered ? "disabled":""}
      placeholder="${it.f === "gap" ? "le mot qui manque" : "ta réponse"}" autocomplete="off"
      autocapitalize="off" spellcheck="false" inputmode="${it.num ? "text" : "text"}">
    ${sess.answered ? "" : `<button class="cta" id="chk">Vérifier</button>`}`;
}
function ordHTML(it){
  const rest = sess.pool || [];
  const cls = sess.answered ? (sess.correct ? "slot good" : "slot bad") : "slot";
  return `<div class="${cls}" id="slot">
      ${sess.built.length ? sess.built.map((w, i) => `<button class="word" data-b="${i}" ${sess.answered ? "disabled":""}>${esc(w)}</button>`).join("")
        : `<span class="ph">Clique les mots dans le bon ordre</span>`}
    </div>
    <div class="words">${rest.map((w, i) => `<button class="word" data-w="${i}" ${sess.answered || w === null ? "disabled":""}>${esc(w === null ? "·" : w)}</button>`).join("")}</div>
    ${sess.answered ? "" : `<button class="cta" id="chk" ${sess.built.length ? "" : "disabled"}>Vérifier</button>`}`;
}
function fbHTML(it){
  const good = sess.correct;
  return `<div class="fb ${good ? "ok":"ko"}">
    <div class="hd">${good ? "Juste" + (sess.combo >= 3 ? " · combo ×"+sess.combo : "") : "Pas encore"}</div>
    ${good ? "" : `<div class="sol">${fmt(Array.isArray(it.a) ? it.a[0] : it.a)}</div>`}
    ${it.e ? `<div class="exp">${fmt(it.e)}</div>` : ""}
  </div>`;
}

function bindQuiz(){
  const it = sess.items[sess.i];
  root.querySelector("#quit").addEventListener("click", quitSession);

  if (!sess.answered){
    if (it.f === "qcm"){
      root.querySelectorAll(".opt").forEach(el => el.addEventListener("click", () => {
        const i = Number(el.dataset.i);
        sess.chosen = i;
        grade(eq(it.o[i], it.a, it));
      }));
    } else if (it.f === "ord"){
      root.querySelectorAll("[data-w]").forEach(el => el.addEventListener("click", () => {
        const i = Number(el.dataset.w);
        if (sess.pool[i] == null) return;
        sess.built.push(sess.pool[i]); sess.pool[i] = null; renderSession();
      }));
      root.querySelectorAll("[data-b]").forEach(el => el.addEventListener("click", () => {
        const i = Number(el.dataset.b);
        const w = sess.built.splice(i, 1)[0];
        const slot = sess.pool.indexOf(null);
        if (slot >= 0) sess.pool[slot] = w; else sess.pool.push(w);
        renderSession();
      }));
      const chk = root.querySelector("#chk");
      if (chk) chk.addEventListener("click", () => grade(norm(sess.built.join(" ")) === norm(it.a)));
    } else {
      const inp = root.querySelector("#ans");
      const check = () => {
        const v = inp.value;
        sess.typed = v;
        const answers = [it.a].concat(it.alt || []);
        grade(answers.some(a => eq(a, v, it)));
      };
      inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
      inp.addEventListener("input", () => { sess.typed = inp.value; });
      root.querySelector("#chk").addEventListener("click", check);
      setTimeout(() => { try{ inp.focus({ preventScroll:true }); }catch(e){} }, 60);
    }
  } else {
    root.querySelector("#next").addEventListener("click", nextItem);
  }
}

function grade(ok){
  const it = sess.items[sess.i];
  sess.answered = true; sess.correct = ok;
  sess.total++;
  const bt = sess.byTheme[it.theme] || (sess.byTheme[it.theme] = { right:0, total:0 });
  bt.total++;
  if (ok){
    sess.right++; bt.right++;
    sess.combo++; sess.bestCombo = Math.max(sess.bestCombo, sess.combo);
    let gain = XP_RIGHT + (sess.combo >= 3 ? XP_COMBO : 0);
    if (sess.block.kind === "defi") gain = Math.round(gain * 1.5);
    sess.xp += gain;
    flyXP(gain);
  } else {
    sess.combo = 0;
  }
  markUsed(it);
  renderSession();
}
function flyXP(n){
  const el = document.createElement("div");
  el.className = "xpfly"; el.textContent = "+" + n + " XP";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function nextItem(){
  if (sess.i + 1 >= sess.items.length){ finish(); return; }
  sess.i++; sess.answered = false; sess.correct = null; sess.chosen = null;
  sess.typed = ""; sess.built = []; sess.pool = null;
  renderSession();
}
function quitSession(){
  if (sess.total && !confirm("Quitter maintenant ? Les questions déjà faites ne compteront pas.")) return;
  sess = null; view = { screen:"home" }; render();
}
function finish(){
  const out = recordBlock(sess.block, { xp:sess.xp, right:sess.right, total:sess.total, byTheme:sess.byTheme });
  view = { screen:"done", res:{
    kind: sess.block.kind, title: sess.block.title,
    right: sess.right, total: sess.total, xp: sess.xp, bonus: out.bonus,
    bestCombo: sess.bestCombo, moves: out.moves, newBadges: out.newBadges, dayComplete: out.dayComplete
  }};
  sess = null; render();
}

/* ---------- bilan ---------- */
function doneHTML(){
  const r = view.res;
  const pct = r.total ? Math.round(100 * r.right / r.total) : 0;
  const R = 58, C = 2 * Math.PI * R;
  const col = pct >= 80 ? "var(--ok)" : pct >= 50 ? "var(--accent)" : "var(--ko)";
  const word = pct >= 90 ? "Impeccable" : pct >= 75 ? "Solide" : pct >= 50 ? "Ça avance" : "On y retourne";
  const left = 3 - ((S.days[today()] || {}).blocks || []).length;

  return `<div class="wrap"><div class="done-wrap">
    <div class="ring">
      <svg width="132" height="132" viewBox="0 0 132 132" aria-hidden="true">
        <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--panel-2)" stroke-width="9"></circle>
        <circle cx="66" cy="66" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct/100)}"></circle>
      </svg>
      <div class="mid"><span class="pc" style="color:${col}">${pct}%</span><span class="of">${r.right}/${r.total}</span></div>
    </div>
    <h2>${esc(word)}</h2>
    <div class="line">${esc(r.title)} terminé${r.dayComplete ? " — et la journée est complète 🏁" : left > 0 ? " · encore "+left+" bloc"+(left>1?"s":"")+" aujourd'hui" : ""}</div>
    <div class="gain">
      <div class="g"><div class="k">XP gagnés</div><div class="v" style="color:var(--accent)">+${r.xp + r.bonus}</div></div>
      <div class="g"><div class="k">Meilleur combo</div><div class="v">×${r.bestCombo}</div></div>
      <div class="g"><div class="k">Série</div><div class="v">${S.streak} j</div></div>
    </div>
    ${r.moves.length ? `<div class="moves">${r.moves.map(m => {
      const t = THEME_BY_ID[m.id];
      const up = m.to > m.from;
      return `<div class="move">
        <span class="chip ${t.subject}">${SUB[t.subject].short}</span>
        <span style="flex:1">${esc(t.t)}</span>
        <span class="ar">${m.from === 0 ? "neuf" : "boîte "+m.from} → <span class="${up ? "up":"dn"}">${m.to === 5 ? "acquis ✓" : "boîte "+m.to}</span></span>
      </div>`;
    }).join("")}</div>` : ""}
    ${r.newBadges.length ? `<div class="gain" style="margin-top:14px">${r.newBadges.map(id => {
      const b = BADGES.find(x => x.id === id);
      return `<div class="g" style="background:var(--accent-soft)"><div class="k">Nouveau trophée</div><div class="v" style="font-size:14px;color:var(--accent)">${b.em} ${esc(b.t)}</div></div>`;
    }).join("")}</div>` : ""}
    <button class="cta" id="back" style="margin-top:24px">Retour au tableau</button>
    ${left > 0 ? `<button class="cta ghost" id="more" style="margin-top:10px">Enchaîner le bloc suivant →</button>` : ""}
  </div></div>`;
}
function bindDone(){
  root.querySelector("#back").addEventListener("click", () => { view = { screen:"home" }; render(); });
  const more = root.querySelector("#more");
  if (more) more.addEventListener("click", () => {
    const nxt = todaysPlan().find(b => !b.done);
    if (nxt) startBlock(nxt.kind); else { view = { screen:"home" }; render(); }
  });
}

/* ---------- démarrage ---------- */
try{
  try{ const saved = localStorage.getItem("onze-theme"); if (saved) setTheme(saved); }catch(e){}
  load();
  refreshBadges(); save();
  render();
} catch(err){
  // plutôt qu'une page blanche : dire ce qui s'est passé, et laisser une porte de sortie
  root.innerHTML = '<div class="wrap" style="padding-top:40px">'
    + '<h1 style="font-family:var(--display); text-transform:uppercase; letter-spacing:.06em; font-size:22px; margin:0 0 10px">ONZE n\'a pas pu démarrer</h1>'
    + '<p style="font-size:14px; color:var(--ink-2); line-height:1.5">Recharge la page. Si le message revient, transmets cette ligne :</p>'
    + '<pre class="exbox" style="white-space:pre-wrap; font-family:var(--mono); font-size:12px">'
    + String((err && err.message) || err) + '</pre>'
    + '<button class="cta" id="wipe">Repartir d\'un carnet vide</button></div>';
  const w = root.querySelector("#wipe");
  if (w) w.addEventListener("click", () => {
    try{ localStorage.removeItem(KEY); }catch(e){}
    location.reload();
  });
}
})();
